    - { url: /images/events/extra/oldowan-tools-2.webp, credit: "Archaeomoonwalker, CC BY 3.0, via Wikimedia Commons", caption: "Oldowan chopper from Olduvai Gorge, about 1.8 million years old (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Olduvai_Chopper.JPG" }
  media:
    - { kind: video, src: "https://www.youtube.com/watch?v=uVTQBQfbqJc", title: "The Oldowan stone tool", credit: "Historic Concepts, YouTube" }
  narration: { src: narration/events/oldowan-tools-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "5d31d95d74" }
  date_source: wikipedia:Oldowan@1378627077
