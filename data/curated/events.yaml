# Major events in human evolution and early history (category "event").
#
# Each event has a best date `year` (astronomical: 1 CE = 1, 1 BCE = 0, N BCE = 1 - N; "N years ago"
# counts back from 1950, so year = 1950 - N), and optionally `start_year` / `end_year` when the source
# gives a range. `places` are the points shown on the globe: coordinates from Wikidata (P625) with the
# item recorded; `note` says when only a place-level item (a district, river or region) has
# coordinates. `date_source` pins the English Wikipedia revision the date was checked against.
# `related` links to species / cultures / civilizations by id.
# Optional media: `image_url` + `image_credit` (author and licence; required together).
# Optional `extra_images`: more pictures after the main one, in order ({ url, credit, optional caption,
# optional `at`: seconds into the narration to switch to it; untimed ones share the hold evenly). Tours only, for now.

- id: hominin-divergence
  name: Divergence of the hominin lineage
  year: -6998050
  date_text: c. 7 million years ago
  description: Around seven million years ago, the ancestral lineage leading to humans diverged from the lineage leading to chimpanzees. Fossils recovered from this window, most notably the cranium of Sahelanthropus tchadensis in northern Chad and the femoral remains of Orrorin tugenensis in Kenya, display early anatomical adaptations toward upright bipedal posture, which became the defining locomotion strategy distinguishing hominins from all other hominoids.
  related: [sahelanthropus, orrorin-tugenensis]
  wikipedia_url: https://en.wikipedia.org/wiki/Human_evolution
  image_url: /images/events/divergence-hominin-lineage.webp
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/events/extra/hominin-divergence-1.webp, credit: "Didier Descouens, CC BY-SA 4.0, via Wikimedia Commons", caption: "The Toumaï cranium (TM 266-01-060-1), Sahelanthropus tchadensis", source: "https://commons.wikimedia.org/wiki/File:Sahelanthropus_tchadensis_-_TM_266-01-060-1.jpg" }
    - { url: /images/events/extra/hominin-divergence-2.webp, credit: "Jonathan Chen, CC BY-SA 4.0, via Wikimedia Commons", caption: "Cast of the Orrorin tugenensis femur BAR 1002'00, whose neck and shaft point to upright walking (Smithsonian)", source: "https://commons.wikimedia.org/wiki/File:Orrorin_NMNH.jpg" }
  media:
    - { kind: video, src: "https://www.youtube.com/watch?v=DZv8VyIQ7YU", title: "Seven million years of human evolution", credit: "American Museum of Natural History, YouTube" }
  narration: { src: narration/events/hominin-divergence-v1.mp3, credit: "AI-generated narration", text_hash: "5260a9af38" }
  date_source: wikipedia:Human_evolution@1379042225
  places:
