- id: earliest-musical-instruments
  name: Earliest musical instruments
  year: -38050
  start_year: -38050
  end_year: -33050
  date_text: c. 40,000–35,000 years ago
  description: Delicately crafted flutes made from griffon vulture wing bones and mammoth ivory discovered in the Swabian Jura caves demonstrate intentional musical tradition in the Upper Paleolithic. Featuring precisely spaced finger holes designed for acoustic scales, these instruments show that complex auditory art, shared performance, and ritual music accompanied the symbolic flowering of early modern humans in Europe.
