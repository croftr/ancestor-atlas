    - { url: /images/events/extra/hominin-divergence-4.webp, credit: "Chartep, CC BY-SA 3.0, via Wikimedia Commons", caption: "Fossil localities of Orrorin tugenensis in the Tugen Hills, Kenya", source: "https://commons.wikimedia.org/wiki/File:Orrorin_localities.jpg" }
    - { url: /images/events/extra/hominin-divergence-2.webp, credit: "Jonathan Chen, CC BY-SA 4.0, via Wikimedia Commons", caption: "Cast of the Orrorin tugenensis femur BAR 1002'00, whose neck and shaft point to upright walking (Smithsonian)", source: "https://commons.wikimedia.org/wiki/File:Orrorin_NMNH.jpg" }
    - { url: /images/events/extra/hominin-divergence-3.webp, credit: "DeFacto, CC BY-SA 4.0, via Wikimedia Commons", caption: "Hominoid skeletons compared, contrasting upright human bipedalism with the posture of other great apes (Museum of Zoology, Cambridge)", source: "https://commons.wikimedia.org/wiki/File:Great_ape_skeletons_in_the_Museum_of_Zoology,_University_of_Cambridge.jpg" }
