    - { url: /images/events/extra/laetoli-footprints-2.webp, credit: "Tim Evanson, CC BY-SA 2.0, via Wikimedia Commons", caption: "Cast of the Laetoli footprint trail found by Mary Leakey's team in 1976 (Smithsonian National Museum of Natural History)", source: "https://commons.wikimedia.org/wiki/File:Earliest_known_human_footprints_-_one_set_-_australopithecus_afarensis_-_Smithsonian_Museum_of_Natural_History_-_2012-05-17.jpg" }
    - { url: /images/events/extra/laetoli-footprints-3.webp, credit: "Wolfgang Sauber, CC BY-SA 4.0, via Wikimedia Commons", caption: "Close-up of a cast of the Laetoli footprints, showing the arched sole and aligned big toe (Natural History Museum, Vienna)", source: "https://commons.wikimedia.org/wiki/File:NHM_-_Laetoli_Fu%C3%9Fspuren.jpg" }
