    - { label: Tugen Hills (Lukeino Formation), lat: 0.75292, lon: 35.87497, wikidata: Q108936339 }

- id: lomekwian-tools
  name: Earliest stone tools (Lomekwian)
  year: -3298050
  date_text: c. 3.3 million years ago
  description: Archaeologists working at the Lomekwi 3 site discovered the oldest known intentionally flaked stone implements, pushing tool manufacture hundreds of thousands of years earlier than previously assumed. These massive basalt cores and anvils demonstrate deliberate block-on-block percussion used to crack hard plant foods or bone, proving that stone tool knapping predated the emergence of the genus Homo.
  related: [lomekwian, kenyanthropus-platyops, australopithecus-afarensis]
  wikipedia_url: https://en.wikipedia.org/wiki/Lomekwi
  image_url: /images/events/earliest-stone-tools.webp
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/events/extra/lomekwian-tools-1.webp, credit: "Rama, CC BY-SA 3.0 fr, via Wikimedia Commons", caption: "Kenyanthropus platyops skull (cast), found at Lomekwi: a possible maker of the tools", source: "https://commons.wikimedia.org/wiki/File:Kenyanthropus_platyops-MGL_95210-P5030042-black.jpg" }
    - { url: /images/events/extra/lomekwian-tools-2.webp, credit: "NASA, public domain, via Wikimedia Commons", caption: "Lake Turkana from space; Lomekwi lies near its western shore", source: "https://commons.wikimedia.org/wiki/File:Lake_turkana_satellite.jpg" }
  media:
    - { kind: video, src: "https://www.youtube.com/watch?v=NhM-2P93hoI", title: "The oldest archaeological site in the world", credit: "Stefan Milo, YouTube" }
  narration: { src: narration/events/lomekwian-tools-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "7926749546" }
  date_source: wikipedia:Lomekwi@1378607817
  places:
