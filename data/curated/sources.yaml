# Data sources. The build copies the ones actually used into public/data/sources.json.
- id: cliopatria
  name: Cliopatria (Seshat Global History Databank)
  url: https://github.com/Seshat-Global-History-Databank/cliopatria
  licence: CC BY 4.0
  citation: "Seshat Global History Databank, Cliopatria v0.2.1 (doi:10.5281/zenodo.23128623). Paper: doi:10.1038/s41597-025-04516-9. Polity extents are scholarly approximations. Geometry simplified for display."
- id: wikidata
  name: Wikidata
  url: https://www.wikidata.org/
  licence: CC0 1.0
  citation: "Short descriptions and identifiers from Wikidata."
- id: mock
  name: Illustrative placeholder data
  url: https://en.wikipedia.org/wiki/Prehistory
  licence: n/a
  citation: "Illustrative, approximate placeholder locations and dates. Not real data; being replaced."
- id: recall
  name: Author-compiled approximate sites (unverified)
  url: https://github.com/croftr/ancestor-atlas#provenance-rules
  licence: n/a
  citation: "Approximate site locations and age windows compiled from general knowledge (AI-assisted), partly cross-checked against PBDB, Wikidata and Wikipedia. Not verified against primary sources; replaced as sourced data (e.g. ROAD, PBDB) lands."
- id: wikimedia
  name: Wikidata coordinates and Wikipedia dates
  url: https://www.wikidata.org/
  licence: CC0 1.0 (Wikidata) / CC BY-SA 4.0 (Wikipedia)
  citation: "Site coordinates from Wikidata (P625, CC0); age ranges as stated in English Wikipedia articles. Each site records its Wikidata item and the exact Wikipedia page revision used."
- id: literature
  name: Wikidata coordinates and dates from published papers
  url: https://www.wikidata.org/
  licence: CC0 1.0 (Wikidata coordinates); dates are facts reported in the cited paper
  citation: "Site coordinates from Wikidata (P625, CC0); ages as stated in the peer-reviewed paper given by each site's DOI (date_source)."
- id: xronos
  name: XRONOS (open chronometric data)
  url: https://xronos.ch/
  licence: CC BY 4.0
  citation: "Roe, J., Schmid, C., Ebrahimiabareghi, S., Heitz, C. & Hinz, M., 2025. XRONOS: An Open Data Infrastructure for Archaeological Chronology. Journal of Computer Applications in Archaeology 8(1): 242–263. https://doi.org/10.5334/jcaa.191. Radiocarbon dates from XRONOS (https://xronos.ch), CC BY 4.0, with the original publications and compilations listed on each site point. Dates calibrated here with IntCal20 (Reimer et al. 2020, doi:10.1017/RDC.2020.41); one point per site spanning its calibrated dates."
- id: road
  name: ROAD (ROCEEH Out of Africa Database)
  url: https://www.roceeh.uni-tuebingen.de/roadweb/smarty_road_simple_search.php
  licence: CC BY-SA 4.0
  citation: "Kandel, A.W., Sommer, C., Kanaeva, Z., Bolus, M., Bruch, A.A., Groth, C., Haidle, M.N., Hertler, C., Heß, J., Malina, M., Märker, M., Hochschild, V., Mosbrugger, V., Schrenk, F. & Conard, N.J., 2023. The ROCEEH Out of Africa Database (ROAD): A large-scale research database serves as an indispensable tool for human evolutionary studies. PLOS ONE 18(8): e0289513. https://doi.org/10.1371/journal.pone.0289513. Hominin finds, layer ages and cultures from ROAD (http://www.roceeh.net), CC BY-SA 4.0, exported 12 Oct 2026 with the roadDB R package; the work of the data contributors and ROAD community is gratefully acknowledged. Adapted here: one point per species and locality, ages clipped to the species' range; these points are shared under CC BY-SA 4.0."
