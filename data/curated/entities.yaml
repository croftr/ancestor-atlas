- id: akkadian-empire
  description: "Around 2334 BCE Sargon of Akkad, a man of humble birth according to legend, conquered the Sumerian cities and created what is often called the world's first empire, stretching from the Persian Gulf towards the Mediterranean. His grandson Naram-Sin called himself king of the four quarters of the world and was worshipped as a god. Within two centuries the empire had collapsed, weakened by revolts, by raids from the Zagros mountains and, many believe, by a severe drought."
  narration: { src: narration/civilizations/akkadian-empire-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "912a730cb8" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=uNHkoGRc53Y
      title: "SARGON OF AKKAD - The Man Who Built the First Empire"
      credit: ChronoQuest, YouTube
  extra_images:
