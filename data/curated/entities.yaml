# Span from English Wikipedia: Iberomaurusian@1374169940 (c. 25/23,000 to c. 11,000 cal BP).
- id: iberomaurusian
  name: Iberomaurusian
  category: culture
  start_year: -23050
  end_year: -9050
  description: "From around the coldest point of the last Ice Age, some 25,000 years ago, until about 11,000 years ago, hunter-gatherers near the coasts of Morocco, Algeria and Tunisia made the Iberomaurusian toolkit: tiny stone bladelets with one edge blunted, many of them crescent-shaped, found in their thousands at sites such as Taforalt and Afalou. The name, coined in 1909, means ‘of Iberia and Mauretania’, from a belief that the same industry reached across the Strait of Gibraltar into Spain. That idea has long been given up, but the name stuck. In Algeria, Tunisia and Libya it was followed by the Capsian; in Morocco, after a long gap, by the first potters."
  image_url: /images/cultures/iberomaurusian.webp
  image_credit: AI-generated illustration
  image_caption: "Coastal cave camp near Taforalt showing flintknappers making backed bladelets and Nassarius shell beads beside roasted Barbary sheep"
  wikipedia_url: https://en.wikipedia.org/wiki/Iberomaurusian
  wikidata: Q1470903
  source_ids: []
# Span from English Wikipedia: Capsian_culture@1371764415.
- id: capsian
  name: Capsian culture
  category: culture
  start_year: -8999
  end_year: -5399
  description: "While the Sahara to the south was greener and wetter than today, from about eleven thousand years ago, hunters in the hills of Tunisia and eastern Algeria lived the Capsian way of life, named after the oasis town of Gafsa, the Roman Capsa. Their camps are marked by great mounds of ash, burnt stones and the shells of land snails, which they ate in vast numbers. They hunted wild cattle, gazelle and hares with tiny flint blades, and carried water in ostrich eggs engraved with lines and patterns."
