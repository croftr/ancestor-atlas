# Span from English Wikipedia: Azilian@1373678621.
- id: azilian
  name: Azilian
  category: culture
  start_year: -10550
  end_year: -8050
  description: "As the ice retreated, forests spread over the open plains of western Europe and the reindeer herds moved away north. The hunters who stayed behind in northern Spain and southern France changed with them. Named after the great cave of Le Mas d'Azil in the Pyrenees, the Azilians hunted red deer and boar in the woods with small flint points, made flat harpoons from deer antler, and painted pebbles with dots and stripes of red ochre, whose meaning nobody knows. Their art was far simpler than the cave paintings of the Magdalenians before them."
