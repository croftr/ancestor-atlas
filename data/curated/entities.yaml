    - { url: /images/extra/philistia-3.webp, credit: "Peter Hagyo-Kovacs, CC BY-SA 3.0, via Wikimedia Commons", caption: "Philistine bichrome bowl painted with spirals, in the tradition of Mycenaean pottery", source: "https://commons.wikimedia.org/wiki/File:Bichrome_pottery.jpg" }
