  end_year: -768050
  description: "In 1994 excavators at Gran Dolina in Spain's Sierra de Atapuerca found the remains of several individuals around 850,000 years old: the earliest well-documented humans in western Europe. Homo antecessor combined a strikingly modern-looking face with primitive teeth, and cut marks on the bones show the group was butchered and eaten. Proteins from its tooth enamel suggest it was a close relative of the lineage that later gave rise to Neanderthals, Denisovans and modern humans."
