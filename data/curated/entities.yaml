    - { url: /images/extra/greco-bactrian-kingdom-2.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Silver tetradrachm of Demetrius I of Bactria wearing an elephant-skin scalp, with Herakles resting on the reverse", source: "https://commons.wikimedia.org/wiki/File:Demetrios_I_Baktria_Tetradrachm_200-185_BC.jpg" }
