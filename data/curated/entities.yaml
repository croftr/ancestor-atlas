- id: mayan-city-states
  description: "In the tropical forests of southern Mexico, Guatemala and Belize, Maya farmers were building cities by the last centuries BCE. At El Mirador they raised some of the largest pyramids ever built, long before the famous cities of Tikal and Calakmul. The Maya never formed one empire, but many rival kingdoms, whose kings recorded their reigns in a full system of writing and counted the days with a precise calendar that used a sign for zero. Most of the southern cities were abandoned around 900 CE, yet millions of Maya people still speak Mayan languages today."
  narration: { src: narration/civilizations/mayan-city-states-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "8f673e50b2" }
  image_url: /images/civilisations/mayan-city-states.webp
  image_caption: Classic Maya city-state of Tikal with jungle pyramid-temples, carved stelae, lords in quetzal feather crests, and a scribe painting a screenfold codex.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/mayan-city-states-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "The mosaic jade funerary mask and collar of K'inich Janaab' Pakal, ruler of Palenque (National Museum of Anthropology, Mexico City)", source: "https://commons.wikimedia.org/wiki/File:Maya_Jade_Mask_%26_Burial_Artifacts_of_Kinich_Hanab_Pakal,_Ruler_of_Palenque,_615-683_AD.jpg" }
    - { url: /images/extra/mayan-city-states-2.webp, credit: "Sailko, CC BY-SA 3.0, via Wikimedia Commons", caption: "Yaxchilan Lintel 24, high-relief limestone carving depicting Lady K'ab'al Xook performing a sacred royal bloodletting ritual in 709 CE (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Maya,_lintel_24,_da_yaxchilan,_725.JPG" }
