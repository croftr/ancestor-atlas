  description: "Around 5500 BCE farming reached the heart of Europe. From the middle Danube, the people of the Linear Pottery culture spread along the rivers about fifteen hundred kilometres in less than four centuries, reaching from the Paris Basin in the west to Ukraine in the east. They grew einkorn and emmer wheat, peas, lentils and flax, kept cattle, and lived in timber longhouses that were the largest free-standing buildings in the world at the time. Their genomes show they descended from the first farmers of Anatolia."
