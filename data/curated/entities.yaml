  extra_images:
    - { url: /images/extra/cimmerian-bosporus-1.webp, credit: "Sergey Ashmarin, CC BY-SA 3.0, via Wikimedia Commons", caption: "Columns re-erected on Mount Mithridates in Kerch, on the acropolis of Panticapaeum, capital of the Bosporan Kingdom", source: "https://commons.wikimedia.org/wiki/File:The_ruins_of_Panticapaeum_(6th_century_BC)_-_Kerch,_Ukraine_-_panoramio.jpg" }
