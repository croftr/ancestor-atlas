      title: Who were the Lydians?
      credit: The Histories, YouTube
- id: assyrian-egypt
  description: The period in the 7th century BCE when the Neo-Assyrian Empire conquered Lower and Upper Egypt, driving out the Kushite Twenty-Fifth Dynasty. Sacking Thebes and Memphis, the Assyrians installed local delta princes as tributary vassals, paving the way for the rise of Egypt's native Twenty-Sixth (Saite) Dynasty.
  extra_images:
