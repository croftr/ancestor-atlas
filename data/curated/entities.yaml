    - { url: /images/extra/scythia-2.webp, credit: "sailko, CC BY-SA 3.0, via Wikimedia Commons", caption: "The Kostromskaya Golden Stag, iconic Scythian animal-style shield plaque in hammered gold, early 6th century BCE (Hermitage)", source: "https://commons.wikimedia.org/wiki/File:Placca_cervo,_da_regione_di_krasnodar,_kostromskaja,_oro_fuso_e_cesellato,_inizio_VI_sec_ac.jpg" }
