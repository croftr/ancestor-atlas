    - { url: /images/extra/zapotec-civilization-2.webp, credit: "Rob Young, CC BY 2.0, via Wikimedia Commons", caption: "The Gran Plaza of Monte Albán and the temple platforms around it", source: "https://commons.wikimedia.org/wiki/File:Gran_Plaza_(8264625316).jpg" }
    - { url: /images/extra/zapotec-civilization-3.webp, credit: "MAHC-oaxaca, CC BY 4.0, via Wikimedia Commons", caption: "The Gallery of the Danzantes at Monte Albán: carved stone figures, probably of slain captives (replicas on the site)", source: "https://commons.wikimedia.org/wiki/File:Gallery_of_the_Danzantes,_Monte_Alb%C3%A1n,_Oaxaca_-_2025.jpg" }
    - { url: /images/extra/zapotec-civilization-4.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "A Zapotec effigy urn with the head of the bat god, from Tomb 113 at Monte Albán, made centuries later (National Museum of Anthropology, Mexico City)", source: "https://commons.wikimedia.org/wiki/File:Zapotec_Ceramic_Large_Effigy_Urn_with_Head_of_Bat_God,_Tomb_113,_Monte_Alban.jpg" }
