- id: second-athenian-league
  description: A defensive maritime confederation of Aegean city-states established by Athens in 378 BCE to counter Spartan hegemony while avoiding the oppressive imperial abuses of the earlier Delian League. The alliance secured Aegean sea routes and curbed Spartan ambitions, but dissolved following the Social War when key allies rebelled against renewed Athenian dominance.
  extra_images:
    - { url: /images/extra/second-athenian-league-1.webp, credit: "Furius, CC BY-SA 4.0, via Wikimedia Commons", caption: "Top of the decree of Aristoteles (378/377 BCE), the founding charter of the Second Athenian League (Epigraphic Museum, Athens)", source: "https://commons.wikimedia.org/wiki/File:IG_II2_43_(part_1).jpg" }
