# Span from English Wikipedia: Wilton_culture@1378611874 ("from 12,000 to 8,000 years ago, corresponding to Oakhurst technology"); no article of its own.
- id: oakhurst
  name: Oakhurst industry
  category: culture
  start_year: -10050
  end_year: -6050
  description: "Between about 12,000 and 8,000 years ago, as the climate after the last Ice Age turned kinder, hunter-gatherers lived across much of southern Africa in larger numbers than before, leaving many more sites behind. Archaeologists call their toolkit Oakhurst, after a site in the southern Cape: large, informal stone tools, among them big scrapers of quartzite, made by people who still hunted large animals. Around 8,000 years ago it gave way to the smaller, more carefully shaped tools of the Wilton culture."
