    - { url: /images/extra/mycenaean-greece-2.webp, credit: "Berthold Werner, CC BY-SA 3.0, via Wikimedia Commons", caption: "The megalithic Lion Gate entrance and heraldic relief over the main approach to the citadel of Mycenae", source: "https://commons.wikimedia.org/wiki/File:Mykene_BW_2017-10-10_13-23-40.jpg" }
    - { url: /images/extra/mycenaean-greece-3.webp, credit: "Zde, CC BY-SA 3.0, via Wikimedia Commons", caption: "Bronze dagger blade inlaid with gold, electrum, and niello showing a lion-hunt scene, Grave Circle A at Mycenae (NAM Athens)", source: "https://commons.wikimedia.org/wiki/File:Dagger_inlaid_Mycenaean_16_c_BC,_NAMA_394_1080834_a.jpg" }
    - { url: /images/extra/mycenaean-greece-4.webp, credit: "Sharon Mollerus, CC BY 2.0, via Wikimedia Commons", caption: "The Mycenaean \"Warrior Vase\" (krater) depicting departing soldiers wearing helmets, corslets, greaves, and carrying spears and shields (NAM Athens)", source: "https://commons.wikimedia.org/wiki/File:Warrior_Vase.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=0HXSPu1UMZM
      title: "The Bronze Age Civilization That Became Greek Mythology — The Mycenaeans"
      credit: Paladin, YouTube
- id: greek-dark-ages
  description: The transitional period of ancient Greek history following the catastrophic Late Bronze Age collapse of Mycenaean palace culture. Characterized initially by depopulation, the loss of Linear B literacy, and regional isolation, this era witnessed the adoption of ironworking, the spread of the Greek alphabet, and the foundational emergence of the independent polis (city-state).
  extra_images:
    - { url: /images/extra/greek-dark-ages-1.webp, credit: "Jebulon, CC0, via Wikimedia Commons", caption: "The Lefkandi centaur, a painted clay figure buried in two graves, 10th century BCE (Archaeological Museum of Eretria)", source: "https://commons.wikimedia.org/wiki/File:Centaur_Chiron_of_Lefkandi,_Archaeological_museum_of_Eretria,_Greece.jpg" }
    - { url: /images/extra/greek-dark-ages-2.webp, credit: "Mark Landon, CC0, via Wikimedia Commons", caption: "Excavation of the 'Heroon' at Toumba, Lefkandi, a great apsidal hall built over a warrior's and a woman's burials about 950 BCE (photographed 1991)", source: "https://commons.wikimedia.org/wiki/File:Lefkandi_Heroon_from_E.jpg" }
    - { url: /images/extra/greek-dark-ages-3.webp, credit: "Dorieo, CC BY-SA 4.0, via Wikimedia Commons", caption: "Attic cinerary amphora painted with wavy lines and the earliest horse in Attic vase painting (Kerameikos Museum, Athens)", source: "https://commons.wikimedia.org/wiki/File:Ancient_greek_cinerary_amphora_-_KAMA.jpg" }
