- id: elam
  description: An ancient civilization centered in southwestern Iran across Khuzestan and the Zagros highlands, with principal capitals at Susa and Anshan. Contemporaries and frequent rivals of Sumer, Babylon, and Assyria, the Elamites developed their own Linear Elamite and cuneiform scripts, monumental brick ziggurats like Chogha Zanbil, and deeply influenced the rise of the Persian Empire.
  image_url: /images/civilisations/elam.webp
  image_caption: Monumental baked-brick ziggurat of Chogha Zanbil with multi-tiered staircases, blue glazed bricks, and scribes holding cuneiform tablets.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/elam-1.webp, credit: "Atsed, CC BY-SA 4.0, via Wikimedia Commons", caption: "The ziggurat of Chogha Zanbil (Dur Untash), built by the Elamite king Untash-Napirisha in the 13th century BCE, Khuzestan, Iran", source: "https://commons.wikimedia.org/wiki/File:Zigorat_Chogha_Zanbil_Temple.jpg" }
    - { url: /images/extra/elam-2.webp, credit: "Shonagon, CC0, via Wikimedia Commons", caption: "Bronze statue of Queen Napirasu, wife of Untash-Napirisha, cast in solid metal and weighing 1,750 kg, from Susa, 14th century BCE (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Statue_de_Napir-Asu_-_Musée_du_Louvre_-_Antiquités_orientales_SB_2731.jpg" }
    - { url: /images/extra/elam-3.webp, credit: "Zunkir, CC BY-SA 4.0, via Wikimedia Commons", caption: "Gold and silver statuettes of a praying man carrying a young goat, from the acropolis of Susa, Middle Elamite period, 12th century BCE (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Statuettes_Sb_2758_2759.jpg" }
    - { url: /images/extra/elam-4.webp, credit: "Metropolitan Museum of Art, CC0, via Wikimedia Commons", caption: "Bronze helmet with gold-foil figures of deities beneath a bird with outstretched wings, southwest Iran, Middle Elamite period (Metropolitan Museum of Art)", source: "https://commons.wikimedia.org/wiki/File:Helmet_with_divine_figures_beneath_a_bird_with_outstretched_wings_MET_DT874.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=jkFwh_saHmc
      title: "The Ancient Kingdom of Elam, what was it?"
      credit: BenjaminAngwin, YouTube
- id: gutian-dynasty
  description: A line of rulers originating from the Zagros Mountains who seized control of central and southern Mesopotamia following the decline of the Akkadian Empire. Though remembered in later Sumerian king lists as destructive overlords, Gutian kings ruled for roughly a century before being ousted by Utu-hengal of Uruk.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=klO4RJc0qWQ
      title: "Were Gutians Tocharians?"
      credit: Germania Magna ENG, YouTube
- id: mycenaean-greece
  description: The mainland Greek civilization of the Late Bronze Age, immortalized in Homeric epic poetry, centered at fortified citadels such as Mycenae, Tiryns, and Pylos. Governed by warrior-kings (wanakes), the Mycenaeans developed the Linear B syllabic script—the earliest attested Greek—and established trade networks across the Mediterranean before collapsing around 1200 BCE.
  image_url: /images/civilisations/mycenaean-greece.webp
  image_caption: Bronze Age citadel of Mycenae and the Lion Gate with cyclopean walls, warriors in boar's-tusk helmets with figure-of-eight shields, and a Linear B scribe.
  image_credit: AI-generated illustration
  extra_images:
