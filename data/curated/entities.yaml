    - { url: /images/extra/neo-babylonian-empire-2.webp, credit: "Carole Raddato, CC BY 2.0, via Wikimedia Commons", caption: "Glazed molded brick Striding Lion from the Processional Way of Babylon leading to the Ishtar Gate (c. 575 BCE)", source: "https://commons.wikimedia.org/wiki/File:A_lion_on_the_Ishtar_Gate_of_Babylon_reconstructed_with_original_bricks_at_the_Pergamon_Museum_in_Berlin_575_BCE_(3)_(32577951406).jpg" }
