  description: "Neanderthals were the humans of Ice Age Europe and western Asia, stocky and strong, with brains as large as ours. At the Sima de los Huesos in Spain, a pit holding at least 28 individuals about 430,000 years old shows their lineage already taking shape. They made Mousterian stone tools, controlled fire, hunted large game and buried some of their dead. They disappeared around 40,000 years ago, but most people living outside Africa today carry a little Neanderthal DNA."
