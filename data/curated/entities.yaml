    - kind: video
      src: https://www.youtube.com/watch?v=XF9-27lMhpE
      title: "The Transition of the Medes – How the Median Empire Became Persia"
      credit: World's Secret Stories, YouTube
- id: achaemenid-empire
  description: "In 550 BCE Cyrus the Great of Persia overthrew his Median overlords, then conquered Lydia and Babylon, founding an empire far larger than any before it. Under Darius the First it stretched from Egypt and the Balkans to the Indus, held together by provincial governors called satraps, a common coinage and the Royal Road with its relays of mounted messengers. Its kings ruled from Persepolis and Susa and generally let conquered peoples keep their gods and customs. In 330 BCE it fell to Alexander the Great."
  image_url: /images/civilisations/achaemenid-empire.webp
  image_caption: Persepolis, Susa, and the Tomb of Cyrus with the glazed-brick Frieze of the Immortals, the Cyrus Cylinder, golden rhyton, and Royal Road messengers.
  image_credit: AI-generated illustration
  narration: { src: narration/civilizations/achaemenid-empire-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "f1cce7939b" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ZoH2UQZBaPY
      title: "Cyrus the Great - Rise of the Achaemenid Empire"
      credit: Kings and Generals, YouTube
  extra_images:
