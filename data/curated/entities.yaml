      title: "History of Ancient Egypt: Dynasties XXIV & XXV - Nubian Pharaohs and the Assyrian Conquest of Egypt"
      credit: History with Cy, YouTube
- id: neo-babylonian-empire
  description: The resurgent Chaldean dynasty that succeeded the Neo-Assyrian Empire, dominating the Near East from 626 to 539 BCE under rulers like Nebuchadnezzar II. Famed for rebuilding Babylon with the Ishtar Gate, monumental temples, and the legendary Hanging Gardens, the empire ended with the Persian conquest by Cyrus the Great.
