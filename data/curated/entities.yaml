    - { url: /images/extra/kingdom-of-kush-2.webp, credit: "Hans Birger Nilsen, CC BY-SA 2.0, via Wikimedia Commons", caption: "Steep-sided sandstone royal burial pyramids of the Kushite rulers across the desert dunes at Meroë, Sudan", source: "https://commons.wikimedia.org/wiki/File:Among_the_pyramids_(34988567951).jpg" }
