  description: "Most of the languages spoken across Africa south of the equator are close relatives, the Bantu languages, because their speakers' ancestors spread out from one small homeland: the highlands between Cameroon and Nigeria. Over three thousand years farming villages moved south along the rivers and coasts of the rainforest and east around its northern edge. By about 500 BCE the eastern stream had reached Lake Victoria, where the Urewe culture made dimpled pottery and smelted iron, and by around 300 CE farmers had reached South Africa. Genomes show they mixed with the foragers and herders already living there."
