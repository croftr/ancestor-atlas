  image_url: /images/species/sahelanthropus.webp
  image_credit: AI-generated illustration, not a scientific reconstruction
  image_caption: "An imagined Sahelanthropus tchadensis, not a scientific reconstruction: a heavy brow, flat face and close-cropped dark hair"
  video: { src: video/species/sahelanthropus-v2.mp4, credit: "AI-generated video (Google Veo)" }
  extra_images:
    - { url: /images/extra/sahelanthropus-1.webp, credit: "Rama, CC BY-SA 3.0 fr, via Wikimedia Commons", caption: "Cast of the Toumaï skull from the side", source: "https://commons.wikimedia.org/wiki/File:Sahelenthropus_tchadensis-MGL_95214-P4150636-black.jpg" }
    - { url: /images/extra/sahelanthropus-3.webp, credit: "Didier Descouens, CC BY-SA 4.0, via Wikimedia Commons", caption: "Front view of the Toumaï skull (cast), showing its heavy brow ridge and small canine teeth", source: "https://commons.wikimedia.org/wiki/File:Sahelanthropus_tchadensis_-_TM_266-01-060-1.jpg" }
    - { url: /images/extra/sahelanthropus-4.webp, credit: "Oryctes, CC BY-SA 3.0, via Wikimedia Commons", caption: "Six views of the Toumaï cranium, including the underside where the spinal cord entered", source: "https://commons.wikimedia.org/wiki/File:Sahelanthropus_tchadensis_Toumai_6_views.jpg" }
    - { url: /images/extra/sahelanthropus-2.webp, credit: "Commons user 120, public domain, via Wikimedia Commons", caption: "Where Toumaï was found in the Djurab Desert of Chad, far west of the East African Rift", source: "https://commons.wikimedia.org/wiki/File:Sahelanthropus_tchadensis_-_TM_266_location.jpg" }
