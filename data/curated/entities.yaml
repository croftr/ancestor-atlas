      src: https://www.youtube.com/watch?v=f0UYZRxSrqA
      title: "History of Athens, 1st and 2nd Athenian Empire"
      credit: Costas Melas, YouTube
- id: thebans
  description: The ancient Greek citizens and military power of Thebes, the preeminent city of the Boeotian confederacy in central Greece. Reaching its geopolitical zenith under Epaminondas in the 4th century BCE, Thebes broke Spartan hegemony and liberated the Messenian helots before being destroyed by Alexander the Great following an uprising in 335 BCE.
  extra_images:
    - { url: /images/extra/thebans-1.webp, credit: "Exekias, CC BY 2.0, via Wikimedia Commons", caption: "Silver stater of Thebes with the Boeotian shield and the head of Dionysos, about 405–395 BCE", source: "https://commons.wikimedia.org/wiki/File:Greek_Silver_Stater_of_Thebes_(Boeotia),_a_Stunning_Depiction_of_Dionysos.jpg" }
