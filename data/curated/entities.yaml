      title: The Forgotten Ancient Kingdom of Colchis
      credit: Study of Antiquity and the Middle Ages, YouTube
- id: kingdom-of-pontus
  description: A powerful Hellenistic kingdom on the southern Black Sea coast of northern Anatolia, founded by the Persian Mithridatic dynasty. Melding Greek, Persian, and Anatolian cultures, Pontus expanded rapidly under King Mithridates VI Eupator, who waged three fierce wars against Roman hegemony before final defeat by Pompey.
  image_url: /images/civilisations/kingdom-of-pontus.webp
  image_caption: Amaseia and Sinope in the Kingdom of Pontus, showing cliff-cut royal tombs, a bust of Mithridates VI, Pegasus and star-and-crescent tetradrachms, and a Black Sea fleet.
  image_credit: AI-generated illustration
  extra_images:
