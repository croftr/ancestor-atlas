      src: https://www.youtube.com/watch?v=d4hA2ESdvE0
      title: "The Seven Kings of Rome: How the Roman Kingdom Shaped History"
      credit: Epoch Atlas, YouTube
- id: phoenician-colonies
  description: The widespread network of trading posts, naval stations, and permanent colonies established across the Mediterranean basin by Phoenician mother-cities like Tyre and Sidon. Spanning Cyprus, Malta, Sicily, Sardinia, North Africa (Carthage), and southern Iberia (Gadir), these settlements secured critical mineral and agricultural trade routes, diffusing Levantine culture and alphabetic writing.
  image_url: /images/civilisations/phoenician-colonies.webp
  image_caption: Western Mediterranean Phoenician trading colony at Gadir with the Temple of Melqart, hippoi merchant ships, silver and tin ingots, core-formed glass flasks, and alphabetic scribes.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/phoenician-colonies-1.webp, credit: "Olaf Tausch, CC BY 3.0, via Wikimedia Commons", caption: "The Nora Stone from Sardinia, one of the oldest Phoenician inscriptions in the western Mediterranean, 9th–8th century BCE (National Archaeological Museum, Cagliari)", source: "https://commons.wikimedia.org/wiki/File:Stele_von_Nora_01.jpg" }
    - { url: /images/extra/phoenician-colonies-2.webp, credit: "b.roveran, CC BY 2.0, via Wikimedia Commons", caption: "The island of Motya (Mozia) off western Sicily, a Phoenician colony founded in the 8th century BCE", source: "https://commons.wikimedia.org/wiki/File:Isola_di_Mozia_vue_générale.jpg" }
  media:
