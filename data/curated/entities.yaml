- id: roman-kingdom
  description: The foundational monarchical period of ancient Rome, traditionally inaugurated by Romulus in 753 BCE and ending with the expulsion of the tyrant Tarquin the Proud in 509 BCE. During this era, Rome evolved from a modest pastoral settlement on the Tiber into an organized city-state, establishing the Senate, curiae, and core religious institutions.
  image_url: /images/civilisations/roman-kingdom.webp
  image_caption: Archaic Rome during the Roman Kingdom, featuring an Etruscan-style Roman king with lictors carrying fasces, an augur with a lituus, the Capitoline Wolf, Palatine huts, and the early Temple of Jupiter.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/roman-kingdom-1.webp, credit: "Ursus, public domain, via Wikimedia Commons", caption: "The inscribed stone under the Lapis Niger in the Roman Forum, one of the oldest Latin inscriptions, 6th century BCE", source: "https://commons.wikimedia.org/wiki/File:Lapis_niger_stele.JPG" }
    - { url: /images/extra/roman-kingdom-2.webp, credit: "Jordiferrer, CC BY-SA 4.0, via Wikimedia Commons", caption: "The sacred area of Sant'Omobono in Rome, where an archaic temple of the time of the kings was excavated", source: "https://commons.wikimedia.org/wiki/File:2016_Sacred_area_of_Sant'Omobono_02.jpg" }
    - { url: /images/extra/roman-kingdom-3.webp, credit: "Lalupa, public domain, via Wikimedia Commons", caption: "The outlet of the Cloaca Maxima into the Tiber, the great drain traditionally begun under the Tarquin kings", source: "https://commons.wikimedia.org/wiki/File:040227_tevere16CloacaMaxima.jpg" }
    - { url: /images/extra/roman-kingdom-4.webp, credit: "Sailko, CC BY 3.0, via Wikimedia Commons", caption: "Pottery hut urn for cremated remains from Castel Gandolfo in the Alban Hills, 900–850 BCE, showing the round huts of early Latium (Gregorian Etruscan Museum, Vatican)", source: "https://commons.wikimedia.org/wiki/File:Urna_a_capanna_da_castelgandolfo-montecucco,_tomba_a,_900-850_ac_ca..JPG" }
