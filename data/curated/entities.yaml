    - { url: /images/extra/italian-city-states-2.webp, credit: "Carlos Diana, public domain, via Wikimedia Commons", caption: "The Samnite theatre at the sanctuary of Pietrabbondante, the federal sanctuary of the Pentri Samnites", source: "https://commons.wikimedia.org/wiki/File:Teatro_sannitico_a_Pietrabbondante,_Italia_-_2006.jpg" }
