      src: https://www.youtube.com/watch?v=sx8SURJuAag
      title: Tabal and the Kingdoms of Iron Age Anatolia
      credit: Dig., YouTube
- id: kingdom-of-urartu
  description: A powerful Iron Age kingdom centered around Lake Van in the mountainous Armenian Highlands, spanning modern eastern Turkey, Armenia, and northwestern Iran. Renowned for impregnable mountain cyclopean fortresses, sophisticated irrigation canals, and master bronzeworking, Urartu fiercely contested Near Eastern supremacy with the Neo-Assyrian Empire.
  image_url: /images/civilisations/kingdom-of-urartu.webp
  image_caption: Tushpa on Lake Van in the Kingdom of Urartu, showing a shield-hung tower temple, winged-bull bronze cauldron, conical helmet, and Mount Ararat.
