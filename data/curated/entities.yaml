- id: phoenicia
  description: "On the narrow coast of what is now Lebanon, Phoenician city-states such as Tyre, Sidon and Byblos became the great seafarers and traders of the Iron Age. They sailed the length of the Mediterranean and beyond, founding colonies such as Carthage, and traded cedar wood, glass and cloth dyed with a precious purple made from sea snails. Their simple alphabet of 22 letters was taken up by the Greeks and became the ancestor of most alphabets used today. Assyria, Babylon and Persia in turn brought the cities under their rule."
  image_url: /images/civilisations/phoenicia.webp
  image_caption: Island harbor of Tyre with horse-headed Phoenician hippoi ships, Lebanon cedar timber, murex shell heaps, and artisans boiling and drying Tyrian purple cloth.
  image_credit: AI-generated illustration
  video: { src: video/civilizations/phoenicia-v1.mp4, credit: "AI-generated video (Google Veo)" }
  narration: { src: narration/civilizations/phoenicia-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "1e0f11aafa" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=3BkIAZwM8U4
      title: A Brief History of the Phoenicians (1500 - 300 BC)
      credit: Captivating History, YouTube
  extra_images:
    - { url: /images/extra/phoenicia-1.webp, credit: "Наталия Данииловна Абрагамович, CC0, via Wikimedia Commons", caption: "King Luli of Tyre and Sidon escaping by sea in Phoenician ships, from an Assyrian relief", source: "https://commons.wikimedia.org/wiki/File:Elulay_escape.jpg" }
    - { url: /images/extra/phoenicia-3.webp, credit: "upyernoz, CC BY 2.0, via Wikimedia Commons", caption: "Punic ruins at Carthage, Phoenicia's greatest Mediterranean colony", source: "https://commons.wikimedia.org/wiki/File:Punic_Ruins,_Carthage.jpg" }
