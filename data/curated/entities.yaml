      src: https://www.youtube.com/watch?v=mXa7633esMw
      title: "The Surprising Story of Egypt's Two Kingdoms!"
      credit: Legacy African History, YouTube
- id: upper-egypt
  description: The southern riverine expanse of ancient Egypt stretching along the narrow Nile Valley from the First Cataract at Aswan to Memphis. Represented by the white crown (Hedjet) and the vulture goddess Nekhbet, Upper Egypt was the heartland of early state formation, renowned for spiritual centers at Abydos, Thebes, and Hierakonpolis.
  extra_images:
    - { url: /images/extra/upper-egypt-1.webp, credit: "Metropolitan Museum of Art, CC0, via Wikimedia Commons", caption: "Stela of the Theban king Intef II Wahankh, who fought the Herakleopolitan kings for Middle Egypt, 11th Dynasty (Metropolitan Museum of Art)", source: "https://commons.wikimedia.org/wiki/File:Stela_of_King_Intef_II_Wahankh_MET_DP156516.jpg" }
    - { url: /images/extra/upper-egypt-2.webp, credit: "SpeakingArch, CC BY-SA 4.0, via Wikimedia Commons", caption: "Tomb stela of Intef with three women and servants bringing offerings, from el-Tarif in western Thebes, about 2041 BCE (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Tomb_stela_of_Intef,_2041_BCE,_11th_Dynasty,_Western_Thebes,_el-Tarif,_British_Museum.jpg" }
    - { url: /images/extra/upper-egypt-3.webp, credit: "Museo Egizio, CC0, via Wikimedia Commons", caption: "Stela of the Nubian archer Tjenenu with his wife, dog and four bowmen brothers, First Intermediate Period, from Upper Egypt (Museo Egizio, Turin)", source: "https://commons.wikimedia.org/wiki/File:Stela_with_Nubian_bowmen,_limestone_-_Museo_Egizio,_Turin_S_1270_p01.jpg" }
    - { url: /images/extra/upper-egypt-4.webp, credit: "Djehouty, CC BY-SA 4.0, via Wikimedia Commons", caption: "Painted sandstone statue of Mentuhotep II, the Theban king who reunited Egypt, from his temple at Deir el-Bahari (Egyptian Museum, Cairo)", source: "https://commons.wikimedia.org/wiki/File:Ägyptisches_Museum_Kairo_2016-03-29_Mentuhotep_02.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=L38wNoFWbAk
      title: "Egypt's Secret Unification: The Story They Don't Teach"
      credit: Legacy African History, YouTube
- id: fifteenth-dynasty-of-egypt
  description: The ruling house of the Hyksos during the Second Intermediate Period, established by Levantine leaders who governed northern Egypt from their fortified delta capital of Avaris. Introducing bronze weaponry, composite bows, and horse-drawn chariots into the Nile Valley, the dynasty maintained commercial networks until driven out by native Theban pharaohs.
  extra_images:
    - { url: /images/extra/fifteenth-dynasty-of-egypt-1.webp, credit: "Juan R. Lazaro, CC BY 2.0, via Wikimedia Commons", caption: "Granite lion inscribed for the Hyksos king Khyan, found at Baghdad (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Khyan.jpg" }
    - { url: /images/extra/fifteenth-dynasty-of-egypt-2.webp, credit: "Schuppi, CC BY-SA 3.0, via Wikimedia Commons", caption: "Alabaster lid with the cartouche of the Hyksos king Khyan, found in the palace of Knossos, Crete (Heraklion Archaeological Museum)", source: "https://commons.wikimedia.org/wiki/File:Lid_of_Khyan.png" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=4M4YiyhzMgs
      title: "Hyksos: The Mysterious ,,Foreign Kings'' of Egypt"
      credit: Genetic Journeys, YouTube
- id: sixteenth-dynasty-of-egypt
  description: A regional Theban dynasty of Upper Egypt that governed the Nile Valley between Thebes and Elephantine during the turbulent Second Intermediate Period. Besieged by devastating local famines, northern pressure from the Hyksos, and southern attacks from Kush, this resilient kingdom maintained native pharaonic traditions until succeeded by the Seventeenth Dynasty.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=vPU_KAI-LI4
      title: "The Second Intermediate Period: A Complete Overview (1700–1550 BC)"
      credit: Made In History, YouTube
- id: seventeenth-dynasty-of-egypt
  description: The native Theban dynasty of Upper Egypt during the late Second Intermediate Period that mounted a national war of liberation against the northern Hyksos occupiers. Under martial rulers like Seqenenre Tao, Kamose, and Ahmose I, Theban armies pushed northward, capturing Avaris and ushering in the glorious New Kingdom.
  extra_images:
    - { url: /images/extra/seventeenth-dynasty-of-egypt-1.webp, credit: "CaptMondo, CC BY-SA 3.0, via Wikimedia Commons", caption: "Gilded 'rishi' (feathered) coffin of King Nubkheperre Intef, from Dra Abu el-Naga, Thebes, about 1600 BCE (British Museum)", source: "https://commons.wikimedia.org/wiki/File:WoodenCoffinOfIntef-BritishMuseum-August21-08.jpg" }
    - { url: /images/extra/seventeenth-dynasty-of-egypt-2.webp, credit: "Andrzej Kośka, CC BY-SA 3.0, via Wikimedia Commons", caption: "Stela of King Kamose recording his war against the Hyksos king Apepi, from Karnak (Luxor Museum)", source: "https://commons.wikimedia.org/wiki/File:Stela_kamose.jpg" }
    - { url: /images/extra/seventeenth-dynasty-of-egypt-3.webp, credit: "Los Angeles County Museum of Art, public domain, via Wikimedia Commons", caption: "Ceremonial bronze axe blade inscribed with the name of King Seqenenre Tao, who died fighting the Hyksos (Los Angeles County Museum of Art)", source: "https://commons.wikimedia.org/wiki/File:Ceremonial_Battle_Axe_Inscribed_with_Name_of_King_Seqenenre_Tao_LACMA_M.80.203.43.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xbxyxqU7gPo
      title: "Seqenenre Tao (1558-1554 BC)"
      credit: DW World History, YouTube
- id: twenty-second-dynasty-of-egypt
  description: An influential Third Intermediate Period dynasty of Meshwesh Libyan origin, founded around 945 BCE by Pharaoh Shoshenq I (biblical Shishak) from his capital at Tanis. Known for revitalizing royal authority, mounting campaigns into the southern Levant, and installing royal princes as high priests of Amun in Thebes, the dynasty eventually fractured into rival delta principalities.
  extra_images:
    - { url: /images/extra/twenty-second-dynasty-of-egypt-1.webp, credit: "Olaf Tausch, CC BY 3.0, via Wikimedia Commons", caption: "The Bubastite Portal at Karnak, built by Shoshenq I and carved with his campaign into Canaan", source: "https://commons.wikimedia.org/wiki/File:Karnak_Tempel_Bubastis-Portal_01.JPG" }
    - { url: /images/extra/twenty-second-dynasty-of-egypt-2.webp, credit: "Tangopaso, public domain, via Wikimedia Commons", caption: "Gold funerary mask of King Shoshenq II, from the royal tombs at Tanis (Egyptian Museum, Cairo)", source: "https://commons.wikimedia.org/wiki/File:Masque_en_or_de_Sheshonq_II_(la_Villette,_2023).jpg" }
    - { url: /images/extra/twenty-second-dynasty-of-egypt-3.webp, credit: "Rama, CC BY-SA 3.0 fr, via Wikimedia Commons", caption: "Gold and lapis lazuli pendant of Osiris between Horus and Isis, inscribed for King Osorkon II (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Jewel_Osiris_family-E_6204-IMG_0641-black.jpg" }
    - { url: /images/extra/twenty-second-dynasty-of-egypt-4.webp, credit: "MiguelHermoso, CC BY-SA 3.0, via Wikimedia Commons", caption: "Bronze statue of Karomama, God's Wife of Amun, inlaid with gold and silver, from Karnak, 22nd Dynasty (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Karomama_Louvre_01.JPG" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=z2qqKTeWcfY
      title: "History of Ancient Egypt: Dynasties XXII & XXIII - Shoshenq I, the Canaanite Campaign and Civil War"
      credit: History with Cy, YouTube
- id: twenty-third-dynasty-of-egypt
  description: A contemporary branch of Libyan pharaohs that governed Upper and Middle Egypt from Leontopolis and Herakleopolis during the fragmented Third Intermediate Period. Coexisting and competing with the Twenty-Second Dynasty in Tanis, this regional line maintained local administrative and religious control until eclipsed by the Nubian conquest of Piye.
  extra_images:
    - { url: /images/extra/twenty-third-dynasty-of-egypt-1.webp, credit: "VivaFox, CC BY-SA 2.0, via Wikimedia Commons", caption: "Limestone statue of King Osorkon III pushing the bark of Sokar, from the Karnak Cachette (Egyptian Museum, Cairo)", source: "https://commons.wikimedia.org/wiki/File:Limestone_statue_of_Osorkon_III.jpg" }
    - { url: /images/extra/twenty-third-dynasty-of-egypt-2.webp, credit: "Michael Martin, CC BY 2.0, via Wikimedia Commons", caption: "Torso of a large bronze statue of King Pedubast I, inlaid with gold and electrum (Calouste Gulbenkian Museum, Lisbon)", source: "https://commons.wikimedia.org/wiki/File:Torso_of_Pedubast_I_by_Michael_Martin.jpg" }
    - { url: /images/extra/twenty-third-dynasty-of-egypt-3.webp, credit: "Neithsabes, CC BY 3.0, via Wikimedia Commons", caption: "Relief of King Takelot III in the chapel of Osiris Heka-Djet at Karnak, built under the 23rd Dynasty", source: "https://commons.wikimedia.org/wiki/File:Karnak_Takelot_III.jpg" }
    - { url: /images/extra/twenty-third-dynasty-of-egypt-4.webp, credit: "Neithsabes, CC BY 3.0, via Wikimedia Commons", caption: "Relief of Shepenupet I, God's Wife of Amun and daughter of Osorkon III, in the chapel of Osiris Heka-Djet at Karnak", source: "https://commons.wikimedia.org/wiki/File:Karnak_Chepenoupet_I.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Vyo7RmOgk2k
      title: "The Third Intermediate Period: A Complete Overview (1077 BC – 744 BC)"
      credit: Made In History, YouTube
- id: twenty-sixth-dynasty-of-egypt
  description: Known as the Saite Renaissance, the Twenty-Sixth Dynasty was the final native dynasty to govern an independent Egypt before the Achaemenid Persian conquest. Ruling from Sais in the western delta, the Saite pharaohs expelled Assyrian garrisons, reopened Mediterranean trade, hired Greek mercenaries, and revived Old and Middle Kingdom artistic and literary styles.
  extra_images:
    - { url: /images/extra/twenty-sixth-dynasty-of-egypt-1.webp, credit: "Metropolitan Museum of Art, CC0, via Wikimedia Commons", caption: "Bust from a statue of Psamtik I, who freed Egypt from the Assyrians and founded the Saite dynasty (Metropolitan Museum of Art)", source: "https://commons.wikimedia.org/wiki/File:Bust_from_Statue_of_a_King_MET_267761.jpg" }
    - { url: /images/extra/twenty-sixth-dynasty-of-egypt-2.webp, credit: "SpeakingArch, CC BY-SA 4.0, via Wikimedia Commons", caption: "Head of King Apries, about 589–570 BCE (Museo Civico Archeologico, Bologna)", source: "https://commons.wikimedia.org/wiki/File:Head_of_Apries,_Dynasty_26,_circa_589-570_BCE,_Museo_Civico_Archeologico,_Bologna,_Italy.jpg" }
    - { url: /images/extra/twenty-sixth-dynasty-of-egypt-3.webp, credit: "Osama Shukir Muhammed Amin, CC BY-SA 4.0, via Wikimedia Commons", caption: "Head of King Amasis II, about 550 BCE (Neues Museum, Berlin)", source: "https://commons.wikimedia.org/wiki/File:Head_of_Amasis_II,_c._550_BCE._From_Egypt._Neues_Museum,_Berlin,_Germany.jpg" }
    - { url: /images/extra/twenty-sixth-dynasty-of-egypt-4.webp, credit: "Dale Cruse, CC BY 2.0, via Wikimedia Commons", caption: "Siltstone sarcophagus of Ankhnesneferibre, God's Wife of Amun and daughter of Psamtik II, from Thebes, about 530 BCE (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Sarcophagus_of_Ankhnesneferibra_(53498175207).jpg" }
