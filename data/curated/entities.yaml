      src: https://www.youtube.com/watch?v=aV6ZZZsCjK8
      title: "Teotihuacan: Where One Becomes a God"
      credit: Ancient Americas, YouTube
# Batch 4A: Egypt Dynasties and Kingdoms
- id: lower-egypt
  description: The northern delta region of ancient Egypt where the Nile fans out into the Mediterranean Sea, characterized by lush papyrus marshes, maritime trade, and fertile agriculture. Historically symbolized by the red crown (Deshret) and the cobra goddess Wadjet, Lower Egypt united with Upper Egypt to form the dual pharaonic monarchy.
  extra_images:
    - { url: /images/extra/lower-egypt-1.webp, credit: "Guillaume Blanchard, CC BY-SA 2.0, via Wikimedia Commons", caption: "Openwork copper-alloy vessel inscribed with the name of King Meryibre Khety, founder of the Herakleopolitan 9th–10th Dynasty (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Egypte_louvre_246_panier.jpg" }
    - { url: /images/extra/lower-egypt-2.webp, credit: "Guillaume Blanchard, CC BY-SA 3.0, via Wikimedia Commons", caption: "Wooden scribe's palette of the chancellor Ourkaoukhety, bearing the cartouche of the Herakleopolitan king Merikare, 10th Dynasty (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Egypte_louvre_249_palette.jpg" }
    - { url: /images/extra/lower-egypt-3.webp, credit: "Dorieo, CC BY-SA 4.0, via Wikimedia Commons", caption: "Tomb relief of herdsmen leading cattle and an oryx, from the First Intermediate Period cemetery of Herakleopolis Magna, capital of the northern kings (National Archaeological Museum, Madrid)", source: "https://commons.wikimedia.org/wiki/File:Fragmento_de_pared_de_una_mastaba_con_escena_de_ganadería._Primer_periodo_intermedio_de_Egipto_01.jpg" }
    - { url: /images/extra/lower-egypt-4.webp, credit: "Dorieo, CC BY-SA 4.0, via Wikimedia Commons", caption: "Tomb relief naming a commander of the Herakleopolitan army, from the First Intermediate Period cemetery of Herakleopolis Magna (National Archaeological Museum, Madrid)", source: "https://commons.wikimedia.org/wiki/File:Fragmento_de_pared_de_tumba._Primer_periodo_intermedio_de_Egipto.jpg" }
