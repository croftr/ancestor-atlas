- id: roman-empire
  category: civilization
  description: "From a small city on the Tiber, Rome conquered Italy and then the whole Mediterranean. In 27 BCE, after a century of civil wars, Augustus became its first emperor, and for two centuries the Roman peace let trade, roads and cities flourish from Britain to Syria under one law. Latin became the root of many European languages. Divided in two in 395 CE, the western empire fell to Germanic kings in 476, while the eastern half, ruled from Constantinople, lasted until 1453."
