  extra_images:
    - { url: /images/extra/sintashta-1.webp, credit: "Russian Archaeological Expedition, CC BY-SA 4.0, via Wikimedia Commons", caption: "Aerial view of the circular fortified settlement of Arkaim in the southern Urals", source: "https://commons.wikimedia.org/wiki/File:%D0%90%D1%80%D0%BA%D0%B0%D0%B8%D0%BC_2015_(cropped).jpg" }
