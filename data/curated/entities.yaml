- id: roman-kingdom
  description: The foundational monarchical period of ancient Rome, traditionally inaugurated by Romulus in 753 BCE and ending with the expulsion of the tyrant Tarquin the Proud in 509 BCE. During this era, Rome evolved from a modest pastoral settlement on the Tiber into an organized city-state, establishing the Senate, curiae, and core religious institutions.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=d4hA2ESdvE0
      title: "The Seven Kings of Rome: How the Roman Kingdom Shaped History"
      credit: Epoch Atlas, YouTube
- id: phoenician-colonies
  description: The widespread network of trading posts, naval stations, and permanent colonies established across the Mediterranean basin by Phoenician mother-cities like Tyre and Sidon. Spanning Cyprus, Malta, Sicily, Sardinia, North Africa (Carthage), and southern Iberia (Gadir), these settlements secured critical mineral and agricultural trade routes, diffusing Levantine culture and alphabetic writing.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=mU4aU5yoyp4
      title: "History of the Phoenicians: The Maritime Superpowers of the Mediterranean"
      credit: World History Encyclopedia, YouTube
- id: sacred-band-of-thebes
  description: The elite military vanguard of the ancient city-state of Thebes, composed of 150 pairs of dedicated male hoplite companions. Under the leadership of Epaminondas and Pelopidas, this renowned unit shattered Spartan military supremacy at the Battle of Leuctra in 371 BCE, remaining undefeated until annihilation by Philip II at Chaeronea.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xWsZwlN1j3c
      title: Units of History - The Sacred Band of Thebes DOCUMENTARY
      credit: Invicta, YouTube
- id: polyperchon
  description: The Macedonian regency governed by Polyperchon, an experienced veteran commander of Philip II and Alexander the Great appointed supreme regent of the empire in 319 BCE. Opposed by Cassander and rival Diadochi generals, Polyperchon championed Greek liberties and allied with Alexander's mother Olympias during bitter dynastic wars for control of Macedonia.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=m0eK2Iw_FpQ
      title: Polyperchon, disappears from history in 304 BCE
      credit: Thersites the Historian, YouTube
- id: antigonid-dynasty
  description: The Macedonian royal house founded by Antigonus I Monophthalmus ('the One-Eyed'), which ruled the kingdom of Macedon throughout much of the Hellenistic period. Reestablished firmly by Antigonus II Gonatas, the dynasty maintained hegemony over mainland Greece until its final defeat by the Roman Republic at the Battle of Pydna in 168 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=hwWwGAqi-94
      title: "Antigonus the One-Eyed: Alexander's most Ambitious General"
      credit: Antiquity for All, YouTube
- id: antigonid-macedonia
  description: The restored Macedonian kingdom under Antigonid rule, serving as the strategic and military northern bulwark of the Hellenistic Greek world. Guarding Aegean frontiers against Balkan incursions while projecting garrisons across Greece, the kingdom fought three hard-fought Macedonian Wars against the expanding Roman Republic before being dismantled into four Roman client republics.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=PEVIhMUuYMg
      title: The Animated History of the Antigonids
      credit: Ancient History Guy, YouTube
- id: greek-colonies
  description: The energetic Archaic and Classical diaspora of self-governing Greek settlements established across the Mediterranean and Black Sea coasts from the 8th to 6th centuries BCE. From Magna Graecia in southern Italy and Sicily (Syracuse) to Massalia in Gaul and the Black Sea, these colonies spread Greek civic institutions, commerce, and Mediterranean maritime culture.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ABHUeTRvOQ8
      title: Introduction to Ancient Greek Colonies
      credit: History with Cy, YouTube
- id: mamertines
  description: A band of Campanian mercenary soldiers originally hired by Agathocles of Syracuse who mutinied, seized the strategic city of Messina in Sicily in 289 BCE, and conducted piracy. Their subsequent appeals for protection against Hiero II of Syracuse to both Carthage and Rome directly ignited the First Punic War in 264 BCE.
  image_url: /images/civilisations/mamertines.webp
  image_caption: Campanian mercenaries holding the fortified harbor of Messana on the Strait of Sicily, guarding the strategic maritime gateway between Sicily and the Italian mainland.
  image_credit: AI-generated illustration
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=P4ewPrVTuwM
      title: "First Punic Wars Part 1: The Eve of War"
      credit: Ashes of history, YouTube
- id: illyrian-kingdom
  description: An ancient Balkan confederation and kingdom of Illyrian tribes situated along the Adriatic coast in modern Albania, Montenegro, and Bosnia. Under rulers like King Agron and Queen Teuta, Illyria fielded formidable lembi warships that dominated Adriatic trade routes, triggering armed conflict and two wars with the Roman Republic.
  image_url: /images/civilisations/illyrian-kingdom.webp
  image_caption: Adriatic coastal fortress of Scodra with swift lembi war galleys, chieftains in Illyrian bronze helmets trading silver ingots with Greek merchants.
  image_credit: AI-generated illustration
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=8fDuTqAmo9M
      title: History of the Illyrians - Ancient Civilizations DOCUMENTARY
      credit: Kings and Generals, YouTube
- id: molossians
  description: A prominent tribal kingdom of ancient Epirus located in the rugged mountainous highlands of northwestern Greece, centered on the sacred oracle sanctuary of Dodona. Uniting the Epirote tribes under the Aeacid royal house, the Molossians produced celebrated warrior-statesman Pyrrhus of Epirus, famed for his costly victories against the early Roman Republic.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=gGiidErAW7w
      title: They DEFIED Rome - The Kingdom of Epirus
      credit: See U in History / Mythology, YouTube
- id: italian-city-states
  description: The mosaic of ancient urban communities and tribal federations—including Samnites, Sabines, Volsci, Latins, and Campanians—that inhabited the Italian peninsula prior to Roman unification. Fiercely protecting local sanctuaries and democratic assemblies, these peoples engaged in repeated mountain conflicts like the Samnite Wars before gradually integrating into the Roman commonwealth.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=eeeK7fp5p2I
      title: Ancient Italy Before Rome Took Over (800–500 BC)
      credit: Mapped History, YouTube
- id: carthage
  description: A premier Phoenician maritime empire based in modern Tunisia, founded by Tyrian settlers in the 9th century BCE. Dominating western Mediterranean sea lanes through a vast commercial navy, wealthy trading colonies, and agricultural estates, Carthage fought epic conflicts with Syracuse and Rome during the Punic Wars before its destruction in 146 BCE.
  image_url: /images/civilisations/carthage.webp
  image_credit: AI-generated illustration
  image_caption: "The circular military cothon harbor of Carthage lined with vaulted ship-sheds and Admiralty island, Punic quinqueremes, and the Byrsa citadel crowned by the Temple of Eshmun"
