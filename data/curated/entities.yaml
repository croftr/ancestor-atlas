# Span from English Wikipedia: Yamnaya_culture@1377652974.
- id: yamnaya
  name: Yamnaya culture
  category: culture
  start_year: -3299
  end_year: -2599
  description: "On the grasslands north of the Black and Caspian Seas, around five thousand years ago, herders of the Yamnaya culture buried their dead in pits beneath earth mounds called kurgans, often sprinkled with red ochre. They lived with their herds of cattle and sheep and carried their homes on ox-drawn wagons. Ancient DNA shows that their descendants spread far into Europe and Asia within a few centuries, and many researchers link them to the spread of the Indo-European languages."
  narration: { src: narration/cultures/yamnaya-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "56c906996e" }
  wikipedia_url: https://en.wikipedia.org/wiki/Yamnaya_culture
  wikidata: Q426737
  source_ids: []
  extra_images:
    - { url: /images/extra/yamnaya-1.webp, credit: "Valeriy Sayenko, CC BY-SA 4.0, via Wikimedia Commons", caption: "Yamnaya pit grave excavation showing crouched skeleton sprinkled with red ochre (Zlatopillia, Ukraine)", source: "https://commons.wikimedia.org/wiki/File:Tomb_of_Yamnaya_(Ochre_Grave)_culture_2.jpg" }
    - { url: /images/extra/yamnaya-2.webp, credit: "Odessa Archaeological Museum, CC BY-SA 4.0, via Wikimedia Commons", caption: "Anthropomorphic kurgan stela of the Yamnaya culture (Odessa Archaeological Museum)", source: "https://commons.wikimedia.org/wiki/File:Yamna_culture_Stelae_Odessa.jpg" }
# Span from English Wikipedia: Afanasievo_culture@1369190797.
- id: afanasievo
  name: Afanasievo culture
  category: culture
  start_year: -3299
  end_year: -2499
  description: "In the Altai Mountains and the Minusinsk Basin of southern Siberia, more than two thousand kilometres east of the Volga, people of the Afanasievo culture built the same kind of kurgan graves as the Yamnaya herders far to the west. Their genomes are almost indistinguishable from the Yamnaya's, so this was a migration across the steppe, not just a shared fashion. Some researchers think they spoke an early form of Tocharian, an Indo-European language written much later in western China."
  narration: { src: narration/cultures/afanasievo-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "0c2302c412" }
