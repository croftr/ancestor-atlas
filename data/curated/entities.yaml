      credit: History Class, YouTube
- id: sabaeans
  description: An ancient South Arabian kingdom located in the fertile highlands and desert fringes of modern Yemen, centered on the capital of Marib. Renowned as the biblical realm of Sheba, the Sabaeans built the monumental Great Dam of Marib and monopolized lucrative frankincense and myrrh caravan routes across the Arabian Peninsula.
  image_url: /images/civilisations/sabaeans.webp
  image_caption: Marib in the Kingdom of Saba, with the Great Dam of Marib, monolithic pillars of the Temple of Bar'an, frankincense merchants, and camel caravans.
