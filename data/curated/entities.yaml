  media:
    - kind: video
      src: https://www.youtube.com/watch?v=R9Z8t79YF5k
      title: Kingdom of Kush - History Of Africa with Zeinab Badawi
      credit: BBC, YouTube
- id: cyrenaica
  description: A prosperous Greek settlement region on the Mediterranean coast of eastern Libya, founded in the 7th century BCE around the city of Cyrene. Renowned for its philosophers, horse racing, and monopoly on the prized medicinal plant silphium, Cyrenaica evolved from an independent monarchy into a Hellenistic kingdom before Roman annexation.
  image_url: /images/civilisations/cyrenaica.webp
  image_caption: Greek colony of Cyrene on the Libyan plateau with the Temple of Apollo, theatre, and merchants weighing precious medicinal silphium on balance scales.
  image_credit: AI-generated illustration
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=RI62LGEKbLI
      title: The True Story of Ancient Greece's Lost City in Africa
      credit: History Leaks, YouTube
- id: ptolemaic-kingdom
  description: The wealthy Hellenistic kingdom founded in Egypt by Ptolemy I Soter, Alexander the Great's companion general, which ruled from 305 to 30 BCE. Governed from Alexandria—a global capital of scholarship and commerce boasting the Great Library and Pharos lighthouse—the dynasty blended Greek and Egyptian traditions, concluding with Cleopatra VII's defeat by Octavian.
  extra_images:
    - { url: /images/extra/ptolemaic-kingdom-1.webp, credit: "Marie-Lan Nguyen, public domain, via Wikimedia Commons", caption: "Marble portrait bust of Ptolemy I Soter, founder of the Ptolemaic dynasty and companion general of Alexander the Great (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Ptolemy_I_Soter_Louvre_Ma849.jpg" }
    - { url: /images/extra/ptolemaic-kingdom-2.webp, credit: "Olaf Tausch, CC BY 3.0, via Wikimedia Commons", caption: "Monumental relief of Queen Cleopatra VII and her son Caesarion offering to the gods on the exterior wall of Dendera Temple", source: "https://commons.wikimedia.org/wiki/File:Dendera_Tempel_14.JPG" }
