    - { url: /images/extra/greek-colonies-2.webp, credit: "Berthold Werner, CC BY-SA 3.0, via Wikimedia Commons", caption: "The Temple of Concordia at Akragas (Agrigento), Sicily, about 440 BCE", source: "https://commons.wikimedia.org/wiki/File:Temple_of_Concordia,_Agrigento_BW_2012-10-07_13-09-13.jpg" }
