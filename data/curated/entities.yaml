- id: homo-heidelbergensis
  name: Homo heidelbergensis
  category: species
  start_year: -647050
  end_year: -148050
  description: "A heavy jaw found in a sandpit at Mauer near Heidelberg in 1907, about 600,000 years old, gave this species its name. Homo heidelbergensis had a brain approaching modern size and a strong brow ridge, and fossils from Bodo in Ethiopia, Kabwe in Zambia and Arago in France are often grouped with it. Many researchers see it as the common ancestor of Neanderthals in Europe and modern humans in Africa, though which fossils belong to it is still debated."
