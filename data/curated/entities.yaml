- id: olmec-civilization
  description: "On the humid Gulf Coast of Mexico the Olmecs created one of the first complex societies of Mesoamerica. At San Lorenzo and later La Venta they built earthen platforms and plazas, and carved colossal heads from basalt boulders brought from mountains many kilometres away, probably portraits of their rulers. Their art, their ball game and their reverence for jade and the jaguar shaped the Maya and the cultures that followed them. By around 400 BCE their great centres had been abandoned."
  image_url: /images/civilisations/olmec-civilization.webp
  image_caption: La Venta ceremonial center in the Gulf lowlands, sculptors carving a colossal basalt head surrounded by jadeite-adorned rulers and earthen pyramids.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/olmec-civilization-3.webp, credit: "Ruben Charles, CC BY 2.0, via Wikimedia Commons", caption: "Altar 4 from La Venta, Tabasco, showing an Olmec ruler emerging from a cave niche", source: "https://commons.wikimedia.org/wiki/File:Altar_4_La_Venta_(Ruben_Charles).jpg" }
    - { url: /images/extra/olmec-civilization-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Colossal head from San Lorenzo, Veracruz", source: "https://commons.wikimedia.org/wiki/File:Olmec_Colossal_Head,_San_Lorenzo,_Veracruz,_1200-600_BC.jpg" }
    - { url: /images/extra/olmec-civilization-4.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "The Olmec 'Wrestler' basalt sculpture from Veracruz (National Museum of Anthropology, Mexico City)", source: "https://commons.wikimedia.org/wiki/File:Olmec_Stone_%22Wrestler,%22_Veracruz,_Protoclassic,_600-100_BC,_66cm.jpg" }
    - { url: /images/extra/olmec-civilization-2.webp, credit: "Hiart, CC0, via Wikimedia Commons", caption: "Olmec jade mask, about 800 BCE", source: "https://commons.wikimedia.org/wiki/File:Olmec_jade_mask_from_Veracruz,_c._800_BCE.jpg" }
  narration: { src: narration/civilizations/olmec-civilization-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "6ad3d987f1" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=8xF7ikMhDK4
      title: "The First Explorers of the Olmecs: A Truly Lost Civilization"
      credit: Luke Reagan, YouTube
- id: scythia
  description: An expansive confederation of Iranian equestrian nomadic pastoralists who dominated the Pontic-Caspian steppe north of the Black Sea from the 7th to 3rd centuries BCE. Renowned as formidable mounted archers, the Scythians resisted Persian invasions by Darius the Great and left behind spectacular burial kurgans filled with intricate gold animal-style metallurgy.
  image_url: /images/civilisations/scythia.webp
  image_caption: Scythian steppe encampment and royal burial kurgan, featuring the Tovsta Mohyla gold pectoral, Kostromskaya golden stag, and mounted horse archers.
  image_credit: AI-generated illustration
  extra_images:
