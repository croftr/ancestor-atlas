- id: zapotec-civilization
  description: "In the highland Valley of Oaxaca in southern Mexico, around 500 BCE, the Zapotecs levelled the top of a mountain and built a capital on it, Monte Albán, looking out over three valleys. Around its great plaza they raised temples and a ball court, and lined one building with carved stone figures, the Danzantes, probably of slain captives. Their carvings carry some of the earliest writing and calendar signs in Mesoamerica. Monte Albán was the valley's capital for over a thousand years, but the Zapotec people and their languages live in Oaxaca still."
  narration: { src: narration/civilizations/zapotec-civilization-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "07bb48a316" }
  image_url: /images/civilisations/zapotec-civilization.webp
  image_caption: Mountaintop ceremonial center of Monte Albán overlooking the Oaxaca Valley, with Building J, Danzantes slabs, and priests holding grey-ware urns.
  image_credit: AI-generated illustration
  extra_images:
