- id: australopithecus-afarensis
  name: Australopithecus afarensis
  category: species
  start_year: -3798050
  end_year: -2898050
  description: "In 1974 at Hadar in Ethiopia, Donald Johanson and Tom Gray found Lucy, a 3.2-million-year-old skeleton about 40 percent complete. Australopithecus afarensis stood a little over a metre tall and had a brain hardly larger than a chimpanzee's, but its hips, knees and feet were built for walking upright. Footprints left in volcanic ash at Laetoli in Tanzania about 3.7 million years ago show the same stride. The species lived in East Africa for nearly a million years."
  narration: { src: narration/species/australopithecus-afarensis-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "243293bd56" }
