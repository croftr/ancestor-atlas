    - { url: /images/extra/lydia-2.webp, credit: "Metropolitan Museum of Art, CC0, via Wikimedia Commons", caption: "Heavy gold stater of King Croesus (\"Croeseid\"), depicting confronted foreparts of a roaring lion and bull (Metropolitan Museum of Art)", source: "https://commons.wikimedia.org/wiki/File:Gold_stater._Lydia._ca._560%E2%80%93546_B.C._The_Metropolitan_Museum_of_Art.jpg" }
