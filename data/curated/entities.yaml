    - { url: /images/extra/mauretania-2.webp, credit: "Bernard Gagnon, CC BY 4.0, via Wikimedia Commons", caption: "Marble portrait of the young King Juba II, from his capital Caesarea (Cherchell Archaeological Museum, Algeria)", source: "https://commons.wikimedia.org/wiki/File:Head_of_Juba_II_(Cherchell).jpg" }
