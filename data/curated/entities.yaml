    - { url: /images/extra/greek-city-states-1.webp, credit: "ArchaiOptix, CC BY-SA 4.0, via Wikimedia Commons", caption: "A hoplite on an Athenian red-figure vase", source: "https://commons.wikimedia.org/wiki/File:Flying-Angel_Painter_ARV_280_8_hoplite_with_helmet_greaves_shield_and_spear_(04).jpg" }
    - { url: /images/extra/greek-city-states-4.webp, credit: "Olecorre, CC BY-SA 3.0, via Wikimedia Commons", caption: "The ancient Greek theatre at Epidaurus", source: "https://commons.wikimedia.org/wiki/File:Theatre_of_Epidaurus_OLC.jpg" }
    - { url: /images/extra/greek-city-states-2.webp, credit: "A.Savin, CC BY-SA 3.0, via Wikimedia Commons", caption: "The Parthenon on the Acropolis of Athens", source: "https://commons.wikimedia.org/wiki/File:Attica_06-13_Athens_35_Parthenon.jpg" }
- id: macedonian-empire
  description: "Macedon, a kingdom on the northern edge of the Greek world, was turned into a military power by Philip the Second. His son Alexander, king at twenty, crossed into Asia in 334 BCE and in little more than ten years conquered the Persian Empire, Egypt and lands as far as the Indus, founding cities named Alexandria along the way. When he died in Babylon in 323 BCE, aged thirty-two, his generals fought over the empire and carved it into rival kingdoms that spread Greek language and culture across the east."
  image_url: /images/civilisations/macedonian-empire.webp
  image_caption: Pella and the Royal Tomb at Vergina with a Macedonian sarissa phalanx, Companion cavalry, pebble mosaic courtyard, and Philip II's golden larnax.
  image_credit: AI-generated illustration
  narration: { src: narration/civilizations/macedonian-empire-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "51a1eaafb0" }
