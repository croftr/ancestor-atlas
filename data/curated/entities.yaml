    - { url: /images/extra/new-kingdom-of-egypt-1.webp, credit: "Vyacheslav Argenberg, CC BY 4.0, via Wikimedia Commons", caption: "The Great Hypostyle Hall at Karnak, Luxor", source: "https://commons.wikimedia.org/wiki/File:Luxor,_Egypt,_Karnak,_Great_Hypostyle_Hall.jpg" }
