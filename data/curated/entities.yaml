    - { url: /images/extra/kingdom-of-numidia-2.webp, credit: "Patrick Giraud, CC BY 3.0, via Wikimedia Commons", caption: "The Libyco-Punic mausoleum of Dougga (Thugga), Tunisia, built for a Numidian prince in the 2nd century BCE", source: "https://commons.wikimedia.org/wiki/File:TUNISIA_DOUGGA_MAUSOLEE_LIBYCO_PUNIQUE_001.jpg" }
