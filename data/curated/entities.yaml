      src: https://www.youtube.com/watch?v=uw6iVSlWTJQ
      title: The Forgotten History of Celtic Anatolia
      credit: Study of Antiquity and the Middle Ages, YouTube
- id: kingdom-of-pergamon
  description: An influential Hellenistic kingdom in western Anatolia ruled by the Attalid dynasty from the dramatic acropolis of Pergamon. Celebrated for patronage of the arts, the great Library of Pergamon, and the monumental Pergamon Altar, the kingdom allied closely with Rome until its last ruler bequeathed the realm to the Roman people in 133 BCE.
  image_url: /images/civilisations/kingdom-of-pergamon.webp
  image_caption: Acropolis of Pergamon in the Attalid Kingdom, with the Great Altar of Pergamon, steep cliffside theatre, Library scholars with parchment scrolls, and the Dying Gaul bronze statue.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/kingdom-of-pergamon-1.webp, credit: "QuartierLatin1968, CC BY-SA 2.0, via Wikimedia Commons", caption: "The acropolis of Pergamon seen from the middle city, seat of the Attalid kings", source: "https://commons.wikimedia.org/wiki/File:Acropolis_from_middle_city_Pergamum_466.jpg" }
    - { url: /images/extra/kingdom-of-pergamon-2.webp, credit: "Tomisti, CC BY-SA 3.0, via Wikimedia Commons", caption: "The steep Hellenistic theatre cut into the acropolis hill at Pergamon", source: "https://commons.wikimedia.org/wiki/File:Pergamon_theatre_panorama_2.jpg" }
    - { url: /images/extra/kingdom-of-pergamon-3.webp, credit: "Carole Raddato, CC BY-SA 2.0, via Wikimedia Commons", caption: "Gods fighting giants on the north frieze of the Great Altar of Pergamon, built under Eumenes II, about 170 BCE (Pergamon Museum, Berlin)", source: "https://commons.wikimedia.org/wiki/File:North_Frieze,_Gigantomachy_Frieze,_Pergamon_Altar,_Pergamon_Museum,_Berlin_(24461209519).jpg" }
    - { url: /images/extra/kingdom-of-pergamon-4.webp, credit: "PHGCOM, public domain, via Wikimedia Commons", caption: "Silver tetradrachm of Attalus I with the portrait of Philetaerus, founder of the Attalid dynasty (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Attalus_I_coin_depicting_Philetairos.jpg" }
