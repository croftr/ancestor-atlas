    - { url: /images/extra/kingdom-of-pontus-2.webp, credit: "British Museum, CC BY-SA 4.0, via Wikimedia Commons", caption: "Silver tetradrachm of Mithridates VI Eupator with diademed head and wind-blown hair (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Tetradrachm_of_Mithridates_VI_CM_SNG_BM_1038.jpg" }
    - { url: /images/extra/kingdom-of-pontus-3.webp, credit: "Dosseman, CC BY-SA 4.0, via Wikimedia Commons", caption: "Monumental rock-cut Tombs of the Kings of Pontus carved into the sheer limestone cliffs above Amaseia (Amasya, Turkey)", source: "https://commons.wikimedia.org/wiki/File:Kral_Kaya_Mezarlar%C4%B1,_Amasya_02.jpg" }
    - { url: /images/extra/kingdom-of-pontus-4.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Reverse of Mithridates VI tetradrachm showing Pegasus grazing beside the Pontic star and crescent within an ivy wreath", source: "https://commons.wikimedia.org/wiki/File:Mithradates_VI_Tetradrahmi.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=6yp8VbJAWv4
      title: Kingdom of Pontus
      credit: Costas Melas, YouTube
- id: galatia
  description: A highland territory in central Anatolia settled in the 3rd century BCE by migrating Celtic Gauls (Tectosages, Tolistobogii, and Trocmi). Operating as feared mercenary warriors throughout the Hellenistic Wars, the Galatian tribes maintained distinctive Celtic customs, language, and tetrarchic governance until becoming a client kingdom and Roman province.
  image_url: /images/civilisations/galatia.webp
  image_caption: Celtic Galatia in central Anatolia, showing tetrarch chieftains wearing twisted gold torques and horned helmets, a bronze boar-headed carnyx war trumpet, Celtic chariots, and a hilltop oppidum.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/galatia-1.webp, credit: "Marie-Lan Nguyen, public domain, via Wikimedia Commons", caption: "The Dying Gaul, a Roman marble copy of a bronze set up at Pergamon to celebrate Attalus I's victories over the Galatians (Capitoline Museums, Rome)", source: "https://commons.wikimedia.org/wiki/File:Dying_Gaul_Musei_Capitolini_MC747.jpg" }
    - { url: /images/extra/galatia-2.webp, credit: "Shonagon, CC0, via Wikimedia Commons", caption: "Terracotta of a war elephant trampling a Galatian warrior, from Myrina, recalling the Seleucid 'Elephant Victory' over the Galatians (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Éléphant_chargeant_un_guerrier_galate_-_Musée_du_Louvre_AGER_Myrina_131_;_Myr_284.jpg" }
    - { url: /images/extra/galatia-3.webp, credit: "World Imaging, CC BY-SA 3.0, via Wikimedia Commons", caption: "Gold torques from the Galatian tumulus at Hıdırşıhlar, Bolu, 3rd century BCE (Museum of Anatolian Civilizations, Ankara)", source: "https://commons.wikimedia.org/wiki/File:Galatian_torques_3rd_century_BCE_Bolu_Hidirsihlar_tumulus.jpg" }
    - { url: /images/extra/galatia-4.webp, credit: "World Imaging, CC BY-SA 3.0, via Wikimedia Commons", caption: "Galatian bronze horse bit (Museum of Anatolian Civilizations, Ankara)", source: "https://commons.wikimedia.org/wiki/File:Galatian_bronze_horse_bit.jpg" }
