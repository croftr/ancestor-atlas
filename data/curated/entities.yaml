      title: "Did You Know Ancient Greece Had Its Dark Ages?"
      credit: Kings and Generals, YouTube
- id: greek-city-states
  description: "Among the mountains and islands of Greece, hundreds of independent city-states, each a polis with its own laws and gods, grew up after about 800 BCE. They planted colonies around the Mediterranean and the Black Sea, competed at the Olympic Games, and joined forces to drive back the Persian invasions of 490 and 480 BCE. Athens gave the world democracy, drama, philosophy and the Parthenon, but long wars between Athens and Sparta wore the cities down, and in 338 BCE Philip the Second of Macedon brought them under his control."
  image_url: /images/civilisations/greek-city-states.webp
  image_caption: Classical Greek coastal polis with an acropolis temple, Aegean harbor triremes, citizen-hoplites with emblazoned aspis shields, and black-figure vase painters.
  image_credit: AI-generated illustration
