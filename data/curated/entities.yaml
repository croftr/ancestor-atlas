      src: https://www.youtube.com/watch?v=kpchFt5sZKE
      title: Roman Bithynia and Pontus
      credit: Schwerpunkt, YouTube
- id: kingdom-of-armenia
  description: A major kingdom in the Armenian Highlands that reached imperial status under Tigranes the Great in the 1st century BCE, stretching from the Caspian to the Mediterranean. Buffering the Roman and Parthian empires, Armenia fostered a distinct national identity and became the world's first state to officially adopt Christianity in 301 CE.
  image_url: /images/civilisations/kingdom-of-armenia.webp
  image_caption: Garni and the Azat River gorge in the Kingdom of Armenia, showing King Tigranes the Great in the star-and-eagle tiara, silver tetradrachms, the Ionic Temple of Garni, and Mount Ararat.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/kingdom-of-armenia-1.webp, credit: "Public domain, via Wikimedia Commons", caption: "Silver tetradrachm of Tigranes II the Great (c. 95–55 BCE) wearing the Armenian tiara adorned with eight-pointed star and eagles, reverse showing the Tyche of Antioch", source: "https://commons.wikimedia.org/wiki/File:Tetradrachm_Tigranes_II.jpg" }
    - { url: /images/extra/kingdom-of-armenia-2.webp, credit: "Kevork Berberian, CC BY-SA 3.0, via Wikimedia Commons", caption: "The monumental Ionic Temple of Garni (1st century CE), colonnaded royal sanctuary of the Artaxiad/Arsacid kings of Armenia", source: "https://commons.wikimedia.org/wiki/File:The_Temple_of_Garni.JPG" }
    - { url: /images/extra/kingdom-of-armenia-3.webp, credit: "Public domain, via Wikimedia Commons", caption: "Artaxias I royal boundary stele with Aramaic royal inscription (\"King Artaxias, son of Zariadres\"), 2nd century BCE (History Museum of Armenia)", source: "https://commons.wikimedia.org/wiki/File:Artaxias_Aramaic_border_stone.jpg" }
    - { url: /images/extra/kingdom-of-armenia-4.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Damascus-mint tetradrachm of Tigranes the Great commemorating the Armenian expansion into Syria and the Levant", source: "https://commons.wikimedia.org/wiki/File:Tetradrachm_Tigranes_II_minted_in_Damascus.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=mAsF1xwRS34
      title: "The ENTIRE History of ARMENIA | FULL DOCUMENTARY"
      credit: Our Ancient World, YouTube
- id: kingdom-of-lysimachus
  description: The Hellenistic realm carved out by Lysimachus, a companion general of Alexander the Great who ruled Thrace, northwestern Anatolia, and Macedonia following the Battle of Ipsus. Built around strategic strongholds like Lysimachia, his short-lived kingdom collapsed when Lysimachus was defeated and killed by Seleucus I at the Battle of Corupedium in 281 BCE.
  extra_images:
    - { url: /images/extra/kingdom-of-lysimachus-1.webp, credit: "ArchaiOptix, CC BY-SA 4.0, via Wikimedia Commons", caption: "Silver tetradrachm of Lysimachus with the deified Alexander wearing the ram's horn of Ammon, 305–281 BCE (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Thrace_-_king_Lysimachos_-_305-281_BC_-_siver_tetradrachm_-_head_of_Alexander_III_-_Athena_Nikephoros_-_London_BM_1919-0820-1.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ZIIOThLHeTY
      title: "The Forgotten King: Lysimachus and the Rise of the Diadochi"
      credit: WarBios, YouTube
- id: laomedon
  description: The satrapy of Syria and Phoenicia assigned to Alexander the Great's general Laomedon of Mytilene following the Partition of Babylon in 323 BCE. Controlling vital Levantine ports and timber reserves, Laomedon ruled briefly before being ousted and captured by Ptolemy I Soter's forces during the Wars of the Diadochi.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=vqqWcJ73_wY
      title: "Laomedonte: El Diádoco que Perdió Siria ante Ptolomeo"
      credit: Jenofonte, YouTube
- id: perdiccas
  description: The central regency of the Macedonian Empire governed by Perdiccas, Alexander the Great's chief cavalry commander and supreme regent following Alexander's sudden death in 323 BCE. Struggling to preserve imperial unity against rival Diadochi generals, Perdiccas launched an invasion of Ptolemaic Egypt where he was assassinated by his own mutinous officers in 321 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Jpzt9ovg9vU
      title: First War of the Diadochi - Alexander's Successors At War DOCUMENTARY
      credit: Kings and Generals, YouTube
- id: colchis
  description: An ancient Georgian kingdom situated along the eastern Black Sea coast in modern western Georgia, famous in Greek myth as the destination of Jason and the Argonauts for the Golden Fleece. Blessed with rich alluvial gold deposits, timber, and fertile coastal valleys, Colchis was a thriving hub of Black Sea trade and metallurgy.
  image_url: /images/civilisations/colchis.webp
  image_caption: Vani and the Phasis River in ancient Colchis, showing gold granulation jewelry, sheepskin gold-panning troughs along the riverbank, and hilltop stone-and-timber temple terraces.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/colchis-1.webp, credit: "Jonathan Cardy, CC BY-SA 3.0, via Wikimedia Commons", caption: "Gold earring with granulation and tiny birds, Colchian goldwork (Georgian National Museum, Tbilisi)", source: "https://commons.wikimedia.org/wiki/File:Colchis_earring,_gold_with_birds.jpg" }
    - { url: /images/extra/colchis-2.webp, credit: "Jonathan Cardy, CC BY-SA 3.0, via Wikimedia Commons", caption: "Pair of Colchian gold pendants with horsemen (Georgian National Museum, Tbilisi)", source: "https://commons.wikimedia.org/wiki/File:Colchis_riders_pendants_-_pair.JPG" }
    - { url: /images/extra/colchis-3.webp, credit: "Gaga.vaa, CC BY-SA 4.0, via Wikimedia Commons", caption: "Remains of a temple at Vani, the hilltop sanctuary city of Colchis in western Georgia", source: "https://commons.wikimedia.org/wiki/File:Vani,_Ruins_of_ancient_temple.jpg" }
