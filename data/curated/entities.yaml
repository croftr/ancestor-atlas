    - { url: /images/extra/akkadian-empire-3.webp, credit: "Mefman00, CC0, via Wikimedia Commons", caption: "Alabaster disk of Enheduanna, daughter of Sargon of Akkad and high priestess at Ur", source: "https://commons.wikimedia.org/wiki/File:Disk_of_Enheduanna.JPG" }
