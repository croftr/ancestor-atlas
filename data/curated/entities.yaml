- id: ardipithecus-ramidus
  name: Ardipithecus ramidus
  category: species
  start_year: -4498050
  end_year: -4298050
  description: "At Aramis in Ethiopia's Middle Awash, researchers spent fifteen years recovering and studying 'Ardi', a partial skeleton 4.4 million years old, published in 2009. About 1.2 metres tall, Ardi had an opposable big toe for gripping branches, yet a pelvis adapted for walking upright on the ground. She lived in woodland rather than open savanna, overturning the old idea that our ancestors first stood upright to cross the grasslands."
  narration: { src: narration/species/ardipithecus-ramidus-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "07f26f7776" }
