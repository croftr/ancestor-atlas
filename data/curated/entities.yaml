    - { url: /images/extra/nabataeans-2.webp, credit: "Argenberg, CC BY-SA 3.0, via Wikimedia Commons", caption: "Nabataean painted fine ware eggshell-thin terracotta bowls with delicate floral motifs (Petra Museum)", source: "https://commons.wikimedia.org/wiki/File:Nabataean_Pottery.JPG" }
    - { url: /images/extra/nabataeans-3.webp, credit: "Poco a poco, CC BY 4.0, via Wikimedia Commons", caption: "Ad-Deir (The Monastery), colossal 1st-century CE Nabataean rock-cut temple facade at Petra", source: "https://commons.wikimedia.org/wiki/File:Ad_Deir_(The_Monastery),_El_Deir,_Petra,_Jordan.jpg" }
    - { url: /images/extra/nabataeans-4.webp, credit: "Classical Numismatic Group, CC BY-SA 4.0, via Wikimedia Commons", caption: "Silver drachm of Nabataean King Aretas IV Philopatris and Queen Shaqilath, minted in Petra", source: "https://commons.wikimedia.org/wiki/File:Coin_of_Aretas_IV_and_Shaqilath.jpg" }
