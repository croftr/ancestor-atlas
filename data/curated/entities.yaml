    - { url: /images/extra/phrygia-2.webp, credit: "EvgenyGenkin, CC BY 2.5, via Wikimedia Commons", caption: "Monumental Phrygian bronze cauldron with cast winged siren handle attachments from Tumulus MM at Gordion, late 8th century BCE (Ankara)", source: "https://commons.wikimedia.org/wiki/File:UrartianCaldron03~.jpg" }
    - { url: /images/extra/phrygia-3.webp, credit: "Dosseman, CC BY-SA 4.0, via Wikimedia Commons", caption: "Phrygian cast bronze lion-headed ceremonial situla (drinking bucket) from the elite royal tombs of Gordion (Ankara)", source: "https://commons.wikimedia.org/wiki/File:Museum_of_Anatolian_Civilizations_Lion-headed_situla_in_2011_05.jpg" }
    - { url: /images/extra/phrygia-4.webp, credit: "Zde, CC BY-SA 4.0, via Wikimedia Commons", caption: "Phrygian painted architectural terracotta relief tile showing wild goats flanking the Tree of Life, from Pazarlı, 6th century BCE (Ankara)", source: "https://commons.wikimedia.org/wiki/File:Goats_near_the_tree_of_life,_tile,_Pazatli,_6th_century_BC,_MACA,_3089.jpg" }
