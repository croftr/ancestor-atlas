    - { url: /images/extra/carthage-2.webp, credit: "Rais67, public domain, via Wikimedia Commons", caption: "Terracotta grotesque grinning protective mask from the Punic necropolis of Carthage (Bardo National Museum)", source: "https://commons.wikimedia.org/wiki/File:Tunis_Bardo_Masque_10.jpg" }
    - { url: /images/extra/carthage-3.webp, credit: "Jamie Heath, CC BY-SA 2.0, via Wikimedia Commons", caption: "Bronze naval rams (rostra) recovered from the seabed of the Battle of the Egadi Islands, 241 BCE (First Punic War)", source: "https://commons.wikimedia.org/wiki/File:Carthago_exhibition_-_Aegadi_Rams_(49340681036).jpg" }
    - { url: /images/extra/carthage-4.webp, credit: "Public domain, via Wikimedia Commons", caption: "Excavated residential quarters and multistory stone house foundations on the slopes of the Byrsa citadel, Carthage", source: "https://commons.wikimedia.org/wiki/File:Quartier_Punique.JPG" }
