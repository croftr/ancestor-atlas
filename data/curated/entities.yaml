      credit: Secret Record, YouTube
- id: lazica
  description: An ancient Georgian successor kingdom to Colchis located along the southeastern Black Sea coast in modern western Georgia (Egrisi). Controlling strategic Caucasian alpine trade passes, Lazica was a vital battleground and client buffer state contested between the Eastern Roman (Byzantine) and Sasanian Persian empires.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=7Wkien4HwJc
      title: "E31 - The Kingdom of Lazica | The History of Saqartvelo Georgia"
      credit: The History Of Saqartvelo Georgia, YouTube

# Batch 3: Iran, Central Asia, Steppes, Americas, Greece, Thrace, Axum, Vietnam
- id: elam
  description: An ancient civilization centered in southwestern Iran across Khuzestan and the Zagros highlands, with principal capitals at Susa and Anshan. Contemporaries and frequent rivals of Sumer, Babylon, and Assyria, the Elamites developed their own Linear Elamite and cuneiform scripts, monumental brick ziggurats like Chogha Zanbil, and deeply influenced the rise of the Persian Empire.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=jkFwh_saHmc
      title: "The Ancient Kingdom of Elam, what was it?"
      credit: BenjaminAngwin, YouTube
- id: gutian-dynasty
  description: A line of rulers originating from the Zagros Mountains who seized control of central and southern Mesopotamia following the decline of the Akkadian Empire. Though remembered in later Sumerian king lists as destructive overlords, Gutian kings ruled for roughly a century before being ousted by Utu-hengal of Uruk.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=klO4RJc0qWQ
      title: "Were Gutians Tocharians?"
      credit: Germania Magna ENG, YouTube
- id: mycenaean-greece
  description: The mainland Greek civilization of the Late Bronze Age, immortalized in Homeric epic poetry, centered at fortified citadels such as Mycenae, Tiryns, and Pylos. Governed by warrior-kings (wanakes), the Mycenaeans developed the Linear B syllabic script—the earliest attested Greek—and established trade networks across the Mediterranean before collapsing around 1200 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=0HXSPu1UMZM
      title: "The Bronze Age Civilization That Became Greek Mythology — The Mycenaeans"
      credit: Paladin, YouTube
- id: greek-dark-ages
  description: The transitional period of ancient Greek history following the catastrophic Late Bronze Age collapse of Mycenaean palace culture. Characterized initially by depopulation, the loss of Linear B literacy, and regional isolation, this era witnessed the adoption of ironworking, the spread of the Greek alphabet, and the foundational emergence of the independent polis (city-state).
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=C5rIbTq9txY
      title: "Did You Know Ancient Greece Had Its Dark Ages?"
      credit: Kings and Generals, YouTube
- id: greek-city-states
  description: The network of fiercely independent, self-governing poleis—including Athens, Sparta, Corinth, and Thebes—that defined Archaic and Classical Greek civilization across the Aegean basin. Despite frequent rivalries and wars, these city-states shared a common language, Olympian pantheon, Panhellenic games, and pioneered foundational philosophies, democratic governance, civic institutions, and classical arts.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=tbUCXGbaV6A
      title: "Athens vs Sparta: The Epic Rise of Greece’s Greatest City-States"
      credit: Speed Study, YouTube
- id: macedonian-empire
  description: The expansive classical empire forged by Philip II and dramatically expanded by Alexander the Great between 336 and 323 BCE. Sweeping from Greece and Egypt to the Indus River, Macedonian armies shattered the Achaemenid Persian Empire, inaugurating the Hellenistic era that fused Greek, Near Eastern, and Central Asian cultures across three continents.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=K7lb6KWBanI
      title: "The Greatest General in History? Alexander the Great (All Parts)"
      credit: Epic History, YouTube
- id: olmec-civilization
  description: Considered the 'mother culture' of Mesoamerica, the Olmec civilization flourished along the tropical Gulf Coast lowlands of modern Veracruz and Tabasco. Famous for monumental basalt colossal heads, complex ceremonial centers like San Lorenzo and La Venta, and jade carvings, the Olmecs pioneered the Mesoamerican ballgame, early writing, and calendar systems.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=8xF7ikMhDK4
      title: "The First Explorers of the Olmecs: A Truly Lost Civilization"
      credit: Luke Reagan, YouTube
- id: scythia
  description: An expansive confederation of Iranian equestrian nomadic pastoralists who dominated the Pontic-Caspian steppe north of the Black Sea from the 7th to 3rd centuries BCE. Renowned as formidable mounted archers, the Scythians resisted Persian invasions by Darius the Great and left behind spectacular burial kurgans filled with intricate gold animal-style metallurgy.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=UuPNMQmwLAQ
      title: "Scythians - Rise and Fall of the Original Horselords"
      credit: Kings and Generals, YouTube
- id: median-kingdom
  description: An ancient Iranian tribal confederation and empire centered at Ecbatana (modern Hamadan, Iran) in the Zagros Mountains. Allying with Nabopolassar of Babylon to overthrow the Neo-Assyrian Empire in 612 BCE, the Medes controlled a vast territory from eastern Anatolia to the Iranian plateau before Cyrus the Great incorporated Media into the Achaemenid Empire.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=XF9-27lMhpE
      title: "The Transition of the Medes – How the Median Empire Became Persia"
      credit: World's Secret Stories, YouTube
- id: achaemenid-empire
  description: The first Persian Empire, founded by Cyrus the Great in 550 BCE, which became the largest empire in antiquity spanning from the Balkans and Egypt to the Indus Valley. Governed from Persepolis and Susa via a sophisticated satrapy system, the Royal Road, and postal courier networks, the empire pioneered religious tolerance before falling to Alexander the Great.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ZoH2UQZBaPY
      title: "Cyrus the Great - Rise of the Achaemenid Empire"
      credit: Kings and Generals, YouTube
- id: peloponnesian-league
  description: A major military confederation of Greek city-states in the Peloponnese, founded and led by Sparta from the 6th to 4th centuries BCE. Formed to ensure mutual security and check rival Argive power, the league formed the core of the Hellenic alliance against Persia and ultimately defeated the Athenian Empire in the Peloponnesian War.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Jr8EGJwDCk8
      title: "The Full History of the Peloponnesian War - Athens vs Sparta"
      credit: Kings and Generals, YouTube
- id: zapotec-civilization
  description: An advanced indigenous pre-Columbian civilization centered in the highland Valley of Oaxaca in southern Mexico. Ruling from the mountaintop acropolis city of Monte Albán, the Zapotecs developed the earliest known written glyphic script and calendar in Mesoamerica, terrace farming, and monumental ballcourts that flourished for over a millennium.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bV_4XySFa94
      title: "The Rise and Fall of the ZAPOTEC EMPIRE"
      credit: World of Antiquity, YouTube
- id: odrysian-kingdom
  description: The largest and most powerful Thracian tribal state, founded by King Teres I in the 5th century BCE in modern Bulgaria, northern Greece, and European Turkey. Bridging the Greek and barbarian worlds through lavish cavalry forces and diplomatic marriages, the Odrysians dominated regional Balkan trade before fracturing under Macedonian and Roman pressure.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=641pAxUD0So
      title: "Odrysian Kings #1 (Thracian History)"
      credit: Kings and Things, YouTube
- id: cimmerian-bosporus
  description: An enduring Hellenistic-Scythian kingdom centered on the Kerch Strait between the Black Sea and the Sea of Azov in modern Crimea. Melding Greek polis culture with Steppe nomad traditions, the Bosporan Kingdom prospered as a primary grain exporter to classical Athens and survived for centuries as a vital Roman client state.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ltikjXUiAC4
      title: "Bosporan Kingdom - Longest Surviving Ancient Greek State"
      credit: Kings and Generals, YouTube
- id: second-athenian-league
  description: A defensive maritime confederation of Aegean city-states established by Athens in 378 BCE to counter Spartan hegemony while avoiding the oppressive imperial abuses of the earlier Delian League. The alliance secured Aegean sea routes and curbed Spartan ambitions, but dissolved following the Social War when key allies rebelled against renewed Athenian dominance.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=f0UYZRxSrqA
      title: "History of Athens, 1st and 2nd Athenian Empire"
      credit: Costas Melas, YouTube
- id: thebans
  description: The ancient Greek citizens and military power of Thebes, the preeminent city of the Boeotian confederacy in central Greece. Reaching its geopolitical zenith under Epaminondas in the 4th century BCE, Thebes broke Spartan hegemony and liberated the Messenian helots before being destroyed by Alexander the Great following an uprising in 335 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=CRJAZUbWU9A
      title: "When 6,000 Thebans CRUSHED 10,000 Spartans | Battle of Leuctra"
      credit: TRUE HAPPENED, YouTube
- id: athenian-coalition
  description: The alliance of Aegean and Ionian maritime city-states led by democratic Athens—originating from the Delian League—during the protracted Peloponnesian War against Sparta (431–404 BCE). Powered by Athenian naval supremacy (triremes) and funded by tributary wealth, the coalition defended maritime commerce across the Aegean until its catastrophic defeat at Aegospotami.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=FIDEgPb8HH8
      title: "The Rise of Athens: The Delian League (479-445 BC)"
      credit: Historic Battles, YouTube
- id: seleucid-empire
  description: The major Hellenistic empire founded by Seleucus I Nicator in 312 BCE following the partition of Alexander the Great's empire, stretching from Anatolia and Syria across Mesopotamia to Bactria. Ruling from Antioch and Seleucia on the Tigris, the Seleucid kings established Greek colonist cities and military settlements that cross-pollinated Greek, Babylonian, and Iranian cultures.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ikJGoOAREbU
      title: "History of the Seleucid Empire | Complete Animated Documentary"
      credit: Ancient History Guy, YouTube
- id: atropatene
  description: An ancient Iranian kingdom in northwestern Media (modern Iranian Azerbaijan) founded around 323 BCE by the Persian satrap Atropates, who successfully preserved his realm's independence amid the Wars of the Diadochi. Thriving as an autonomous Zoroastrian cultural center, Atropatene gave its name to modern Azerbaijan while skillfully maneuvering between Seleucid, Parthian, and Roman imperial spheres.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=-1XbXfBUxb8
      title: "The History Of Atropatene"
      credit: MadeInTurkey, YouTube
- id: aetolian-league
  description: A hardy federal confederation of mountain communities and city-states in central Greece that emerged as a major military power during the Hellenistic era. Governed by a representative council, the league repelled Celtic invaders at Delphi, contested Macedonian dominance, and allied with Rome before disastrously siding with Antiochus III against Roman expansion.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=v8j3OKjwGoU
      title: "Aetolian League"
      credit: Costas Melas, YouTube
- id: achaean-league
  description: A federal confederation of Greek city-states based in the northern Peloponnese, which expanded under statesman Aratus of Sicyon to incorporate Corinth, Argos, and Megalopolis. Championing Greek unity against Spartan and Macedonian dominance, the league was the last bastion of Greek political autonomy before its defeat and dissolution by Rome in 146 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=pAxZOepCLJA
      title: "A Brief Overview of the Achaean League"
      credit: Boring History, YouTube
- id: au-lac
  description: An ancient proto-Vietnamese kingdom established in the Red River Delta of northern Vietnam by Thục Phán (King An Dương Vương) around 257 BCE. Centered on the monumental spiral-walled fortress of Cổ Loa, Âu Lạc was celebrated for bronze casting and sophisticated mechanical crossbow technology before being conquered by Nanyue.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=67xJnkAKL_0
      title: "The Story of Au Lac"
      credit: 3388 Films, YouTube
- id: greco-bactrian-kingdom
  description: An extraordinary Hellenistic kingdom established around 250 BCE by Diodotus I in Central Asia (modern Afghanistan, Uzbekistan, and Tajikistan). Renowned for opulent cities like Ai-Khanoum, magnificent Hellenistic coin minting, and fortified oasis settlements, the kingdom bridged Greek Mediterranean culture with India and the Steppe, eventually expanding south to create the Indo-Greek Kingdom.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ZyxX_vsDzL0
      title: "Rise and Fall of the Greco-Bactrian Kingdom | The Forgotten Greek Empire in Central Asia"
      credit: TimelessTreasury, YouTube
- id: mayan-city-states
  description: A sophisticated Mesoamerican civilization spanning southeastern Mexico, Guatemala, Belize, and western Honduras. Organized into competing city-states like Tikal, Calakmul, and El Mirador, the Maya engineered tropical agriculture, developed the most fully articulated pre-Columbian hieroglyphic script, advanced astronomical mathematics, and monumental corbeled-vault architecture.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=z9YwfTerAdA
      title: "3. The Mayans - Ruins Among the Trees"
      credit: Fall of Civilizations, YouTube
- id: parthian-empire
  description: A major Iranian empire founded in 247 BCE by Arsaces I after the Parni tribe seized Parthia from the Seleucid Empire. Governed through a decentralized feudal nobility and famed for invincible armored cataphracts and mounted archers utilizing the deceptive 'Parthian shot', the Arsacids dominated Silk Road trade and repeatedly repelled Roman legions until overthrown by the Sasanians.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=c_Fbyc415yM
      title: "The Rise and Fall of Parthia - Rome's Greatest Enemy - Ancient Civilizations"
      credit: Kings and Generals, YouTube
- id: wusun
  description: An ancient semi-nomadic Indo-European pastoral confederation that inhabited the Ili Valley and Issyk-Kul basin of Central Asia (modern Kazakhstan and Kyrgyzstan). Major players on the northern Silk Road, the Wusun formed strategic diplomatic and marital alliances with Han China to counter their mutual rivals, the Xiongnu steppe empire.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=NaqY7GKobJk
      title: "Indo-Europeans of Gansu: Yuezhi, Wusun & the Forgotten Cultures of the Hexi Corridor"
      credit: Lapis Lazuli, YouTube
- id: great-yuan
  description: An urbanized Hellenistic civilization in the fertile Fergana Valley of Central Asia (modern Uzbekistan, Kyrgyzstan, and Tajikistan), recorded in Chinese chronicles as Dayuan ('Great Ionians'). Famed for walled cities and prized, blood-sweating 'Heavenly Horses', Dayuan fought the War of the Heavenly Horses (104–101 BCE) against Han China, initiating direct Chinese commercial ties to the West.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=g6Rphg_lwwM
      title: "The Greco-Chinese War Over the Heavenly Horses"
      credit: Kings and Generals, YouTube
- id: thracian-kingdom
  description: The various historical dynastic realms and tribal unions established by the Thracian peoples across the eastern Balkan Peninsula, southern Romania, and the Aegean coast. Celebrated as skilled horsemen, metalworkers, and peltast infantry, the Thracians maintained vibrant oral and spiritual traditions while contested by Macedonian, Celtic, and Roman imperial armies.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=5AJW31Q-jg4
      title: "History of the Thracians - Ancient Civilizations DOCUMENTARY"
      credit: Kings and Generals, YouTube
- id: kingdom-of-axum
  description: A powerful maritime and trading empire centered in northern Ethiopia and Eritrea, flourishing along the Red Sea and Gulf of Aden. Positioned along spice and silk routes connecting Rome to India, Axum developed the Ge'ez script, erected colossal monolithic granite stelae, minted its own gold coinage, and adopted Christianity under King Ezana.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=LdSFpSarZkA
      title: "Kingdom of Aksum: Africa’s Forgotten Superpower | Full Documentary"
      credit: STORIES NETWORK, YouTube
- id: teotihuacan
  description: A colossal pre-Columbian metropolis in the Valley of Mexico that was one of the largest cities in the ancient world, peaking around 400 CE. Known for its grid layout, apartment compounds, and monumental Pyramids of the Sun and Moon along the Avenue of the Dead, Teotihuacan projected profound cultural influence across Mesoamerica.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=aV6ZZZsCjK8
      title: "Teotihuacan: Where One Becomes a God"
      credit: Ancient Americas, YouTube
# Batch 4A: Egypt Dynasties and Kingdoms
- id: lower-egypt
  description: The northern delta region of ancient Egypt where the Nile fans out into the Mediterranean Sea, characterized by lush papyrus marshes, maritime trade, and fertile agriculture. Historically symbolized by the red crown (Deshret) and the cobra goddess Wadjet, Lower Egypt united with Upper Egypt to form the dual pharaonic monarchy.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=mXa7633esMw
      title: "The Surprising Story of Egypt's Two Kingdoms!"
      credit: Legacy African History, YouTube
- id: upper-egypt
  description: The southern riverine expanse of ancient Egypt stretching along the narrow Nile Valley from the First Cataract at Aswan to Memphis. Represented by the white crown (Hedjet) and the vulture goddess Nekhbet, Upper Egypt was the heartland of early state formation, renowned for spiritual centers at Abydos, Thebes, and Hierakonpolis.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=L38wNoFWbAk
      title: "Egypt's Secret Unification: The Story They Don't Teach"
      credit: Legacy African History, YouTube
- id: fifteenth-dynasty-of-egypt
  description: The ruling house of the Hyksos during the Second Intermediate Period, established by Levantine leaders who governed northern Egypt from their fortified delta capital of Avaris. Introducing bronze weaponry, composite bows, and horse-drawn chariots into the Nile Valley, the dynasty maintained commercial networks until driven out by native Theban pharaohs.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=4M4YiyhzMgs
      title: "Hyksos: The Mysterious ,,Foreign Kings'' of Egypt"
      credit: Genetic Journeys, YouTube
- id: sixteenth-dynasty-of-egypt
  description: A regional Theban dynasty of Upper Egypt that governed the Nile Valley between Thebes and Elephantine during the turbulent Second Intermediate Period. Besieged by devastating local famines, northern pressure from the Hyksos, and southern attacks from Kush, this resilient kingdom maintained native pharaonic traditions until succeeded by the Seventeenth Dynasty.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=vPU_KAI-LI4
      title: "The Second Intermediate Period: A Complete Overview (1700–1550 BC)"
      credit: Made In History, YouTube
- id: seventeenth-dynasty-of-egypt
  description: The native Theban dynasty of Upper Egypt during the late Second Intermediate Period that mounted a national war of liberation against the northern Hyksos occupiers. Under martial rulers like Seqenenre Tao, Kamose, and Ahmose I, Theban armies pushed northward, capturing Avaris and ushering in the glorious New Kingdom.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xbxyxqU7gPo
      title: "Seqenenre Tao (1558-1554 BC)"
      credit: DW World History, YouTube
- id: twenty-second-dynasty-of-egypt
  description: An influential Third Intermediate Period dynasty of Meshwesh Libyan origin, founded around 945 BCE by Pharaoh Shoshenq I (biblical Shishak) from his capital at Tanis. Known for revitalizing royal authority, mounting campaigns into the southern Levant, and installing royal princes as high priests of Amun in Thebes, the dynasty eventually fractured into rival delta principalities.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=z2qqKTeWcfY
      title: "History of Ancient Egypt: Dynasties XXII & XXIII - Shoshenq I, the Canaanite Campaign and Civil War"
      credit: History with Cy, YouTube
- id: twenty-third-dynasty-of-egypt
  description: A contemporary branch of Libyan pharaohs that governed Upper and Middle Egypt from Leontopolis and Herakleopolis during the fragmented Third Intermediate Period. Coexisting and competing with the Twenty-Second Dynasty in Tanis, this regional line maintained local administrative and religious control until eclipsed by the Nubian conquest of Piye.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Vyo7RmOgk2k
      title: "The Third Intermediate Period: A Complete Overview (1077 BC – 744 BC)"
      credit: Made In History, YouTube
- id: twenty-sixth-dynasty-of-egypt
  description: Known as the Saite Renaissance, the Twenty-Sixth Dynasty was the final native dynasty to govern an independent Egypt before the Achaemenid Persian conquest. Ruling from Sais in the western delta, the Saite pharaohs expelled Assyrian garrisons, reopened Mediterranean trade, hired Greek mercenaries, and revived Old and Middle Kingdom artistic and literary styles.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=uki9rNwoRzk
      title: "History of Ancient Egypt: Dynasty XXVI - Egypt's Last Great Pharaohs and the Saite Period"
      credit: History with Cy, YouTube
- id: thirtieth-dynasty-of-egypt
  description: The last dynasty of native Egyptian pharaohs, ruling from Sebennytos in the Nile Delta from 380 to 343 BCE. Founded by Nectanebo I, the dynasty vigorously defended Egyptian independence against repeated Persian invasions and initiated extensive temple construction projects across Egypt before Nectanebo II was ousted by Artaxerxes III.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=eojRsK7dFhM
      title: "The Last Native Pharaoh – Nectanebo II"
      credit: DW World History, YouTube
- id: ankhwennefer
  description: A native Egyptian rebel pharaoh who, along with his predecessor Horwennefer, led a major nationalist uprising that liberated Upper Egypt from Ptolemaic rule between 205 and 186 BCE. Governing Thebes and surrounding nomes with the support of the Amun priesthood, his rebellion was ultimately crushed by Ptolemy V Epiphanes.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=D2m9Tk8pgpo
      title: "087: Ptolemaic Egypt - The Great Revolt"
      credit: The Hellenistic Age History Podcast, YouTube
# Batch 4B: South Asia Kingdoms and Empires
- id: janapada-of-anga
  description: An ancient Iron Age realm in the eastern Ganges basin of modern Bihar and Bengal, centered at the prosperous river port capital of Champa. Famed for lucrative maritime and riverine trade, wealth, and fine craftsmanship, Anga was an early rival of neighboring Magadha before being conquered and annexed by King Bimbisara.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=CZB2J9eiK0k
      title: "Anga Mahajanapada: Champa (capital)"
      credit: Ayushi jain, YouTube
- id: janapada-of-asmaka
  description: The southernmost of the traditional sixteen Mahajanapadas, situated along the Godavari River in modern Maharashtra and Telangana. Serving as an early cultural and commercial bridge between northern Aryan realms and the peninsular Deccan, Asmaka maintained its capital at Potali before eventual incorporation into the expanding Magadhan Empire.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Rj1wNecgY3g
      title: "The Kingdom of Ashmaka - One of the 16th Mahajanapadas"
      credit: Reelimaginarium, YouTube
- id: janapada-of-avanti
  description: A powerful western Mahajanapada centered in the fertile Malwa plateau of modern Madhya Pradesh, with major capitals at Ujjayini (Ujjain) and Mahishmati. A major hub of inland trade routes connecting north India to western sea ports, Avanti was a great center of early Buddhism and metallurgy before succumbing to Magadha.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=kNn54y5e7WY
      title: "Avanti Mahajanapada: Ancient India’s Center of Trade, Culture, and Spirituality"
      credit: Gems of Indian History, YouTube
- id: janapada-of-cedi
  description: An ancient Indian kingdom located in the Bundelkhand region of modern Madhya Pradesh and Uttar Pradesh, along the Yamuna River. Prominently featured in the Mahabharata under King Shishupala, Cedi was an influential Iron Age realm with its capital at Suktimati before its assimilation into the imperial Gangetic sphere.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=rCAscK1pdW8
      title: "The Mystery of Chedi: The Untold Story of Shuktimati"
      credit: AIEkAdhyayan, YouTube
- id: janapada-of-gandhara
  description: An ancient kingdom situated in the fertile Peshawar valley and Potohar plateau of northwestern Pakistan and eastern Afghanistan, centered at Taxila and Pushkalavati. Positioned at the western gateway of the Indian subcontinent, Gandhara was famed for Vedic scholarship, cosmopolitan Silk Road trade, and later the magnificent synthesis of Greco-Buddhist art.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=d44rhmRC3zk
      title: "Gandhara Mahajanapada- one of 16 Mahajanapadas"
      credit: Rk, YouTube
- id: janapada-of-kamboja
  description: An ancient equestrian kingdom situated in the rugged Hindu Kush and Pamir mountain valleys of northern Pakistan, eastern Afghanistan, and Tajikistan. Celebrated in Vedic and epic Sanskrit literature for exceptional horse breeding, cavalry warriors, and republican councils, Kamboja engaged extensively in trans-Himalayan commerce before Persian and Maurya integration.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=HcyX15OcppM
      title: "The Kingdom of Kamboja - One of the 16th Mahajanapadas"
      credit: Reelimaginarium, YouTube
- id: janapada-of-kasi
  description: An ancient kingdom in the central Ganges valley centered on the sacred pilgrimage city of Varanasi (Benares). Known for fine cotton textiles, ivory carving, and spiritual scholarship, Kasi was one of the wealthiest early Janapadas, frequently warring with neighboring Kosala before being absorbed by its northern rival.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=oABt9OP-3-E
      title: "Exploring Kashi Mahajanpad: The Cradle of Ancient Indian Civilization"
      credit: Gems of Indian History, YouTube
- id: janapada-of-kosala
  description: A dominant northern Mahajanapada encompassing modern Awadh in Uttar Pradesh, with historic capitals at Shravasti and Ayodhya. Under King Prasenajit, Kosala was an economic powerhouse closely associated with the lives of Gautama Buddha and Mahavira, engaging in bitter geopolitical competition with Magadha for hegemony over the Gangetic Plain.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bXnC3_WJ7Wo
      title: "Exploring Koshal Mahajanapada - A Jewel of Ancient India"
      credit: Gems of Indian History, YouTube
- id: janapada-of-kuru
  description: The pioneering Middle Vedic tribal kingdom situated in the Kurukshetra and upper Doab regions between the Saraswati and Ganges rivers. Famous as the legendary setting of the Mahabharata, the Kuru state under King Parikshit and Janamejaya codified Vedic rituals, collected the Vedic hymns, and established early North Indian social stratification.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=FU_0o4E4sPQ
      title: "8/12 Kuru: The Legacy Of Kings | The Mahajanapadas | Ancient Indian History"
      credit: History Chronicles, YouTube
- id: janapada-of-magadha
  description: The preeminent eastern Mahajanapada based in the fertile plains of modern southern Bihar, centered at the natural fortress capital of Rajagriha. Endowed with rich iron deposits, fertile rice agriculture, and strategic river trade, Magadha pioneered elephant warfare and statecraft, becoming the imperial nucleus of ancient Indian empire building.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=QjZIgavpDcI
      title: "Rise of Magadha | How Magadha Became The Strongest Empire In Ancient India"
      credit: India Unravelled, YouTube
- id: janapada-of-malla
  description: An ancient republican confederacy (gana-sangha) in the eastern Terai foothills of modern Uttar Pradesh and southern Nepal, centered on twin capitals at Kusinara and Pava. Governed by democratic assembly councils of kshatriya peers, the Mallas are revered in Buddhist tradition as the hosts of the Buddha's final parinirvana.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=j80KFCTMsh0
      title: "Mall Mahajanapada – A Glimpse into Ancient India"
      credit: Gems of Indian History, YouTube
- id: janapada-of-matsya
  description: An ancient kingdom situated south of the Kuru realm in modern eastern Rajasthan, centered on the capital of Viratnagar (Bairat). Mentioned extensively in the Vedic literature and Mahabharata as an agricultural and pastoral realm, Matsya maintained independent republican and monarchical traditions before absorption into the Maurya Empire.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=65-ilDatFXg
      title: "In Search of Matsya Mahajanapada | Bairat (Vijay Nagar Stupa) History On LHI Circle"
      credit: Peepul Tree World, YouTube
- id: janapada-of-pancala
  description: A major Vedic tribal kingdom in the fertile upper-central Ganges plain of modern Uttar Pradesh, divided by the Ganges into northern (Ahichchhatra) and southern (Kampilya) realms. Famed for philosophical debate, Brahmanical learning, and urban craftsmanship, Pancala allied closely with the neighboring Kuru kingdom during the Late Vedic period.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Afn4xY6si_I
      title: "पंचाल महाजनपद का गौरवशाली इतिहास|Panchal Mahajanpad History"
      credit: Gems of Indian History, YouTube
- id: janapada-of-surasena
  description: An ancient kingdom situated in the Braj region along the Yamuna River in western Uttar Pradesh, centered at the historic city of Mathura. Revered in Hindu tradition as the birthplace and homeland of Krishna and the Yadava clans, Surasena was an important pilgrimage, commercial, and artistic crossroad in northern India.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xQe-Mc_SqFQ
      title: "Surasena Mahajanpada"
      credit: LearnersHub, YouTube
- id: janapada-of-vajji
  description: A celebrated democratic confederacy of eight allied clans—most prominently the Licchavis—based in northern Bihar with its magnificent capital at Vaishali. Governed through participatory assembly debates and elected leaders rather than hereditary monarchs, the Vajji Sangha was a prosperous bastion of early Jainism and Buddhism before conquest by Ajatashatru of Magadha.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=hvQ2oK5wj5w
      title: "Vajji Mahajanapada Explained | Ancient India's Democracy?"
      credit: Damanpreet Kaur, YouTube
- id: janapada-of-vatsa
  description: An ancient Mahajanapada situated at the strategic confluence of the Ganges and Yamuna rivers in modern southern Uttar Pradesh, centered at the fortified metropolis of Kaushambi. Under King Udayana, a romantic hero of classical Sanskrit drama, Vatsa was a vibrant center of international commerce, urban arts, and Buddhist monasticism.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=L2sLq942gFU
      title: "Vats Mahajanapad"
      credit: Gems of Indian History, YouTube
- id: mahajanapadas
  description: The sixteen 'Great Realms'—spanning monarchies and aristocratic republics—that flourished across the Indo-Gangetic Plain and Deccan from the 6th to 4th centuries BCE. This transformative era witnessed the 'Second Urbanisation' of South Asia, the rise of coinage and guild commerce, and the emergence of Jain, Buddhist, and Ajivika philosophy.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=k2F9lHYqWrI
      title: "Mahajanapadas | Complete Ancient History Through Animation"
      credit: StudyIQ IAS, YouTube
- id: magadha-haryanka-dynasty
  description: The foundational imperial dynasty of Magadha, established by King Bimbisara and expanded by his son Ajatashatru in the 6th and 5th centuries BCE. The Haryanka monarchs annexed Anga, conquered the Vajji confederacy through innovative siege engines, constructed Pataliputra, and actively patronized both the Buddha and Mahavira.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=sZ-rLiYyDTo
      title: "Haryanka Dynasty | Rajvansh: Dynasties Of India | Full Episode"
      credit: Crazy Color Facts, YouTube
- id: magadha-shaishunaga-dynasty
  description: The second imperial dynasty of Magadha, founded around 413 BCE by Shishunaga, a former royal minister who overthrew the unpopular Haryankas. Shishunaga achieved the historic triumph of crushing the rival kingdom of Avanti, while his son Kalashoka convened the Second Buddhist Council at Vaishali before the dynasty was usurped by Mahapadma Nanda.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=b5VITYoVr_U
      title: "Shishunaga Dynasty | Rajvansh: Dynasties of India | Full Episode"
      credit: Crazy Color Facts, YouTube
- id: nanda-empire
  description: The powerful pan-Gangetic empire established in the 4th century BCE by Mahapadma Nanda, who overthrew the Shaishunagas and conquered numerous northern Indian kingdoms. Governed from Pataliputra, the Nandas accumulated immense treasury wealth and commanded a vast standing army of 200,000 infantry and 3,000 war elephants that discouraged Alexander the Great from advancing into India.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=07IUrCT3OwQ
      title: "The Empire So Wealthy and So Hated That Alexander's Own Army Refused to Fight It"
      credit: Ancestors Civilization, YouTube
- id: kalinga
  description: An ancient coastal realm stretching between the Mahanadi and Godavari rivers in modern Odisha and northern Andhra Pradesh. Renowned for maritime trade with Southeast Asia, naval prowess, and fierce independence, Kalinga was conquered by Ashoka the Great in a devastating war around 261 BCE that prompted Ashoka's famous conversion to Buddhist non-violence.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=txQVjNWZx9I
      title: "Why The Kalinga War Is The Greatest War In History | Ashoka The Great & Kalinga War"
      credit: Battles In History, YouTube
- id: maurya-empire
  description: The first pan-Indian empire, founded by Chandragupta Maurya and his strategist Chanakya in 322 BCE after overthrowing the Nanda Empire. Reaching its zenith under Ashoka the Great, the Maurya state unified almost the entire subcontinent under centralized bureaucratic rule, disseminating ethical rock edicts, patronizing Buddhism, and standardizing trade.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Ed6UZtVTI64
      title: "Ashoka the Great - Rise of the Mauryan Empire Documentary"
      credit: Kings and Generals, YouTube
- id: anuradhapura
  description: The first major kingdom of ancient Sri Lanka, established around the historic capital city of Anuradhapura in 377 BCE by King Pandukabhaya. Flourishing for over a millennium, the kingdom engineered monumental hydraulic irrigation reservoirs (tanks) and celebrated Buddhist stupas, officially embracing Theravada Buddhism under King Devanampiya Tissa.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=vLDTBFcqKdA
      title: "The Engineering Marvels Of Sri Lanka's Ancient Kingdom Anuradhapura | The Mark Of Empire"
      credit: CNA Insider, YouTube
- id: early-cheras
  description: An ancient Tamil seafaring dynasty of the Sangam period that ruled the Malabar Coast and western Tamil Nadu (modern Kerala and Kongu Nadu). Operating from port capitals like Muziris, the Cheras conducted lucrative direct spice, beryl, and pepper trade with the Roman Empire and neighboring Mediterranean merchants.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=n_ByNtfuLbw
      title: "The Chera Dynasty: Trade, Literature, and the Spice Route"
      credit: Crazy Color Facts, YouTube
- id: early-cholas
  description: An ancient Tamil dynasty of the Sangam period that governed the fertile Kaveri River delta in eastern Tamil Nadu from capitals at Uraiyur and Puhar (Kaveripoompattinam). Celebrated in early Tamil poetry under legendary King Karikala, the early Cholas engineered early flood embankments, established overseas trade with Southeast Asia, and patronized classical Sangam literature.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=MqzM43o5Jes
      title: "The Cholas Naval Power and Temple Building"
      credit: Crazy Color Facts, YouTube
- id: early-pandyas
  description: An ancient Sangam-era Tamil dynasty centered at the cultural capital of Madurai and the pearl-fishing port of Korkai in southern Tamil Nadu. Renowned as the historic patrons of the literary Tamil Sangam assemblies, the Pandyas exported exquisite natural pearls and gemstones across the ancient Mediterranean and Indian Ocean worlds.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=On8ylx_veFk
      title: "Pandyan Empire – History, Expansion"
      credit: Crazy Color Facts, YouTube
- id: satavahana-dynasty
  description: A major Deccan empire that arose in the 2nd century BCE following the decline of the Mauryas, spanning modern Maharashtra, Andhra Pradesh, and Telangana. Governed from capitals at Pratishthana and Amaravati, the Satavahanas defended central India against Saka incursions, issued multilingual bilingual coinage, and sponsored rock-cut Buddhist chaityas at Karla and Ajanta.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=lgfPT9YtunM
      title: "Satavahana Dynasty | Rajvansh: Dynasties Of India | Full Episode"
      credit: EPIC TV, YouTube
- id: mahameghavahana-dynasty
  description: A resurgent royal dynasty of ancient Kalinga that restored the region's independence and imperial prestige following the collapse of the Maurya Empire. Its greatest ruler, King Kharavela (2nd century BCE), left the celebrated Hathigumpha rock inscription at Udayagiri, detailing victorious campaigns across North India and generous patronage of Jainism.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=5WWrhbaQyLY
      title: "Samrat Kharavela of Kalinga | The Great Jain King of Ancient India"
      credit: The Occasional Professor, YouTube
- id: shunga-empire
  description: The Magadhan imperial dynasty established in 185 BCE by Pushyamitra Shunga after the assassination of the last Maurya emperor, Brihadratha. Ruling from Pataliputra and Vidisha, the Shungas repelled Indo-Greek invasions, patronized traditional Vedic horse sacrifices (Ashvamedha), and sponsored magnificent Buddhist architectural expansions at Bharhut and the Great Stupa of Sanchi.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=2pc5wPFdFQg
      title: "Shunga And Kanva Dynasty | Rajvansh: Dynasties Of India | Full Episode"
      credit: EPIC TV, YouTube
- id: kanva-dynasty
  description: A short-lived Brahmin dynasty of Magadha founded in 73 BCE by Vasudeva after overthrowing the last Shunga monarch, Devabhuti. Governing a contracted territory centered on Pataliputra, the four Kanva kings maintained traditional imperial administration for roughly four decades before Magadha fell under the sway of the southern Satavahanas.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=MoMuuziH7_0
      title: "Ancient Indian History | Shunga Dynasty & Kanva Dynasty"
      credit: Let's Crack UPSC CSE, YouTube
- id: indo-greeks
  description: The Hellenistic kingdom established in the 2nd century BCE when Greco-Bactrian rulers like Demetrius and Menander I expanded into northwestern South Asia (modern Afghanistan, Pakistan, and northwestern India). Famous for artistic bilingual coinage in Greek and Kharosthi, the kingdom fostered the rich synthesis of Greco-Buddhist religion, philosophy, and Gandharan sculpture.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ZxJk4KHZxi8
      title: "Ancient Greek Kingdom in India"
      credit: Kings and Generals, YouTube
- id: indo-scythians
  description: A confederation of Saka (Scythian) nomadic tribes who migrated from Central Asia into northwestern South Asia (Gandhara, Punjab, Gujarat, and Mathura) during the 1st century BCE. Adopting Buddhism and Indian royal titles while retaining Iranian cavalry traditions, the Sakas established powerful satrapies that influenced North Indian coin design, art, and urban governance.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=LeDeYvP3nwE
      title: "Clash of Civilizations: Satavahana Empire vs. Indo-Scythians"
      credit: The Indian History Nerd, YouTube
- id: indo-parthians
  description: An ancient kingdom established around 19 CE when the Parthian general Gondophares broke away from the Arsacids to forge an independent realm spanning modern Afghanistan, Pakistan, and northwestern India. Governed from Taxila, the dynasty blended Parthian, Scythian, and Hellenistic cultural traditions, featuring prominently in early Christian apocrypha concerning Saint Thomas.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bJRFT2s49Ao
      title: "The short-lived Iranian dynasty of Ancient India"
      credit: Jay Vardhan Singh, YouTube
# Batch 5A: East Asia Dynasties, Korea, Steppe & Warring States
- id: shang-dynasty
  description: The earliest historically confirmed Chinese dynasty, ruling the fertile Yellow River valley from capitals like Anyang (Yinxu) between c. 1600 and 1046 BCE. Renowned for masterful piece-mold ritual bronze casting, horse-drawn chariot warfare, and the earliest surviving Chinese writing inscribed on divination oracle bones.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=VRQKp_vjVSY
      title: "[Documentary] China's Bronze Age - Shang Dynasty (1760 - 1520 BC)"
      credit: Bronze Goblet, YouTube
- id: zhou-dynasty
  description: The longest-lasting dynasty in Chinese history (1046–256 BCE), which overthrew the Shang and established the political doctrine of the 'Mandate of Heaven'. Initially ruling through a decentralized feudal network of kinship fiefs (fengjian), the Western Zhou fostered classical Chinese cultural, ritual, and philosophical foundations.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=sqppiHdirc0
      title: "[Documentary] Origin of Li and Yue - Zhou Dynasty (1046 -256 BC)"
      credit: Bronze Goblet, YouTube
- id: later-zhou
  description: The Eastern Zhou dynasty (770–256 BCE), established when King Ping moved the royal capital east to Luoyang following nomadic Rong raids that destroyed the western capital. Though royal power declined to nominal ceremonial status, this era witnessed immense intellectual flowering during the Hundred Schools of Thought, including Confucianism and Daoism.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GZ_lSXv4Psg
      title: "The Western Zhou Dynasty and the Spring and Autumn Period - Explained"
      credit: GatesOfKilikien, YouTube
- id: qin-dynasty
  description: The short-lived but epochal dynasty (221–206 BCE) that first unified China under Qin Shi Huang, the First Emperor. Standardizing writing characters, weights, measurements, currency, and axle widths, the regime connected the Great Wall and constructed the Terracotta Army through rigorous Legalist laws, collapsing rapidly in widespread rebellions following the emperor's death.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=h-SC0vKIWV0
      title: "The Birth Of A Dynasty: China's First Emperor"
      credit: Odyssey - Ancient History Documentaries, YouTube
- id: han-dynasty
  description: The golden age imperial dynasty of China (202 BCE – 220 CE), founded by Liu Bang after the Chu-Han Contention. Establishing Confucianism as the state orthodoxy, the Han created a meritocratic civil service, opened the trans-Eurasian Silk Road, invented papermaking, and expanded imperial borders into Central Asia, Korea, and Vietnam.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=5Vm4Fg26e20
      title: "The Han Dynasty Explained"
      credit: Captivating History, YouTube
- id: gojoseon
  description: The first kingdom of ancient Korea, traditionally established in the Liaoning and northwestern Korean Peninsula around the Taedong River basin. Developing a distinctive Bronze and Iron Age culture characterized by mandolin-shaped daggers and dolmen tombs, Gojoseon challenged Yan and Han China before falling to Emperor Wu of Han in 108 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=qmATYjagXMg
      title: "The History of Korea (Ancient Kingdoms to Modern Korea)"
      credit: Relaxing Asian History, YouTube
- id: korean-jin
  description: An ancient proto-Korean confederacy that occupied the southern half of the Korean Peninsula during the 2nd and 3rd centuries BCE. Acting as an agricultural and iron-producing trade nexus between northern Korea and the Japanese archipelago, Jin was the foundational predecessor to the subsequent Samhan confederacies (Mahan, Jinhan, and Byeonhan).
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=vB0dz7XkHXA
      title: "Jin-guk (辰國) was an ancient state that existed before the period of the Three Han"
      credit: koreahistoryteller_KHT, YouTube
- id: byeonhan
  description: One of the three Samhan confederacies of southern Korea, situated along the Nakdong River valley in the southeastern peninsula. Renowned across East Asia for exceptionally rich iron mines, Byeonhan exported high-quality raw iron ingots and weaponry to northern commanderies and Yayoi Japan, evolving into the Gaya confederacy.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xBPLoQC-bto
      title: "Samhan (The Three Hans): 진한 Jinhan; 마한 Mahan; 변한 Byeonhan"
      credit: Korean History 한국사, YouTube
- id: jinhan
  description: One of the Samhan confederacies of southeastern Korea, occupying the valley basins east of the Nakdong River. Composed of twelve walled town-statelets skilled in sericulture and ironworking, Jinhan integrated immigrants from northern commanderies and Gojoseon, eventually developing into the ancient kingdom of Silla.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GnDdkFjF-m8
      title: "Korean Three Kingdoms Period explained (History of Korea)"
      credit: Epimetheus, YouTube
- id: mahan
  description: The largest and most powerful of the three Samhan confederacies, comprising over fifty walled town-statelets across southwestern Korea (modern Gyeonggi, Chungcheong, and Jeolla). An advanced rice-farming society organized around sacred ritual precincts (sodo), Mahan was gradually united by one of its constituent member tribes to form the kingdom of Baekje.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xBPLoQC-bto
      title: "Samhan (The Three Hans): 진한 Jinhan; 마한 Mahan; 변한 Byeonhan"
      credit: Korean History 한국사, YouTube
- id: dongye
  description: An ancient tribal state of the Ye people located along the central eastern coast of the Korean Peninsula in modern Gangwon province. Governed by village headmen without a central monarch, Dongye was celebrated for marine agriculture, hunting, fine horse breeding, and distinctive terraced longhouses before being absorbed by Goguryeo.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=wP0SMYirSoc
      title: "Okjeo & Dongye (Ancient Korean States)"
      credit: Korean History 한국사, YouTube
- id: dong-okjeo
  description: An ancient tribal state of the Okjeo people located along the narrow coastal strip and mountain valleys of northeastern North Korea and southeastern Manchuria. Dependent on agriculture, fishing, and cloth production, Dong-okjeo lacked a unified king and was repeatedly subjected to tributary subjugation by neighboring Gojoseon, Han commanderies, and expanding Goguryeo.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=wP0SMYirSoc
      title: "Okjeo & Dongye (Ancient Korean States)"
      credit: Korean History 한국사, YouTube
- id: goguryeo
  description: A powerful ancient kingdom of northern Korea and southern Manchuria, traditionally founded in 37 BCE in the rugged mountain valleys of the Yalu River basin. Renowned for fierce martial culture, heavily armored cataphract cavalry, and impregnable mountain fortresses, Goguryeo expanded into a dominant regional empire, becoming one of the Three Kingdoms of Korea.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GpkAsdH78l4
      title: "Goguryeo: The Three Kingdoms Period"
      credit: From History, YouTube
- id: xiongnu
  description: A formidable pastoral nomadic confederation that unified the Mongolian steppe under Modu Chanyu in the late 3rd century BCE. Fielding hundreds of thousands of horse archers, the Xiongnu built the first great nomadic empire in Inner Asia, extracting trade and tribute from Han China and prompting the construction of the Great Wall.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bFpQjWtpHcM
      title: "Huns: The Origin"
      credit: Kings and Generals, YouTube
- id: yuezhi
  description: An ancient Indo-European pastoral nomadic confederation that originally dominated the grasslands and oasis corridors of the Hexi Corridor in modern Gansu. Driven westward across Central Asia after defeats by the Xiongnu, the Yuezhi conquered Greco-Bactria and eventually settled in northern India to establish the magnificent Kushan Empire.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=2KdM6AlyLUY
      title: "Yuezhi Migration and Kushan Empire - Nomads DOCUMENTARY"
      credit: Kings and Generals, YouTube
- id: minyue
  description: An ancient Baiyue kingdom located in the mountainous coastal river valleys of modern Fujian province in southeastern China. Flourishing from the 4th to late 2nd century BCE, Minyue maintained fortified towns, specialized metallurgy, and maritime trade before being annexed by Emperor Wu of Han.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=kATDlKZNzTY
      title: "Minyue Ancient Fujian"
      credit: Knowledge=fun, YouTube
- id: nanyue
  description: An independent kingdom established in 204 BCE by the Qin general Zhao Tuo, spanning southern China and northern Vietnam (Guangdong, Guangxi, and northern Vietnam) with its capital at Panyu (modern Guangzhou). Blending Han Chinese administrative methods with indigenous Baiyue culture, Nanyue prospered through maritime trade until annexed by Emperor Wu of Han in 111 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=a8FT2cBLaYs
      title: "Who Built Guangzhou: The General Who Founded a Kingdom (Zhao Tuo & Nanyue)"
      credit: WeDiscoverChina, YouTube
- id: western-chu
  description: The dominant hegemony established in 206 BCE by the warlord Xiang Yu after the fall of the Qin dynasty, centered at Pengcheng (modern Xuzhou). Declaring himself the Hegemon-King of Western Chu, Xiang Yu partitioned China into the Eighteen Kingdoms, waging a monumental four-year war against Liu Bang before his defeat at the Battle of Gaixia.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=G1GRkTqIMgM
      title: "Chu–Han Contention: The War That Created the Han Dynasty | Part 1"
      credit: Armies of History, YouTube
- id: chu
  description: A major southern powerhouse along the Yangtze and Han river valleys during the Zhou dynasty, with its capital at Ying in modern Hubei. Developing a rich, distinct culture characterized by elaborate bronze metallurgy, lacquerware, and Daoist poetic traditions, Chu expanded aggressively to become one of the most formidable Seven Warring States.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=x-3OYFbFOZY
      title: "Chu State: A Feudal State in the Yangtze River Basin During the Pre-Qin Period"
      credit: knowl card, YouTube
- id: qi
  description: A wealthy and powerful maritime state in modern Shandong, founded in the 11th century BCE for the grand strategist Jiang Ziya. Blessed with rich coastal sea salt and silk industries, Qi established early hegemony under Duke Huan and prime minister Guan Zhong, later founding the renowned Jixia Academy of scholarly debate.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=fn3wTsVbllg
      title: "Qi State: An Important Vassal State in Pre-Qin Period"
      credit: knowl card, YouTube
- id: jin
  description: The dominant northern super-state of the Spring and Autumn period, occupying modern Shanxi and northern Henan. Under Duke Wen of Jin, the state served as hegemon (ba) defending the central Zhou states against southern Chu expansion, until internal clan rivalries famously partitioned Jin into Han, Zhao, and Wei in 403 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=aKtXjLbqWBM
      title: "The Six Ministers of Jin State: Military and Political System of Jin in the Spring and Autumn Period"
      credit: knowl card, YouTube
- id: yan
  description: A major northeastern frontier kingdom centered at modern Beijing, established at the start of the Western Zhou dynasty by the Duke of Shao. Guarding the northern borders against Steppe nomads and trading with Manchuria and Korea, Yan constructed extensive early walls and endured as one of the Seven Warring States until Qin conquest.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=uQt3k9QfLBs
      title: "King Zhao of Yan, Monarch of Yan State during the Warring States Period"
      credit: knowl card, YouTube
- id: zhao
  description: A powerful northern kingdom among the Seven Warring States, formed from the partition of Jin in modern Shanxi and Hebei. Under King Wuling, Zhao revolutionized Chinese warfare by adopting nomadic cavalry tactics and clothing ('Hu clothing and mounted archery'), defending northern frontiers against Steppe nomads until crushed by Qin at the catastrophic Battle of Changping.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=i-D5NtE6c4M
      title: "Zhao Bao: A Historical and Political Figure of Zhao State"
      credit: knowl card, YouTube
- id: wei
  description: One of the Seven Warring States created from the partition of Jin, occupying the fertile central Yellow River plains of modern Shanxi and Henan. Under Marquis Wen and the Legalist reforms of Li Kui, Wei became the premier military and economic superpower of the early Warring States before facing defeats against Qin and Qi.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Gp0b316IdD4
      title: "Wei State One of the Seven Powers of the Warring States Period"
      credit: knowl card, YouTube
- id: han
  description: One of the Seven Warring States, established in 403 BCE when three noble families partitioned the great state of Jin in modern Henan and Shanxi. Positioned strategically in the central plains, Han was an advanced center of iron weaponry and crossbow manufacture, but its small size left it vulnerable to conquest by neighboring Qin in 230 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=iq7pUMqxSAY
      title: "The Rise and Fall of the House of Han 韩国 (403 BC - 230 BC)"
      credit: Bedtime history of ancient China, YouTube
- id: lu
  description: An influential Zhou vassal state in modern Shandong, founded by Boqin, the son of the revered Duke of Zhou. Celebrated as the cultural heartland of classical ritual, historical chronicle keeping, and moral philosophy, Lu was the birthplace of Confucius, preserving ancient Zhou rites long after other states had abandoned them.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Ly5Emk2bG3M
      title: "Lu State Important Vassal State Relics of the Zhou Dynasty"
      credit: knowl card, YouTube
# Batch 5B: Spring & Autumn States and Chu-Han Eighteen Kingdoms
- id: cai
  description: An ancient Chinese vassal state founded in the 11th century BCE by a younger brother of King Wu of Zhou in modern Henan. Positioned precariously between the central plains and the expanding southern power of Chu, Cai survived centuries of border conflicts through shifting alliances before final annexation by Chu in 447 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GZ_lSXv4Psg
      title: "The Western Zhou Dynasty and the Spring and Autumn Period - Explained"
      credit: GatesOfKilikien, YouTube
- id: cao
  description: A regional vassal state of the Western Zhou and Spring and Autumn periods, established in the 11th century BCE in modern western Shandong. Governed by descendants of King Wen of Zhou from their capital at Taoqiu, Cao prospered as an agricultural trade hub before being conquered by the neighboring State of Song in 487 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bABIasJP48k
      title: "The Spring and Autumn & Warring States Periods: A History of China: PART ONE"
      credit: Hui Podcast, YouTube
- id: chen
  description: An ancient Zhou vassal state situated in modern eastern Henan, traditionally founded by Duke Hu as descendants of the legendary sage-king Shun. Serving as a cultural buffer between northern Zhou states and the southern realm of Chu, Chen maintained distinctive shamanic religious traditions until its absorption by Chu in 478 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bABIasJP48k
      title: "The Spring and Autumn & Warring States Periods: A History of China: PART ONE"
      credit: Hui Podcast, YouTube
- id: qin
  description: A rugged frontier state in the western Wei River valley of modern Shaanxi, traditionally tasked with breeding warhorses and defending Zhou frontiers against nomadic tribes. Implementing radical Legalist reforms under Shang Yang, Qin developed a meritocratic military and centralized bureaucracy that ultimately conquered all rival states to unify China in 221 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Vmiv4zAeeAA
      title: "The Architect of Qin’s Rise | ChineseHistory"
      credit: Sino Epochs, YouTube
- id: song
  description: An ancient central plains state in modern eastern Henan, granted by the Zhou kings to the surviving royal nobility of the defeated Shang dynasty to maintain ancestral rites. Famed for its merchant commerce and ethical adherence to ancient chivalric codes, Song was satirized in philosophical fables before being partitioned by Qi, Chu, and Wei.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bABIasJP48k
      title: "The Spring and Autumn & Warring States Periods: A History of China: PART ONE"
      credit: Hui Podcast, YouTube
- id: teng
  description: A minor aristocratic vassal state situated in modern southern Shandong during the Spring and Autumn and Warring States periods. Despite its modest territory and vulnerability to powerful neighbors, Teng was celebrated by the philosopher Mencius as a model virtuous kingdom that governed through benevolence and classical rites before conquest by Song.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GZ_lSXv4Psg
      title: "The Western Zhou Dynasty and the Spring and Autumn Period - Explained"
      credit: GatesOfKilikien, YouTube
- id: wey
  description: A resilient central plains state along the Yellow River in modern northern Henan, founded by Kangshu, a younger brother of King Wu of Zhou. Renowned for poetry preserved in the Book of Songs and commercial craftsmanship, Wey survived as a small buffer state longer than any other, persisting until Qin annexation in 209 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GZ_lSXv4Psg
      title: "The Western Zhou Dynasty and the Spring and Autumn Period - Explained"
      credit: GatesOfKilikien, YouTube
- id: wu
  description: A dynamic maritime and riverine kingdom in the lower Yangtze delta of modern Jiangsu, centered around modern Suzhou. Expanding rapidly in the late Spring and Autumn period with the strategic advice of Sun Tzu, Wu dominated regional waterways with specialized navies and prized cast-bronze swords before being conquered by neighboring Yue in 473 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bvFJvfSfE60
      title: "Sun Tzu and the King’s Concubines: Discipline Above All"
      credit: A bit of all, YouTube
- id: xu
  description: An ancient non-Zhou Huaiyi confederation and state based along the Huai River valley in modern Anhui and Jiangsu. Under charismatic rulers like King Yan of Xu, the state challenged Western Zhou supremacy and spread distinctive southeastern bronze culture before being conquered by the expanding state of Wu in 512 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bABIasJP48k
      title: "The Spring and Autumn & Warring States Periods: A History of China: PART ONE"
      credit: Hui Podcast, YouTube
- id: zheng
  description: An influential central plains vassal state founded in the late Western Zhou in modern Henan, centered on the commercial capital of Xinzheng. Under the astute leadership of Duke Zhuang, Zheng was the first state to challenge royal Zhou authority, pioneering the interstate balance of power during the early Spring and Autumn period.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Z7VIycwTieU
      title: "Duke Zhuang of Zheng: China’s First Hegemon"
      credit: Josh Lin, YouTube
- id: zhu
  description: A minor regional state in modern southwestern Shandong ruled by the Cao lineage, also known historically as Zhulou or Zou. Located near the cultural heartland of Lu, the state maintained close ties to Confucian traditions and is celebrated as the ancestral birthplace of the influential philosopher Mencius before annexation by Chu.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=_5bobS0DGF0
      title: "Zhu Hai A Warrior of the Warring States Period"
      credit: knowl card, YouTube
- id: yue
  description: An ancient indigenous kingdom centered south of the Yangtze River around modern Zhejiang and northern Fujian, famed for seafaring, aquaculture, and peerless bronze sword metallurgy. Under King Goujian, Yue rebounded from near destruction to conquer its bitter northern rival Wu in 473 BCE, briefly achieving hegemony before succumbing to Chu.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=mAWkFpkROgw
      title: "King Fuchai of Wu – The Tragic Rival of King Goujian and the Fall of Wu | Spring and Autumn Period"
      credit: Ancient SEA, YouTube
- id: zhongshan
  description: A unique kingdom in the central plains of modern Hebei, founded by the semi-nomadic White Di (Baidi) pastoralists during the Warring States period. Remarkably synthesizing Steppe nomadic traditions with sophisticated Zhou ritual culture and bronze casting, Zhongshan built fortified capitals and resisted Zhao and Wei invasions for over a century before falling in 296 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Op7G8Y6Y9Pk
      title: "The King Who Dressed Like a Nomad | Zhao Conquers Zhongshan (307–296 BCE)"
      credit: MajorWarsofHistory, YouTube
- id: dai
  description: One of the Eighteen Kingdoms created during the post-Qin Chu-Han Contention in 206 BCE, situated in northern Shanxi and Hebei. Ruled by Zhao Xie, the dispossessed king of Zhao, this northern frontier realm was strategically positioned against Steppe nomads before being conquered by Han general Han Xin.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=M4cVQoXpwPQ
      title: "Why trap your own army against a river?"
      credit: Dynasties Untold, YouTube
- id: jibei
  description: One of the short-lived Eighteen Kingdoms established in 206 BCE following the fall of the Qin dynasty, covering northern Shandong around the Yellow River mouth. Ruled by Tian An, a scion of the old Qi royal house, the kingdom was quickly overrun during the chaotic wars of the Chu-Han Contention.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=AizZzRMmXl0
      title: "The Chu–Han Contention: The Civil War That Created the Han Dynasty"
      credit: Unknown Lìshǐ, YouTube
- id: zhai
  description: One of the 'Three Qins' kingdoms created by Xiang Yu in 206 BCE in northern Shaanxi to contain Liu Bang in the Han River basin. Ruled by Dong Yi, a surrendered Qin general, Zhai was swiftly conquered when Liu Bang launched his surprise breakout campaign across the Qinling Mountains.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xqa-_P0dLKs
      title: "From Peasant Rebellion to the Rise of Han | Chu-Han Contention"
      credit: Empire Maps, YouTube
- id: chang-shan
  description: One of the Eighteen Kingdoms established by Xiang Yu in 206 BCE, covering central Hebei with its capital at Xiangguo. Governed by the insurgent general Zhang Er, the kingdom was embroiled in regional conflicts across the northern plains before Zhang Er allied with Liu Bang to establish the Han dynasty.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xqa-_P0dLKs
      title: "From Peasant Rebellion to the Rise of Han | Chu-Han Contention"
      credit: Empire Maps, YouTube
- id: han-q5349053
  description: The revived principality of Han in the central plains of modern Henan, recreated as one of the Eighteen Kingdoms in 206 BCE. Ruled briefly by Han Cheng and later Zheng Chang under Xiang Yu's overlordship, the territory was conquered by Liu Bang's advancing forces during the Chu-Han Contention.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=BvCWUg_0Ngk
      title: "The ENTIRE history of Han Dynasty: The CHU - HAN Contention"
      credit: Dynast's Saga, YouTube
- id: henan
  description: One of the Eighteen Kingdoms established by Xiang Yu in 206 BCE, occupying the strategic heartland of northern Henan centered around Luoyang. Governed by Shen Yang, a former general of Zhao, the small kingdom controlled key Yellow River crossings before submitting to Liu Bang's Han army.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xqa-_P0dLKs
      title: "From Peasant Rebellion to the Rise of Han | Chu-Han Contention"
      credit: Empire Maps, YouTube
- id: jiaodong
  description: One of the Eighteen Kingdoms created in 206 BCE on the rugged Shandong Peninsula, with its capital at Jimo. Ruled by Tian Fu, the former king of Qi, Jiaodong was destabilized by internal dynastic rivalries among the Tian clan before being reunified under Qi and eventually subdued by Han.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=YgNp6CEAjeI
      title: "Liu Bang vs Xiang Yu: The Human vs the Overlord in Chu-Han Contention"
      credit: Sanna Ferranto, YouTube
- id: jiujiang
  description: A southern principality of the Eighteen Kingdoms established in 206 BCE along the Huai and Yangtze rivers in modern Anhui and Jiangxi. Ruled by the fearsome general Ying Bu, Jiujiang originally served as a vital bulwark for Xiang Yu before Ying Bu defected to Liu Bang, helping secure the Han victory.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=BvCWUg_0Ngk
      title: "The ENTIRE history of Han Dynasty: The CHU - HAN Contention"
      credit: Dynast's Saga, YouTube
- id: liaodong
  description: A northern frontier realm of the Eighteen Kingdoms created in 206 BCE, occupying the Liaodong Peninsula in southern Manchuria. Ruled by Han Guang, the displaced king of Yan, the kingdom was established to weaken northern opposition before being forcefully seized by rival general Zang Tu.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=BvCWUg_0Ngk
      title: "The ENTIRE history of Han Dynasty: The CHU - HAN Contention"
      credit: Dynast's Saga, YouTube
- id: linjiang
  description: A southern principality among the Eighteen Kingdoms founded in 206 BCE along the middle Yangtze River in modern Hubei and Hunan. Ruled by Qin rebel leader Gong Ao and his son Gong Wei from Jiangling, Linjiang remained stubbornly loyal to Xiang Yu until captured by Han forces in 202 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=AizZzRMmXl0
      title: "The Chu–Han Contention: The Civil War That Created the Han Dynasty"
      credit: Unknown Lìshǐ, YouTube
- id: sai
  description: One of the 'Three Qins' kingdoms created by Xiang Yu in 206 BCE in eastern Shaanxi, centered at Yueyang. Entrusted to the surrendered Qin general Sima Xin to guard the passes against Liu Bang, Sai was rapidly overrun when Han forces launched their northern offensive.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xqa-_P0dLKs
      title: "From Peasant Rebellion to the Rise of Han | Chu-Han Contention"
      credit: Empire Maps, YouTube
- id: yin
  description: One of the Eighteen Kingdoms established by Xiang Yu in 206 BCE, situated in northern Henan and southern Hebei with its capital at Zhaoge. Governed by Sima Ang, a former Zhao general, Yin was strategically positioned along the Yellow River before surrendering to Liu Bang's forces in 205 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=BvCWUg_0Ngk
      title: "The ENTIRE history of Han Dynasty: The CHU - HAN Contention"
      credit: Dynast's Saga, YouTube
- id: yong
  description: The primary and largest of the 'Three Qins' kingdoms established in 206 BCE in the central Wei River valley of Shaanxi, centered at Feiqiu. Ruled by Zhang Han, the celebrated former commander-in-chief of the imperial Qin armies, Yong fiercely resisted Liu Bang's invasion before falling after a prolonged siege.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=AizZzRMmXl0
      title: "The Chu–Han Contention: The Civil War That Created the Han Dynasty"
      credit: Unknown Lìshǐ, YouTube
