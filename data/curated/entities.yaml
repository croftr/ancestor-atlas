- id: cucuteni-trypillia
  name: Cucuteni–Trypillia culture
  category: culture
  start_year: -5049
  end_year: -2949
  description: Between the Carpathian Mountains and the Dnieper River, in what is now Romania, Moldova and Ukraine, the farmers of the Cucuteni-Trypillia culture built some of the largest settlements on Earth before the first cities of Mesopotamia. Their towns were laid out in wide concentric rings of hundreds or even thousands of two-storey timber and clay houses, which were periodically burned down and rebuilt, and their high-temperature kilns produced finely painted swirling pottery and early cast copper tools.
