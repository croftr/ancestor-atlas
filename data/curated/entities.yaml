  description: "Our own species is older than once thought. In 2017 fossils from Jebel Irhoud in Morocco were dated to about 315,000 years ago: their faces already looked modern, though their braincases were still long and low. Together with finds such as Omo Kibish in Ethiopia, they suggest Homo sapiens took shape across many parts of Africa rather than in one place. From Africa our species eventually spread to every continent, and became the only human left."
