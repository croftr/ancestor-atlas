      title: Kings of Israel & Judah Family Tree
      credit: UsefulCharts, YouTube
- id: kingdom-of-judah
  description: An Iron Age kingdom centered in the southern Judean hill country of the Levant, governed from Jerusalem by the Davidic dynasty. Emerging after the division of the united monarchy, Judah maintained religious and cultural identity under Assyrian and Babylonian vassalage until Jerusalem was sacked by Nebuchadnezzar II in 586 BCE.
  image_url: /images/civilisations/kingdom-of-judah.webp
  image_caption: Iron Age Jerusalem in the Kingdom of Judah, showing the Broad Wall, scribes writing on ostraca beside royal storage jars, masons cutting Hezekiah's Tunnel, and the First Temple.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/kingdom-of-judah-1.webp, credit: "Ian Scott, CC BY-SA 2.0, via Wikimedia Commons", caption: "Hezekiah's Tunnel, cut through the bedrock of Jerusalem to bring the Gihon spring inside the walls, late 8th century BCE", source: "https://commons.wikimedia.org/wiki/File:Inside_Hezekiah's_Tunnel-A_(3782613123).jpg" }
    - { url: /images/extra/kingdom-of-judah-2.webp, credit: "Ian Scott, CC BY-SA 2.0, via Wikimedia Commons", caption: "Foundations of the Broad Wall of Jerusalem, built in the late 8th century BCE as the city grew, with later structures against it", source: "https://commons.wikimedia.org/wiki/File:Urban_structures_abutting_the_broad_wall_in_Jerusalem_(7007570939).jpg" }
    - { url: /images/extra/kingdom-of-judah-3.webp, credit: "Bukvoed, CC BY 4.0, via Wikimedia Commons", caption: "Remains of the Judahite fortress at Tel Arad in the Negev, which held a small temple and the Arad ostraca", source: "https://commons.wikimedia.org/wiki/File:Tel-Arad-663.jpg" }
