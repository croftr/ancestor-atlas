    - { url: /images/extra/ptolemaic-kingdom-2.webp, credit: "Olaf Tausch, CC BY 3.0, via Wikimedia Commons", caption: "Monumental relief of Queen Cleopatra VII and her son Caesarion offering to the gods on the exterior wall of Dendera Temple", source: "https://commons.wikimedia.org/wiki/File:Dendera_Tempel_14.JPG" }
