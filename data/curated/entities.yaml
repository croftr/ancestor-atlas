    - { url: /images/extra/phoenicia-2.webp, credit: "O.Mustafin, public domain, via Wikimedia Commons", caption: "Sarcophagus of Ahiram of Byblos, with one of the earliest Phoenician alphabet inscriptions", source: "https://commons.wikimedia.org/wiki/File:Ahiram_Sarcophagus_1.JPG" }
- id: kingdom-of-israel
  description: An Iron Age kingdom in the northern central highlands and fertile Jezreel Valley of the southern Levant, with Samaria as its prominent capital. Boasting significant agricultural wealth and international trade links, the kingdom was a major regional power before its destruction and population deportation by the Neo-Assyrian Empire in 720 BCE.
  image_url: /images/civilisations/kingdom-of-israel.webp
  image_caption: Samaria and Megiddo in the Kingdom of Israel, featuring carved Samaria ivories, a royal stele, pillared chariot stables, and a rock-cut water shaft.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/kingdom-of-israel-1.webp, credit: "Oren Rozen, CC BY-SA 4.0, via Wikimedia Commons", caption: "The Tel Dan Stele, an Aramaic victory inscription naming a king of Israel and the 'House of David', 9th century BCE (Israel Museum, Jerusalem)", source: "https://commons.wikimedia.org/wiki/File:JRSLM_300116_Tel_Dan_Stele_01.jpg" }
    - { url: /images/extra/kingdom-of-israel-2.webp, credit: "Mbzt, CC BY 3.0, via Wikimedia Commons", caption: "The Mesha Stele, on which Mesha, king of Moab, records his revolt against the kingdom of Israel, about 840 BCE (Louvre)", source: "https://commons.wikimedia.org/wiki/File:P1120873_Louvre_stèle_de_Mésha_AO5066_rwk.JPG" }
    - { url: /images/extra/kingdom-of-israel-3.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Carved ivory furniture inlays from Samaria, the capital of the kingdom of Israel, 9th–8th century BCE (Israel Museum, Jerusalem)", source: "https://commons.wikimedia.org/wiki/File:Furniture_Inlays,_Samaria,_9th-8th_Century_BC_(42500194064).jpg" }
    - { url: /images/extra/kingdom-of-israel-4.webp, credit: "Ian Scott, CC BY-SA 2.0, via Wikimedia Commons", caption: "The pillared buildings (so-called stables) of Megiddo, a royal city of the kingdom of Israel", source: "https://commons.wikimedia.org/wiki/File:The_So-Called_Stables_at_Megiddo_(20531412300).jpg" }
