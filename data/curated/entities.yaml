    - kind: video
      src: https://www.youtube.com/watch?v=uki9rNwoRzk
      title: "History of Ancient Egypt: Dynasty XXVI - Egypt's Last Great Pharaohs and the Saite Period"
      credit: History with Cy, YouTube
- id: thirtieth-dynasty-of-egypt
  description: The last dynasty of native Egyptian pharaohs, ruling from Sebennytos in the Nile Delta from 380 to 343 BCE. Founded by Nectanebo I, the dynasty vigorously defended Egyptian independence against repeated Persian invasions and initiated extensive temple construction projects across Egypt before Nectanebo II was ousted by Artaxerxes III.
  extra_images:
    - { url: /images/extra/thirtieth-dynasty-of-egypt-1.webp, credit: "Carole Raddato, CC BY-SA 2.0, via Wikimedia Commons", caption: "Limestone falcon of Horus protecting King Nectanebo II (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Horus_as_a_falcon_protecting_King_Nectanebo_II_(7463601262).jpg" }
    - { url: /images/extra/thirtieth-dynasty-of-egypt-2.webp, credit: "Carole Raddato, CC BY-SA 2.0, via Wikimedia Commons", caption: "The kiosk of Nectanebo I at the temple of Isis, Philae, about 370 BCE", source: "https://commons.wikimedia.org/wiki/File:The_Kiosk_of_Nectanebo_I,_Philae,_Egypt_(49812293013).jpg" }
    - { url: /images/extra/thirtieth-dynasty-of-egypt-3.webp, credit: "Dennis G. Jarvis, CC BY-SA 2.0, via Wikimedia Commons", caption: "The avenue of human-headed sphinxes of Nectanebo I leading to Luxor Temple", source: "https://commons.wikimedia.org/wiki/File:Flickr_-_archer10_(Dennis)_-_Egypt-3B-067.jpg" }
    - { url: /images/extra/thirtieth-dynasty-of-egypt-4.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Sarcophagus of Nectanebo II, never used after he fled the Persians, later a ritual bath in the Attarine Mosque, Alexandria (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Egyptian_Conglomerate_Sarcophagus_of_Nectanebo_II_Later_Used_as_Ritual_Bath_in_Attarin_Mosque,_30th_Dynasty,_c._345_BC_(35701912874).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=eojRsK7dFhM
      title: "The Last Native Pharaoh – Nectanebo II"
      credit: DW World History, YouTube
- id: ankhwennefer
  description: A native Egyptian rebel pharaoh who, along with his predecessor Horwennefer, led a major nationalist uprising that liberated Upper Egypt from Ptolemaic rule between 205 and 186 BCE. Governing Thebes and surrounding nomes with the support of the Amun priesthood, his rebellion was ultimately crushed by Ptolemy V Epiphanes.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=D2m9Tk8pgpo
      title: "087: Ptolemaic Egypt - The Great Revolt"
      credit: The Hellenistic Age History Podcast, YouTube
# Batch 4B: South Asia Kingdoms and Empires
- id: janapada-of-anga
  description: An ancient Iron Age realm in the eastern Ganges basin of modern Bihar and Bengal, centered at the prosperous river port capital of Champa. Famed for lucrative maritime and riverine trade, wealth, and fine craftsmanship, Anga was an early rival of neighboring Magadha before being conquered and annexed by King Bimbisara.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=CZB2J9eiK0k
      title: "Anga Mahajanapada: Champa (capital)"
      credit: Ayushi jain, YouTube
- id: janapada-of-asmaka
  description: The southernmost of the traditional sixteen Mahajanapadas, situated along the Godavari River in modern Maharashtra and Telangana. Serving as an early cultural and commercial bridge between northern Aryan realms and the peninsular Deccan, Asmaka maintained its capital at Potali before eventual incorporation into the expanding Magadhan Empire.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Rj1wNecgY3g
      title: "The Kingdom of Ashmaka - One of the 16th Mahajanapadas"
      credit: Reelimaginarium, YouTube
- id: janapada-of-avanti
  description: A powerful western Mahajanapada centered in the fertile Malwa plateau of modern Madhya Pradesh, with major capitals at Ujjayini (Ujjain) and Mahishmati. A major hub of inland trade routes connecting north India to western sea ports, Avanti was a great center of early Buddhism and metallurgy before succumbing to Magadha.
  extra_images:
    - { url: /images/extra/janapada-of-avanti-1.webp, credit: "Jean-Michel Moullec, CC BY 2.0, via Wikimedia Commons", caption: "Silver half karshapana of the kingdom of Avanti", source: "https://commons.wikimedia.org/wiki/File:I13_12karshapana_Avanti_1ar_(8481304617).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=kNn54y5e7WY
      title: "Avanti Mahajanapada: Ancient India’s Center of Trade, Culture, and Spirituality"
      credit: Gems of Indian History, YouTube
- id: janapada-of-cedi
  description: An ancient Indian kingdom located in the Bundelkhand region of modern Madhya Pradesh and Uttar Pradesh, along the Yamuna River. Prominently featured in the Mahabharata under King Shishupala, Cedi was an influential Iron Age realm with its capital at Suktimati before its assimilation into the imperial Gangetic sphere.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=rCAscK1pdW8
      title: "The Mystery of Chedi: The Untold Story of Shuktimati"
      credit: AIEkAdhyayan, YouTube
- id: janapada-of-gandhara
  description: An ancient kingdom situated in the fertile Peshawar valley and Potohar plateau of northwestern Pakistan and eastern Afghanistan, centered at Taxila and Pushkalavati. Positioned at the western gateway of the Indian subcontinent, Gandhara was famed for Vedic scholarship, cosmopolitan Silk Road trade, and later the magnificent synthesis of Greco-Buddhist art.
  image_url: /images/civilisations/janapada-of-gandhara.webp
  image_caption: Early Taxila (Bhir Mound) in the Janapada of Gandhāra, showing Vedic scholars examining curved silver bent-bar punch-marked coins overlooking mudbrick streets and Hindu Kush foothills.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/janapada-of-gandhara-1.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Silver bent-bar coins of the Gandhara Janapada, among the earliest coins of South Asia", source: "https://commons.wikimedia.org/wiki/File:Bent_bars_Gandhara_Janapada.jpg" }
    - { url: /images/extra/janapada-of-gandhara-2.webp, credit: "Dawoodmajoka, public domain, via Wikimedia Commons", caption: "The Bhir Mound at Taxila, Pakistan, the oldest city of Taxila, capital of Gandhara", source: "https://commons.wikimedia.org/wiki/File:BhirMound.JPG" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=d44rhmRC3zk
      title: "Gandhara Mahajanapada- one of 16 Mahajanapadas"
      credit: Rk, YouTube
- id: janapada-of-kamboja
  description: An ancient equestrian kingdom situated in the rugged Hindu Kush and Pamir mountain valleys of northern Pakistan, eastern Afghanistan, and Tajikistan. Celebrated in Vedic and epic Sanskrit literature for exceptional horse breeding, cavalry warriors, and republican councils, Kamboja engaged extensively in trans-Himalayan commerce before Persian and Maurya integration.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=HcyX15OcppM
      title: "The Kingdom of Kamboja - One of the 16th Mahajanapadas"
      credit: Reelimaginarium, YouTube
- id: janapada-of-kasi
  description: An ancient kingdom in the central Ganges valley centered on the sacred pilgrimage city of Varanasi (Benares). Known for fine cotton textiles, ivory carving, and spiritual scholarship, Kasi was one of the wealthiest early Janapadas, frequently warring with neighboring Kosala before being absorbed by its northern rival.
  extra_images:
    - { url: /images/extra/janapada-of-kasi-1.webp, credit: "Fred Cherrygarden, CC BY-SA 4.0, via Wikimedia Commons", caption: "Punch-marked silver vimshatika of the Kashi Janapada, with bankers' marks", source: "https://commons.wikimedia.org/wiki/File:Kashi_Vimshatika.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=oABt9OP-3-E
      title: "Exploring Kashi Mahajanpad: The Cradle of Ancient Indian Civilization"
      credit: Gems of Indian History, YouTube
- id: janapada-of-kosala
  description: A dominant northern Mahajanapada encompassing modern Awadh in Uttar Pradesh, with historic capitals at Shravasti and Ayodhya. Under King Prasenajit, Kosala was an economic powerhouse closely associated with the lives of Gautama Buddha and Mahavira, engaging in bitter geopolitical competition with Magadha for hegemony over the Gangetic Plain.
  extra_images:
    - { url: /images/extra/janapada-of-kosala-1.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Punch-marked silver karshapanas of the Kosala Janapada, about 525–465 BCE", source: "https://commons.wikimedia.org/wiki/File:Kosala_Karshapana.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bXnC3_WJ7Wo
      title: "Exploring Koshal Mahajanapada - A Jewel of Ancient India"
      credit: Gems of Indian History, YouTube
- id: janapada-of-kuru
  description: The pioneering Middle Vedic tribal kingdom situated in the Kurukshetra and upper Doab regions between the Saraswati and Ganges rivers. Famous as the legendary setting of the Mahabharata, the Kuru state under King Parikshit and Janamejaya codified Vedic rituals, collected the Vedic hymns, and established early North Indian social stratification.
  extra_images:
    - { url: /images/extra/janapada-of-kuru-1.webp, credit: "SpeakingArch, CC BY-SA 4.0, via Wikimedia Commons", caption: "Punch-marked coin of the Kuru Janapada (INHCRF Coin Museum, Nashik)", source: "https://commons.wikimedia.org/wiki/File:Punch-marked_coin_of_the_Kuru_Janapada,_INHCRF_Coin_Museum,_Nashik,_Maharashtra.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=FU_0o4E4sPQ
      title: "8/12 Kuru: The Legacy Of Kings | The Mahajanapadas | Ancient Indian History"
      credit: History Chronicles, YouTube
- id: janapada-of-magadha
  description: The preeminent eastern Mahajanapada based in the fertile plains of modern southern Bihar, centered at the natural fortress capital of Rajagriha. Endowed with rich iron deposits, fertile rice agriculture, and strategic river trade, Magadha pioneered elephant warfare and statecraft, becoming the imperial nucleus of ancient Indian empire building.
  extra_images:
    - { url: /images/extra/janapada-of-magadha-1.webp, credit: "Rohit Sharma, CC BY-SA 4.0, via Wikimedia Commons", caption: "The Cyclopean Wall of Rajgir, the stone circuit that enclosed Rajagriha, the early capital of Magadha", source: "https://commons.wikimedia.org/wiki/File:Cyclopean_Wall_of_Rajgir.jpg" }
    - { url: /images/extra/janapada-of-magadha-2.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Punch-marked silver karshapanas of the kingdom of Magadha, about 430–320 BCE", source: "https://commons.wikimedia.org/wiki/File:Magadha_kingdom_Circa_430-320s_BC_AR_Karshapana.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=QjZIgavpDcI
      title: "Rise of Magadha | How Magadha Became The Strongest Empire In Ancient India"
      credit: India Unravelled, YouTube
- id: janapada-of-malla
  description: An ancient republican confederacy (gana-sangha) in the eastern Terai foothills of modern Uttar Pradesh and southern Nepal, centered on twin capitals at Kusinara and Pava. Governed by democratic assembly councils of kshatriya peers, the Mallas are revered in Buddhist tradition as the hosts of the Buddha's final parinirvana.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=j80KFCTMsh0
      title: "Mall Mahajanapada – A Glimpse into Ancient India"
      credit: Gems of Indian History, YouTube
- id: janapada-of-matsya
  description: An ancient kingdom situated south of the Kuru realm in modern eastern Rajasthan, centered on the capital of Viratnagar (Bairat). Mentioned extensively in the Vedic literature and Mahabharata as an agricultural and pastoral realm, Matsya maintained independent republican and monarchical traditions before absorption into the Maurya Empire.
  extra_images:
    - { url: /images/extra/janapada-of-matsya-1.webp, credit: "SpeakingArch, CC BY-SA 4.0, via Wikimedia Commons", caption: "Punch-marked karshapana of the Matsya Janapada", source: "https://commons.wikimedia.org/wiki/File:Ksharpana_from_Matsya_Janpad,_Private_collection.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=65-ilDatFXg
      title: "In Search of Matsya Mahajanapada | Bairat (Vijay Nagar Stupa) History On LHI Circle"
      credit: Peepul Tree World, YouTube
- id: janapada-of-pancala
  description: A major Vedic tribal kingdom in the fertile upper-central Ganges plain of modern Uttar Pradesh, divided by the Ganges into northern (Ahichchhatra) and southern (Kampilya) realms. Famed for philosophical debate, Brahmanical learning, and urban craftsmanship, Pancala allied closely with the neighboring Kuru kingdom during the Late Vedic period.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Afn4xY6si_I
      title: "पंचाल महाजनपद का गौरवशाली इतिहास|Panchal Mahajanpad History"
      credit: Gems of Indian History, YouTube
- id: janapada-of-surasena
  description: An ancient kingdom situated in the Braj region along the Yamuna River in western Uttar Pradesh, centered at the historic city of Mathura. Revered in Hindu tradition as the birthplace and homeland of Krishna and the Yadava clans, Surasena was an important pilgrimage, commercial, and artistic crossroad in northern India.
  extra_images:
    - { url: /images/extra/janapada-of-surasena-1.webp, credit: "Biswarup Ganguly, CC BY 3.0, via Wikimedia Commons", caption: "Sherd of Northern Black Polished Ware, the fine pottery of the Mahajanapada period, from Sonkh near Mathura, capital of Surasena (Government Museum, Mathura)", source: "https://commons.wikimedia.org/wiki/File:Fragment_-_Northern_Black_Polished_Ware_-_500-100_BCE_-_Sonkh_-_Showcase_6-15_-_Prehistory_and_Terracotta_Gallery_-_Government_Museum_-_Mathura_2013-02-24_6458.JPG" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xQe-Mc_SqFQ
      title: "Surasena Mahajanpada"
      credit: LearnersHub, YouTube
- id: janapada-of-vajji
  description: A celebrated democratic confederacy of eight allied clans—most prominently the Licchavis—based in northern Bihar with its magnificent capital at Vaishali. Governed through participatory assembly debates and elected leaders rather than hereditary monarchs, the Vajji Sangha was a prosperous bastion of early Jainism and Buddhism before conquest by Ajatashatru of Magadha.
  extra_images:
    - { url: /images/extra/janapada-of-vajji-1.webp, credit: "Sumitsurai, CC BY-SA 4.0, via Wikimedia Commons", caption: "The modern shelter over the Relic Stupa at Vaishali, capital of the Licchavis of the Vajji confederacy, said to hold their share of the Buddha's ashes", source: "https://commons.wikimedia.org/wiki/File:Buddha_Relic_Stupa_-_Vaishali_(1).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=hvQ2oK5wj5w
      title: "Vajji Mahajanapada Explained | Ancient India's Democracy?"
      credit: Damanpreet Kaur, YouTube
- id: janapada-of-vatsa
  description: An ancient Mahajanapada situated at the strategic confluence of the Ganges and Yamuna rivers in modern southern Uttar Pradesh, centered at the fortified metropolis of Kaushambi. Under King Udayana, a romantic hero of classical Sanskrit drama, Vatsa was a vibrant center of international commerce, urban arts, and Buddhist monasticism.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=L2sLq942gFU
      title: "Vats Mahajanapad"
      credit: Gems of Indian History, YouTube
- id: mahajanapadas
  description: The sixteen 'Great Realms'—spanning monarchies and aristocratic republics—that flourished across the Indo-Gangetic Plain and Deccan from the 6th to 4th centuries BCE. This transformative era witnessed the 'Second Urbanisation' of South Asia, the rise of coinage and guild commerce, and the emergence of Jain, Buddhist, and Ajivika philosophy.
  extra_images:
    - { url: /images/extra/mahajanapadas-1.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Early Indian silver money: bent bars and punch-marked coins of the Mahajanapadas, with later Mauryan pieces", source: "https://commons.wikimedia.org/wiki/File:Mix_of_short_punch-marked_bent_bars,_long_ones,_Gandharan_coins_and_Mauryan_punch-marked_coins.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=k2F9lHYqWrI
      title: "Mahajanapadas | Complete Ancient History Through Animation"
      credit: StudyIQ IAS, YouTube
- id: magadha-haryanka-dynasty
  description: The foundational imperial dynasty of Magadha, established by King Bimbisara and expanded by his son Ajatashatru in the 6th and 5th centuries BCE. The Haryanka monarchs annexed Anga, conquered the Vajji confederacy through innovative siege engines, constructed Pataliputra, and actively patronized both the Buddha and Mahavira.
  extra_images:
    - { url: /images/extra/magadha-haryanka-dynasty-1.webp, credit: "Biswarup Ganguly, CC BY 3.0, via Wikimedia Commons", caption: "King Bimbisara and his court leaving Rajagriha to visit the Buddha, relief on the north gateway of Stupa 1 at Sanchi, 1st century BCE", source: "https://commons.wikimedia.org/wiki/File:Bimbisara_with_his_royal_cortege_issuing_from_the_city_of_Rajagriha_to_visit_the_Buddha.jpg" }
    - { url: /images/extra/magadha-haryanka-dynasty-2.webp, credit: "Photo Dharma, CC BY 2.0, via Wikimedia Commons", caption: "King Ajatashatru worshipping the Buddha, a relief from the Bharhut stupa, 2nd century BCE (Indian Museum, Kolkata)", source: "https://commons.wikimedia.org/wiki/File:Indian_Museum_Sculpture_-_Ajatasattu_worships_the_Buddha_(9217704485).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=sZ-rLiYyDTo
      title: "Haryanka Dynasty | Rajvansh: Dynasties Of India | Full Episode"
      credit: Crazy Color Facts, YouTube
- id: magadha-shaishunaga-dynasty
  description: The second imperial dynasty of Magadha, founded around 413 BCE by Shishunaga, a former royal minister who overthrew the unpopular Haryankas. Shishunaga achieved the historic triumph of crushing the rival kingdom of Avanti, while his son Kalashoka convened the Second Buddhist Council at Vaishali before the dynasty was usurped by Mahapadma Nanda.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=b5VITYoVr_U
      title: "Shishunaga Dynasty | Rajvansh: Dynasties of India | Full Episode"
      credit: Crazy Color Facts, YouTube
- id: nanda-empire
  description: The powerful pan-Gangetic empire established in the 4th century BCE by Mahapadma Nanda, who overthrew the Shaishunagas and conquered numerous northern Indian kingdoms. Governed from Pataliputra, the Nandas accumulated immense treasury wealth and commanded a vast standing army of 200,000 infantry and 3,000 war elephants that discouraged Alexander the Great from advancing into India.
  extra_images:
    - { url: /images/extra/nanda-empire-1.webp, credit: "PHG, public domain, via Wikimedia Commons", caption: "Punch-marked silver coin of the Nanda Empire with the sun, the six-armed symbol of Magadha, a bull on a hill and an elephant", source: "https://commons.wikimedia.org/wiki/File:MauryanCoin.JPG" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=07IUrCT3OwQ
      title: "The Empire So Wealthy and So Hated That Alexander's Own Army Refused to Fight It"
      credit: Ancestors Civilization, YouTube
- id: kalinga
  description: An ancient coastal realm stretching between the Mahanadi and Godavari rivers in modern Odisha and northern Andhra Pradesh. Renowned for maritime trade with Southeast Asia, naval prowess, and fierce independence, Kalinga was conquered by Ashoka the Great in a devastating war around 261 BCE that prompted Ashoka's famous conversion to Buddhist non-violence.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=txQVjNWZx9I
      title: "Why The Kalinga War Is The Greatest War In History | Ashoka The Great & Kalinga War"
      credit: Battles In History, YouTube
- id: maurya-empire
  description: "Around 320 BCE Chandragupta Maurya seized power in the kingdom of Magadha and built the first empire to unite most of the Indian subcontinent, governed from the great city of Pataliputra. His grandson Ashoka, horrified by the bloodshed of his conquest of Kalinga, turned to Buddhism, and had edicts urging non-violence and tolerance carved on rocks and pillars across his realm. After Ashoka's death the empire weakened, and in about 185 BCE the last Mauryan king was killed by his own general."
  image_url: /images/civilisations/maurya-empire.webp
  image_caption: Maurya Empire under Emperor Ashoka featuring the Great Stupa at Sanchi, the polished sandstone Lion Capital pillar, Brahmi rock edicts, and punch-marked silver karshapana coins.
  image_credit: AI-generated illustration
  narration: { src: narration/civilizations/maurya-empire-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "f9ac22c521" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Ed6UZtVTI64
      title: "Ashoka the Great - Rise of the Mauryan Empire Documentary"
      credit: Kings and Generals, YouTube
  extra_images:
    - { url: /images/extra/maurya-empire-3.webp, credit: "Cleveland Museum of Art, CC0, via Wikimedia Commons", caption: "Silver punch-marked coin of the Maurya Empire", source: "https://commons.wikimedia.org/wiki/File:Clevelandart_1967.243.jpg" }
    - { url: /images/extra/maurya-empire-1.webp, credit: "Yann Forget, CC BY-SA 4.0, via Wikimedia Commons", caption: "The Lion Capital of Ashoka from Sarnath", source: "https://commons.wikimedia.org/wiki/File:Lion_Capital_of_Ashoka.jpg" }
    - { url: /images/extra/maurya-empire-2.webp, credit: "เทวประภาส มากคล้าย, CC BY-SA 3.0, via Wikimedia Commons", caption: "Remains of Ashoka's pillar at Sarnath, still bearing one of his edicts", source: "https://commons.wikimedia.org/wiki/File:Sarnath_Ashoka_Pillar..jpg" }
    - { url: /images/extra/maurya-empire-4.webp, credit: "Bernard Gagnon, CC BY-SA 3.0, via Wikimedia Commons", caption: "The Great Stupa at Sanchi, originally commissioned by Emperor Ashoka", source: "https://commons.wikimedia.org/wiki/File:Stupa_1,_Sanchi_02.jpg" }
- id: anuradhapura
  description: The first major kingdom of ancient Sri Lanka, established around the historic capital city of Anuradhapura in 377 BCE by King Pandukabhaya. Flourishing for over a millennium, the kingdom engineered monumental hydraulic irrigation reservoirs (tanks) and celebrated Buddhist stupas, officially embracing Theravada Buddhism under King Devanampiya Tissa.
  image_url: /images/civilisations/anuradhapura.webp
  image_caption: Anuradhapura in ancient Sri Lanka, featuring a carved granite sandakada pahana moonstone step, Buddhist monks, the sacred Bodhi tree shrine, and the whitewashed Ruwanwelisaya stupa.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/anuradhapura-1.webp, credit: "Bernard Gagnon, CC BY-SA 3.0, via Wikimedia Commons", caption: "The Thuparamaya, the first stupa of Sri Lanka, built at Anuradhapura in the 3rd century BCE (restored), with the pillars of its former roof", source: "https://commons.wikimedia.org/wiki/File:Thuparamaya_dagaba.jpg" }
    - { url: /images/extra/anuradhapura-2.webp, credit: "KennyOMG, CC BY-SA 4.0, via Wikimedia Commons", caption: "The Ruwanweli Saya, the great stupa built at Anuradhapura by King Dutugemunu in the 2nd century BCE (restored)", source: "https://commons.wikimedia.org/wiki/File:Ruwanweli_Saya_1.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=vLDTBFcqKdA
      title: "The Engineering Marvels Of Sri Lanka's Ancient Kingdom Anuradhapura | The Mark Of Empire"
      credit: CNA Insider, YouTube
- id: early-cheras
  description: An ancient Tamil seafaring dynasty of the Sangam period that ruled the Malabar Coast and western Tamil Nadu (modern Kerala and Kongu Nadu). Operating from port capitals like Muziris, the Cheras conducted lucrative direct spice, beryl, and pepper trade with the Roman Empire and neighboring Mediterranean merchants.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=n_ByNtfuLbw
      title: "The Chera Dynasty: Trade, Literature, and the Spice Route"
      credit: Crazy Color Facts, YouTube
- id: early-cholas
  description: An ancient Tamil dynasty of the Sangam period that governed the fertile Kaveri River delta in eastern Tamil Nadu from capitals at Uraiyur and Puhar (Kaveripoompattinam). Celebrated in early Tamil poetry under legendary King Karikala, the early Cholas engineered early flood embankments, established overseas trade with Southeast Asia, and patronized classical Sangam literature.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=MqzM43o5Jes
      title: "The Cholas Naval Power and Temple Building"
      credit: Crazy Color Facts, YouTube
- id: early-pandyas
  description: An ancient Sangam-era Tamil dynasty centered at the cultural capital of Madurai and the pearl-fishing port of Korkai in southern Tamil Nadu. Renowned as the historic patrons of the literary Tamil Sangam assemblies, the Pandyas exported exquisite natural pearls and gemstones across the ancient Mediterranean and Indian Ocean worlds.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=On8ylx_veFk
      title: "Pandyan Empire – History, Expansion"
      credit: Crazy Color Facts, YouTube
- id: satavahana-dynasty
  description: A major Deccan empire that arose in the 2nd century BCE following the decline of the Mauryas, spanning modern Maharashtra, Andhra Pradesh, and Telangana. Governed from capitals at Pratishthana and Amaravati, the Satavahanas defended central India against Saka incursions, issued multilingual bilingual coinage, and sponsored rock-cut Buddhist chaityas at Karla and Ajanta.
  image_url: /images/civilisations/satavahana-dynasty.webp
  image_caption: Amaravati and the Karle Caves in the Satavahana Empire, showing the rock-cut Buddhist Chaitya hall, Great Stupa of Amaravati, limestone relief carvers, and two-masted ship coins.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/satavahana-dynasty-1.webp, credit: "Nvvchar, CC0, via Wikimedia Commons", caption: "The Great Rock-cut Buddhist Chaitya Hall at Karle Caves, Maharashtra, built under the Satavahana dynasty (c. 1st c. BCE – 2nd c. CE)", source: "https://commons.wikimedia.org/wiki/File:Grand_Chaitya_at_Karla_Caves_-_2025_-_01.jpg" }
    - { url: /images/extra/satavahana-dynasty-2.webp, credit: "World Imaging, CC BY-SA 3.0, via Wikimedia Commons", caption: "Intricately carved Palnad limestone drum frieze depicting scenes from the life of the Buddha, Amaravati Stupa (British Museum)", source: "https://commons.wikimedia.org/wiki/File:AmaravatiFrieze.jpg" }
    - { url: /images/extra/satavahana-dynasty-3.webp, credit: "Public domain, via Wikimedia Commons", caption: "Satavahana lead coin depicting a double-masted ocean-going sailing ship, issued under King Vashishtiputra Pulumavi (c. 130–159 CE)", source: "https://commons.wikimedia.org/wiki/File:Andhra_Ship_Coins.jpg" }
    - { url: /images/extra/satavahana-dynasty-4.webp, credit: "Pradeep717, CC BY-SA 4.0, via Wikimedia Commons", caption: "Life-sized rock-cut relief sculpture of wealthy merchant donor couple, Great Chaitya veranda at Kanheri Caves", source: "https://commons.wikimedia.org/wiki/File:Kanheri_donor_couple.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=lgfPT9YtunM
      title: "Satavahana Dynasty | Rajvansh: Dynasties Of India | Full Episode"
      credit: EPIC TV, YouTube
- id: mahameghavahana-dynasty
  description: A resurgent royal dynasty of ancient Kalinga that restored the region's independence and imperial prestige following the collapse of the Maurya Empire. Its greatest ruler, King Kharavela (2nd century BCE), left the celebrated Hathigumpha rock inscription at Udayagiri, detailing victorious campaigns across North India and generous patronage of Jainism.
  extra_images:
    - { url: /images/extra/mahameghavahana-dynasty-1.webp, credit: "Alexander E. Caddy, public domain, via Wikimedia Commons", caption: "The two-storey Rani Gumpha at Udayagiri near Bhubaneswar, a Jain monastery cut under the Mahameghavahana kings, photographed in 1895", source: "https://commons.wikimedia.org/wiki/File:*General_view_of_the_facade_of_the_Rani_Gumpha,_Udayagiri,_a_photo_by_Alexander_E._Caddy,_1895.jpg" }
    - { url: /images/extra/mahameghavahana-dynasty-2.webp, credit: "Kevin Standage, CC BY-SA 2.0, via Wikimedia Commons", caption: "Guardian figure in foreign (Yavana) dress carved at the Udayagiri caves, Odisha", source: "https://commons.wikimedia.org/wiki/File:Yavana_warrior,_Udayagiri_and_Khandagiri_Caves.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=5WWrhbaQyLY
      title: "Samrat Kharavela of Kalinga | The Great Jain King of Ancient India"
      credit: The Occasional Professor, YouTube
- id: shunga-empire
  description: The Magadhan imperial dynasty established in 185 BCE by Pushyamitra Shunga after the assassination of the last Maurya emperor, Brihadratha. Ruling from Pataliputra and Vidisha, the Shungas repelled Indo-Greek invasions, patronized traditional Vedic horse sacrifices (Ashvamedha), and sponsored magnificent Buddhist architectural expansions at Bharhut and the Great Stupa of Sanchi.
  image_url: /images/civilisations/shunga-empire.webp
  image_caption: Bharhut Stupa and Pataliputra during the Shunga Empire, featuring the carved red-sandstone torana gateway, Gajalakshmi medallion, terracotta plaques, and Vedic Ashvamedha fire ritual.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/shunga-empire-1.webp, credit: "Tinucherian, CC BY 3.0, via Wikimedia Commons", caption: "The carved sandstone railing and gateway of the Bharhut stupa, Shunga period (Indian Museum, Kolkata)", source: "https://commons.wikimedia.org/wiki/File:Polished_sandstone_Vedika,_Bharhut_stupa,_Shunga_dynasty,_Indian_Museum,_Kolkata_1515.jpg" }
    - { url: /images/extra/shunga-empire-2.webp, credit: "Biswarup Ganguly, CC BY 3.0, via Wikimedia Commons", caption: "Gajalakshmi bathed by elephants, a medallion from the Bharhut railing, 2nd century BCE (Indian Museum, Kolkata)", source: "https://commons.wikimedia.org/wiki/File:Gajalaxmi_-_Medallion_-_2nd_Century_BCE_-_Red_Sand_Stone_-_Bharhut_Stupa_Railing_Pillar_-_Madhya_Pradesh_-_Indian_Museum_-_Kolkata_2012-11-16_1837_Cropped.JPG" }
    - { url: /images/extra/shunga-empire-3.webp, credit: "Bjoertvedt, CC BY-SA 4.0, via Wikimedia Commons", caption: "Terracotta plaque of a goddess from northeastern India, Shunga period, about 100 BCE (Asian Civilisations Museum, Singapore)", source: "https://commons.wikimedia.org/wiki/File:India_northeast_Shunga_period_c_100_BC_-_Mother_goddess_in_terracotta_IMG_9623_Museum_of_Asian_Civilisation.jpg" }
    - { url: /images/extra/shunga-empire-4.webp, credit: "SpeakingArch, CC BY-SA 4.0, via Wikimedia Commons", caption: "Terracotta disc with an elephant from Sugh, Haryana, 2nd century BCE (Government Museum and Art Gallery, Chandigarh)", source: "https://commons.wikimedia.org/wiki/File:Terracotta_disc_with_elephant_motif_from_Sugh,_Haryana,_circa_2nd_century_BCE,_Shunga_Period,_Government_Museum_and_Art_Gallery,_Chandigarh.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=2pc5wPFdFQg
      title: "Shunga And Kanva Dynasty | Rajvansh: Dynasties Of India | Full Episode"
      credit: EPIC TV, YouTube
- id: kanva-dynasty
  description: A short-lived Brahmin dynasty of Magadha founded in 73 BCE by Vasudeva after overthrowing the last Shunga monarch, Devabhuti. Governing a contracted territory centered on Pataliputra, the four Kanva kings maintained traditional imperial administration for roughly four decades before Magadha fell under the sway of the southern Satavahanas.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=MoMuuziH7_0
      title: "Ancient Indian History | Shunga Dynasty & Kanva Dynasty"
      credit: Let's Crack UPSC CSE, YouTube
- id: indo-greeks
  description: The Hellenistic kingdom established in the 2nd century BCE when Greco-Bactrian rulers like Demetrius and Menander I expanded into northwestern South Asia (modern Afghanistan, Pakistan, and northwestern India). Famous for artistic bilingual coinage in Greek and Kharosthi, the kingdom fostered the rich synthesis of Greco-Buddhist religion, philosophy, and Gandharan sculpture.
  image_url: /images/civilisations/indo-greeks.webp
  image_caption: Taxila and Sagala in the Indo-Greek Kingdom, showing King Menander conversing with Buddhist monks beside the Heliodorus Garuda pillar, square elephant-and-bull coins, and Gandharan sculpture.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/indo-greeks-1.webp, credit: "Vidishaprakash, CC BY-SA 3.0, via Wikimedia Commons", caption: "The Heliodorus pillar at Vidisha, set up about 110 BCE by Heliodorus, ambassador of the Indo-Greek king Antialcidas", source: "https://commons.wikimedia.org/wiki/File:Heliodorus_pillar.JPG" }
    - { url: /images/extra/indo-greeks-2.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Portrait of King Menander I (about 165–130 BCE) on his coinage", source: "https://commons.wikimedia.org/wiki/File:Menander_I,_portrait_from_coinage.jpg" }
    - { url: /images/extra/indo-greeks-3.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Bilingual coin of Antialcidas, with Greek on one side and Kharosthi on the other, and Zeus with an elephant", source: "https://commons.wikimedia.org/wiki/File:Coin_of_Antialkidas.jpg" }
    - { url: /images/extra/indo-greeks-4.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Square bilingual coin of Apollodotus I with an elephant and an Indian humped bull", source: "https://commons.wikimedia.org/wiki/File:Apollodotus_zebu_with_nandipada_hump.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=ZxJk4KHZxi8
      title: "Ancient Greek Kingdom in India"
      credit: Kings and Generals, YouTube
- id: indo-scythians
  description: A confederation of Saka (Scythian) nomadic tribes who migrated from Central Asia into northwestern South Asia (Gandhara, Punjab, Gujarat, and Mathura) during the 1st century BCE. Adopting Buddhism and Indian royal titles while retaining Iranian cavalry traditions, the Sakas established powerful satrapies that influenced North Indian coin design, art, and urban governance.
  image_url: /images/civilisations/indo-scythians.webp
  image_caption: Taxila and Gandhara under the Indo-Scythians, featuring the golden Bimaran reliquary casket, Mathura Lion Capital, Azes equestrian coins, and scale-armored Saka cataphracts before a stupa.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/indo-scythians-1.webp, credit: "Classical Numismatic Group, CC BY-SA 3.0, via Wikimedia Commons", caption: "Coin of Maues, the first Indo-Scythian king in Gandhara, about 80 BCE", source: "https://commons.wikimedia.org/wiki/File:Coin_of_Maues.jpg" }
    - { url: /images/extra/indo-scythians-2.webp, credit: "PHG, CC BY-SA 3.0, via Wikimedia Commons", caption: "Coin of Azes II with the king on horseback, 1st century BCE", source: "https://commons.wikimedia.org/wiki/File:Coin_of_Azes_II.jpg" }
    - { url: /images/extra/indo-scythians-3.webp, credit: "PHGCOM, CC BY-SA 3.0, via Wikimedia Commons", caption: "The Mathura lion capital, inscribed in Kharosthi for the family of the Indo-Scythian satrap Rajuvula (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Mathura_Lion_Capital_Detail.jpg" }
    - { url: /images/extra/indo-scythians-4.webp, credit: "World Imaging, CC BY-SA 3.0, via Wikimedia Commons", caption: "The gold Bimaran reliquary, found with coins of Azes, with one of the earliest images of the Buddha (British Museum)", source: "https://commons.wikimedia.org/wiki/File:BimaranCasket2.JPG" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=LeDeYvP3nwE
      title: "Clash of Civilizations: Satavahana Empire vs. Indo-Scythians"
      credit: The Indian History Nerd, YouTube
- id: indo-parthians
  description: An ancient kingdom established around 19 CE when the Parthian general Gondophares broke away from the Arsacids to forge an independent realm spanning modern Afghanistan, Pakistan, and northwestern India. Governed from Taxila, the dynasty blended Parthian, Scythian, and Hellenistic cultural traditions, featuring prominently in early Christian apocrypha concerning Saint Thomas.
  image_url: /images/civilisations/indo-parthians.webp
  image_caption: Taxila (Sirkap) blending Hellenistic and Indian architecture, King Gondophares conferring with Buddhist monks before the Double-Headed Eagle Stupa.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/indo-parthians-1.webp, credit: "World Imaging, CC BY-SA 3.0, via Wikimedia Commons", caption: "Coin of Gondophares, founder of the Indo-Parthian kingdom (British Museum)", source: "https://commons.wikimedia.org/wiki/File:GondopharesCoin.JPG" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bJRFT2s49Ao
      title: "The short-lived Iranian dynasty of Ancient India"
      credit: Jay Vardhan Singh, YouTube
# Batch 5A: East Asia Dynasties, Korea, Steppe & Warring States
- id: shang-dynasty
  description: The earliest historically confirmed Chinese dynasty, ruling the fertile Yellow River valley from capitals like Anyang (Yinxu) between c. 1600 and 1046 BCE. Renowned for masterful piece-mold ritual bronze casting, horse-drawn chariot warfare, and the earliest surviving Chinese writing inscribed on divination oracle bones.
  image_url: /images/civilisations/shang-dynasty.webp
  image_caption: Yinxu (Anyang) during the Shang Dynasty, featuring a monumental rectangular bronze ding cauldron, owl wine vessel, jade dragon, inscribed turtle oracle bones, and piece-mold bronze foundries.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/shang-dynasty-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Inscribed Shang dynasty divination oracle bone on ox scapula from Yinxu, Anyang", source: "https://commons.wikimedia.org/wiki/File:Ancient_Chinese_Writing_on_Ox_Scapula,_Shang_Dynasty_Oracle_Bone,_Yinxu,_Anyang.jpg" }
    - { url: /images/extra/shang-dynasty-2.webp, credit: "Mlogic, CC BY-SA 3.0, via Wikimedia Commons", caption: "The monumental Houmuwu Ding (c. 1200 BCE, 832 kg), the largest ancient Chinese sacrificial bronze vessel ever discovered (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:HouMuWuDingFullView.jpg" }
    - { url: /images/extra/shang-dynasty-3.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Masterwork carved jade phoenix from the royal tomb of Lady Fu Hao, Yinxu, Anyang (c. 1200 BCE)", source: "https://commons.wikimedia.org/wiki/File:Shang_Jade_Phoenix,_Fu_Hao_Tomb,_c._1200_BC.jpg" }
    - { url: /images/extra/shang-dynasty-4.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Shang ritual bronze wine vessel (zun) cast in the form of a sacred owl, from the tomb of Fu Hao (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:Shang_Bronze_Owl_Zun,_Fuhao_Tomb,_Anyang.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=VRQKp_vjVSY
      title: "[Documentary] China's Bronze Age - Shang Dynasty (1760 - 1520 BC)"
      credit: Bronze Goblet, YouTube
- id: zhou-dynasty
  description: The longest-lasting dynasty in Chinese history (1046–256 BCE), which overthrew the Shang and established the political doctrine of the 'Mandate of Heaven'. Initially ruling through a decentralized feudal network of kinship fiefs (fengjian), the Western Zhou fostered classical Chinese cultural, ritual, and philosophical foundations.
  image_url: /images/civilisations/zhou-dynasty.webp
  image_caption: Fenghao and Luoyang during the Zhou Dynasty, with court musicians playing graduated bronze bianzhong chime bells, ritual bronze vessels, jade bi discs, and four-horse war chariots.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/zhou-dynasty-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "The Mao Gong Ding (Duke Mao Tripod), late Western Zhou Dynasty bronze ritual vessel carrying a 500-character commemorative inscription, the longest bronze inscription from antiquity (National Palace Museum, Taipei)", source: "https://commons.wikimedia.org/wiki/File:Bronze_Mao_Gong_Ding%2C_Late_Western_Zhou.jpg" }
    - { url: /images/extra/zhou-dynasty-2.webp, credit: "Windmemories, CC BY-SA 4.0, via Wikimedia Commons", caption: "The Bianzhong of Marquis Yi of Zeng (c. 433 BCE), monumental ritual set of 65 two-tone tuned bronze bells mounted on lacquered timber racks (Hubei Provincial Museum)", source: "https://commons.wikimedia.org/wiki/File:20230208_Chime_bells_of_Marquis_Yi_of_Zeng.jpg" }
    - { url: /images/extra/zhou-dynasty-3.webp, credit: "CC BY-SA 3.0, via Wikimedia Commons", caption: "The Da Ke Ding (c. 10th century BCE), monumental Western Zhou ritual bronze cauldron cast under King Xiao with taotie wave patterns and 290-character inscription (Shanghai Museum)", source: "https://commons.wikimedia.org/wiki/File:Da_Ke_ding.jpg" }
    - { url: /images/extra/zhou-dynasty-4.webp, credit: "Gary Lee Todd, CC0, via Wikimedia Commons", caption: "Carved nephrite jade arched dragon pendant (huang), Western Zhou Dynasty, exhibiting incised double-line decorative carving (Shaanxi History Museum)", source: "https://commons.wikimedia.org/wiki/File:Western_Zhou_Jade_07.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=sqppiHdirc0
      title: "[Documentary] Origin of Li and Yue - Zhou Dynasty (1046 -256 BC)"
      credit: Bronze Goblet, YouTube
- id: later-zhou
  description: The Eastern Zhou dynasty (770–256 BCE), established when King Ping moved the royal capital east to Luoyang following nomadic Rong raids that destroyed the western capital. Though royal power declined to nominal ceremonial status, this era witnessed immense intellectual flowering during the Hundred Schools of Thought, including Confucianism and Daoism.
  extra_images:
    - { url: /images/extra/later-zhou-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "An Eastern Zhou royal chariot burial at Luoyang, the capital of the later Zhou kings (Eastern Zhou Chariot Burial Museum)", source: "https://commons.wikimedia.org/wiki/File:Eastern_Zhou_Royal_Chariot_Pit,_Luoyang_03.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GZ_lSXv4Psg
      title: "The Western Zhou Dynasty and the Spring and Autumn Period - Explained"
      credit: GatesOfKilikien, YouTube
- id: qin-dynasty
  description: "After centuries of war between rival states, the kingdom of Qin conquered the last of its rivals in 221 BCE, and its king declared himself Qin Shi Huang, the First Emperor of a united China. He imposed one script, one currency and standard weights and measures, linked older walls into a great wall against the northern nomads, and was buried with an army of thousands of life-size terracotta soldiers. His harsh rule did not outlast him: the dynasty collapsed in rebellion in 206 BCE."
  image_url: /images/civilisations/qin-dynasty.webp
  image_caption: Imperial capital of Xianyang with tiered Qin palace halls, armored Qin crossbowmen and halberdiers, royal chariot, and officials inspecting standardized Ban Liang coins and bamboo slips.
  image_credit: AI-generated illustration
  narration: { src: narration/civilizations/qin-dynasty-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "32437c007b" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=h-SC0vKIWV0
      title: "The Birth Of A Dynasty: China's First Emperor"
      credit: Odyssey - Ancient History Documentaries, YouTube
  extra_images:
    - { url: /images/extra/qin-dynasty-3.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Qin bronze Ban Liang coin, the standardized currency of united China", source: "https://commons.wikimedia.org/wiki/File:026_S-83_Qin_Ban_Liang,_221-208_BC,_30mm.jpg" }
    - { url: /images/extra/qin-dynasty-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Qin standard bronze weight", source: "https://commons.wikimedia.org/wiki/File:Qin_Bronze_Weight.jpg" }
    - { url: /images/extra/qin-dynasty-2.webp, credit: "Jmhullot, CC BY 3.0, via Wikimedia Commons", caption: "The terracotta army in Pit 1 at the First Emperor's tomb", source: "https://commons.wikimedia.org/wiki/File:Terracotta_Army,_View_of_Pit_1.jpg" }
    - { url: /images/extra/qin-dynasty-4.webp, credit: "Bianchi David, CC BY 4.0, via Wikimedia Commons", caption: "Armoured terracotta soldier from the tomb of Qin Shi Huang", source: "https://commons.wikimedia.org/wiki/File:TERRACOTTA_WARRIOR.jpg" }
- id: han-dynasty
  description: "Out of the rebellions that ended the Qin, a former village official named Liu Bang founded the Han dynasty in 202 BCE. Over four centuries the Han built a lasting model for Chinese government, staffed by officials trained in Confucian learning, and their armies pushed into Central Asia, opening the trade routes later called the Silk Road. Paper was invented in the Han era. So central was this age that most Chinese people still call themselves the Han; the dynasty finally broke apart in 220 CE."
  image_url: /images/civilisations/han-dynasty.webp
  image_caption: Imperial Chang'an with twin que watchtowers, a Silk Road camel caravan loading silk bolts, and Han scholars beside a boshanlu censer, lacquerware, and early paper scrolls.
  image_credit: AI-generated illustration
  narration: { src: narration/civilizations/han-dynasty-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "2c8c8b5fe0" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=5Vm4Fg26e20
      title: "The Han Dynasty Explained"
      credit: Captivating History, YouTube
  extra_images:
    - { url: /images/extra/han-dynasty-1.webp, credit: "Public domain, via Wikimedia Commons", caption: "Painted silk banner from Mawangdui tomb 1, 2nd century BCE", source: "https://commons.wikimedia.org/wiki/File:Mawangdui_silk_banner_from_tomb_no1.jpg" }
    - { url: /images/extra/han-dynasty-2.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Western Han jade burial suit", source: "https://commons.wikimedia.org/wiki/File:Western_Han_Jade_Burial_Suit_-_2.jpg" }
    - { url: /images/extra/han-dynasty-3.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "The Bronze Galloping Horse of Gansu, Eastern Han dynasty", source: "https://commons.wikimedia.org/wiki/File:Eastern_Han_Bronze_Galloping_Horse_(10094802964).jpg" }
    - { url: /images/extra/han-dynasty-4.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Fragments of early Han-era hemp paper", source: "https://commons.wikimedia.org/wiki/File:Han_Paper_(9947870685).jpg" }
- id: gojoseon
  description: The first kingdom of ancient Korea, traditionally established in the Liaoning and northwestern Korean Peninsula around the Taedong River basin. Developing a distinctive Bronze and Iron Age culture characterized by mandolin-shaped daggers and dolmen tombs, Gojoseon challenged Yan and Han China before falling to Emperor Wu of Han in 108 BCE.
  extra_images:
    - { url: /images/extra/gojoseon-1.webp, credit: "Ismoon, CC BY-SA 4.0, via Wikimedia Commons", caption: "Korean-type slender bronze dagger and mirror of the late Gojoseon period (National Museum of Korea)", source: "https://commons.wikimedia.org/wiki/File:Korean-type_bronze_dagger_and_mirror.National_Museum_of_Korea.jpg" }
    - { url: /images/extra/gojoseon-2.webp, credit: "Gary Lee Todd, CC BY-SA 4.0, via Wikimedia Commons", caption: "Bronze mirror with fine geometric decoration, Gojoseon period (National Museum of Korea)", source: "https://commons.wikimedia.org/wiki/File:Bronze_mirror._Gojoseon_period._D._11.2_cm._National_Museum_of_Korea.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=qmATYjagXMg
      title: "The History of Korea (Ancient Kingdoms to Modern Korea)"
      credit: Relaxing Asian History, YouTube
- id: korean-jin
  description: An ancient proto-Korean confederacy that occupied the southern half of the Korean Peninsula during the 2nd and 3rd centuries BCE. Acting as an agricultural and iron-producing trade nexus between northern Korea and the Japanese archipelago, Jin was the foundational predecessor to the subsequent Samhan confederacies (Mahan, Jinhan, and Byeonhan).
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=vB0dz7XkHXA
      title: "Jin-guk (辰國) was an ancient state that existed before the period of the Three Han"
      credit: koreahistoryteller_KHT, YouTube
- id: byeonhan
  description: One of the three Samhan confederacies of southern Korea, situated along the Nakdong River valley in the southeastern peninsula. Renowned across East Asia for exceptionally rich iron mines, Byeonhan exported high-quality raw iron ingots and weaponry to northern commanderies and Yayoi Japan, evolving into the Gaya confederacy.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xBPLoQC-bto
      title: "Samhan (The Three Hans): 진한 Jinhan; 마한 Mahan; 변한 Byeonhan"
      credit: Korean History 한국사, YouTube
- id: jinhan
  description: One of the Samhan confederacies of southeastern Korea, occupying the valley basins east of the Nakdong River. Composed of twelve walled town-statelets skilled in sericulture and ironworking, Jinhan integrated immigrants from northern commanderies and Gojoseon, eventually developing into the ancient kingdom of Silla.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GnDdkFjF-m8
      title: "Korean Three Kingdoms Period explained (History of Korea)"
      credit: Epimetheus, YouTube
- id: mahan
  description: The largest and most powerful of the three Samhan confederacies, comprising over fifty walled town-statelets across southwestern Korea (modern Gyeonggi, Chungcheong, and Jeolla). An advanced rice-farming society organized around sacred ritual precincts (sodo), Mahan was gradually united by one of its constituent member tribes to form the kingdom of Baekje.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=xBPLoQC-bto
      title: "Samhan (The Three Hans): 진한 Jinhan; 마한 Mahan; 변한 Byeonhan"
      credit: Korean History 한국사, YouTube
- id: dongye
  description: An ancient tribal state of the Ye people located along the central eastern coast of the Korean Peninsula in modern Gangwon province. Governed by village headmen without a central monarch, Dongye was celebrated for marine agriculture, hunting, fine horse breeding, and distinctive terraced longhouses before being absorbed by Goguryeo.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=wP0SMYirSoc
      title: "Okjeo & Dongye (Ancient Korean States)"
      credit: Korean History 한국사, YouTube
- id: dong-okjeo
  description: An ancient tribal state of the Okjeo people located along the narrow coastal strip and mountain valleys of northeastern North Korea and southeastern Manchuria. Dependent on agriculture, fishing, and cloth production, Dong-okjeo lacked a unified king and was repeatedly subjected to tributary subjugation by neighboring Gojoseon, Han commanderies, and expanding Goguryeo.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=wP0SMYirSoc
      title: "Okjeo & Dongye (Ancient Korean States)"
      credit: Korean History 한국사, YouTube
- id: goguryeo
  description: A powerful ancient kingdom of northern Korea and southern Manchuria, traditionally founded in 37 BCE in the rugged mountain valleys of the Yalu River basin. Renowned for fierce martial culture, heavily armored cataphract cavalry, and impregnable mountain fortresses, Goguryeo expanded into a dominant regional empire, becoming one of the Three Kingdoms of Korea.
  extra_images:
    - { url: /images/extra/goguryeo-1.webp, credit: "xiquinhosilva, CC BY 2.0, via Wikimedia Commons", caption: "Excavated remains at Wunü Mountain City near Huanren, Liaoning, thought to be Jolbon, the first capital of Goguryeo", source: "https://commons.wikimedia.org/wiki/File:Wunu_Mountain_City_(54438912954).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GpkAsdH78l4
      title: "Goguryeo: The Three Kingdoms Period"
      credit: From History, YouTube
- id: xiongnu
  description: A formidable pastoral nomadic confederation that unified the Mongolian steppe under Modu Chanyu in the late 3rd century BCE. Fielding hundreds of thousands of horse archers, the Xiongnu built the first great nomadic empire in Inner Asia, extracting trade and tribute from Han China and prompting the construction of the Great Wall.
  image_url: /images/civilisations/xiongnu.webp
  image_credit: AI-generated illustration
  image_caption: "Xiongnu seasonal encampment on the Mongolian steppe with felt yurts, four-wheeled wagons, horse archers, a bronze ritual cauldron, and grazing livestock"
  extra_images:
    - { url: /images/extra/xiongnu-1.webp, credit: "Public domain, via Wikimedia Commons", caption: "Masterpiece Xiongnu embroidered wool and silk textile from Noin-Ula kurgan 6, depicting a winged griffin attacking an elk, 1st century BCE (Hermitage Museum)", source: "https://commons.wikimedia.org/wiki/File:Noin-Ula_carpet.jpg" }
    - { url: /images/extra/xiongnu-2.webp, credit: "Public domain, via Wikimedia Commons", caption: "Embroidered silk hanging from Noin-Ula kurgan 31 depicting a Xiongnu nobleman and priest standing before a sacred fire altar (Hermitage)", source: "https://commons.wikimedia.org/wiki/File:Noin-Ula_nobleman_and_priest_over_fire_altar.jpg" }
    - { url: /images/extra/xiongnu-3.webp, credit: "PHGCOM, CC BY-SA 3.0, via Wikimedia Commons", caption: "Openwork bronze animal-style belt buckle depicting two intertwined horses/predators, 3rd–1st century BCE (British Museum)", source: "https://commons.wikimedia.org/wiki/File:BeltBuckleOrdos3-1CenturyBCE3.JPG" }
    - { url: /images/extra/xiongnu-4.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Xiongnu nomadic cast bronze ritual cauldron with mushroom-lug handles and ribbed pedestal foot (Erlianhot Dinosaur Museum)", source: "https://commons.wikimedia.org/wiki/File:Xiongnu_Bronze_Cauldron_(34870188744).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bFpQjWtpHcM
      title: "Huns: The Origin"
      credit: Kings and Generals, YouTube
- id: yuezhi
  description: An ancient Indo-European pastoral nomadic confederation that originally dominated the grasslands and oasis corridors of the Hexi Corridor in modern Gansu. Driven westward across Central Asia after defeats by the Xiongnu, the Yuezhi conquered Greco-Bactria and eventually settled in northern India to establish the magnificent Kushan Empire.
  extra_images:
    - { url: /images/extra/yuezhi-1.webp, credit: "zbig58, CC BY-SA 2.0, via Wikimedia Commons", caption: "Painted clay portrait from the palace at Khalchayan, Uzbekistan, 1st century BCE, thought to show a Yuezhi noble", source: "https://commons.wikimedia.org/wiki/File:Khalchayan_portrait,_1st_century_BCE.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=2KdM6AlyLUY
      title: "Yuezhi Migration and Kushan Empire - Nomads DOCUMENTARY"
      credit: Kings and Generals, YouTube
- id: minyue
  description: An ancient Baiyue kingdom located in the mountainous coastal river valleys of modern Fujian province in southeastern China. Flourishing from the 4th to late 2nd century BCE, Minyue maintained fortified towns, specialized metallurgy, and maritime trade before being annexed by Emperor Wu of Han.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=kATDlKZNzTY
      title: "Minyue Ancient Fujian"
      credit: Knowledge=fun, YouTube
- id: nanyue
  description: An independent kingdom established in 204 BCE by the Qin general Zhao Tuo, spanning southern China and northern Vietnam (Guangdong, Guangxi, and northern Vietnam) with its capital at Panyu (modern Guangzhou). Blending Han Chinese administrative methods with indigenous Baiyue culture, Nanyue prospered through maritime trade until annexed by Emperor Wu of Han in 111 BCE.
  extra_images:
    - { url: /images/extra/nanyue-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "The silk-and-jade burial suit of Zhao Mo, second king of Nanyue, from his tomb in Guangzhou, 2nd century BCE (Museum of the Mausoleum of the Nanyue King)", source: "https://commons.wikimedia.org/wiki/File:Jade_Burial_Suit_of_Zhao_Mo,_King_of_Nanyue.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=a8FT2cBLaYs
      title: "Who Built Guangzhou: The General Who Founded a Kingdom (Zhao Tuo & Nanyue)"
      credit: WeDiscoverChina, YouTube
- id: western-chu
  description: The dominant hegemony established in 206 BCE by the warlord Xiang Yu after the fall of the Qin dynasty, centered at Pengcheng (modern Xuzhou). Declaring himself the Hegemon-King of Western Chu, Xiang Yu partitioned China into the Eighteen Kingdoms, waging a monumental four-year war against Liu Bang before his defeat at the Battle of Gaixia.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=G1GRkTqIMgM
      title: "Chu–Han Contention: The War That Created the Han Dynasty | Part 1"
      credit: Armies of History, YouTube
- id: chu
  description: A major southern powerhouse along the Yangtze and Han river valleys during the Zhou dynasty, with its capital at Ying in modern Hubei. Developing a rich, distinct culture characterized by elaborate bronze metallurgy, lacquerware, and Daoist poetic traditions, Chu expanded aggressively to become one of the most formidable Seven Warring States.
  extra_images:
    - { url: /images/extra/chu-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze tallies of Lord Qi of E with gold-inlaid inscriptions, travel permits issued by the king of Chu in 323 BCE (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:Warring_States_Bronze_Tallies_(9830808744).jpg" }
    - { url: /images/extra/chu-2.webp, credit: "Sharkman, CC BY-SA 3.0, via Wikimedia Commons", caption: "The Guodian bamboo slips from a Chu tomb, about 300 BCE, among the oldest manuscripts of Daoist and Confucian texts (Hubei Provincial Museum)", source: "https://commons.wikimedia.org/wiki/File:TaiYiShengShui1.jpg" }
    - { url: /images/extra/chu-3.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Lacquered shield from the state of Chu, Warring States period (Hubei Provincial Museum)", source: "https://commons.wikimedia.org/wiki/File:Warring_States_Lacquered_Shield,_Chu_State_(10161968595).jpg" }
    - { url: /images/extra/chu-4.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Lacquered wooden dou (stem dish) from the state of Chu (Hubei Provincial Museum)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Lacquered_Dou,_Chu_State_(10162825136).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=x-3OYFbFOZY
      title: "Chu State: A Feudal State in the Yangtze River Basin During the Pre-Qin Period"
      credit: knowl card, YouTube
- id: qi
  description: A wealthy and powerful maritime state in modern Shandong, founded in the 11th century BCE for the grand strategist Jiang Ziya. Blessed with rich coastal sea salt and silk industries, Qi established early hegemony under Duke Huan and prime minister Guan Zhong, later founding the renowned Jixia Academy of scholarly debate.
  extra_images:
    - { url: /images/extra/qi-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze lamp of a figure holding two dishes, state of Qi, Warring States period, found in Shandong (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:Warring_States_Bronze_Lamp.jpg" }
    - { url: /images/extra/qi-2.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze knife money of the state of Qi, Warring States period (Xianyang Museum)", source: "https://commons.wikimedia.org/wiki/File:Warring_States_Bronze_Knife_Coin,_Qi_State_(9910610323).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=fn3wTsVbllg
      title: "Qi State: An Important Vassal State in Pre-Qin Period"
      credit: knowl card, YouTube
- id: jin
  description: The dominant northern super-state of the Spring and Autumn period, occupying modern Shanxi and northern Henan. Under Duke Wen of Jin, the state served as hegemon (ba) defending the central Zhou states against southern Chu expansion, until internal clan rivalries famously partitioned Jin into Han, Zhao, and Wei in 403 BCE.
  extra_images:
    - { url: /images/extra/jin-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze ding with a tiger head and a lid, state of Jin, Spring and Autumn period (Shanxi Museum)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Yi-shaped_Ding_with_Tiger_Head,_Jin_State_1a.jpg" }
    - { url: /images/extra/jin-2.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze hu wine jar with chain handle, state of Jin, Spring and Autumn period (Shanxi Museum)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Hu,_Jin_State.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=aKtXjLbqWBM
      title: "The Six Ministers of Jin State: Military and Political System of Jin in the Spring and Autumn Period"
      credit: knowl card, YouTube
- id: yan
  description: A major northeastern frontier kingdom centered at modern Beijing, established at the start of the Western Zhou dynasty by the Duke of Shao. Guarding the northern borders against Steppe nomads and trading with Manchuria and Korea, Yan constructed extensive early walls and endured as one of the Seven Warring States until Qin conquest.
  extra_images:
    - { url: /images/extra/yan-1.webp, credit: "Baomi, CC BY-SA 4.0, via Wikimedia Commons", caption: "Bronze knife money of the state of Yan (Capital Museum, Beijing)", source: "https://commons.wikimedia.org/wiki/File:Knife-shaped_Money_of_the_Yan_State.jpg" }
    - { url: /images/extra/yan-2.webp, credit: "BabelStone, CC BY-SA 3.0, via Wikimedia Commons", caption: "Roof tile end with an animal mask from Yan Xiadu, the lower capital of the state of Yan, Warring States period", source: "https://commons.wikimedia.org/wiki/File:Warring_states_roof_tile_end_2.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=uQt3k9QfLBs
      title: "King Zhao of Yan, Monarch of Yan State during the Warring States Period"
      credit: knowl card, YouTube
- id: zhao
  description: A powerful northern kingdom among the Seven Warring States, formed from the partition of Jin in modern Shanxi and Hebei. Under King Wuling, Zhao revolutionized Chinese warfare by adopting nomadic cavalry tactics and clothing ('Hu clothing and mounted archery'), defending northern frontiers against Steppe nomads until crushed by Qin at the catastrophic Battle of Changping.
  extra_images:
    - { url: /images/extra/zhao-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze spade money of the state of Zhao, Warring States period (Shanxi Museum)", source: "https://commons.wikimedia.org/wiki/File:Zhao_State_Spade_Coin_(10110069913).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=i-D5NtE6c4M
      title: "Zhao Bao: A Historical and Political Figure of Zhao State"
      credit: knowl card, YouTube
- id: wei
  description: One of the Seven Warring States created from the partition of Jin, occupying the fertile central Yellow River plains of modern Shanxi and Henan. Under Marquis Wen and the Legalist reforms of Li Kui, Wei became the premier military and economic superpower of the early Warring States before facing defeats against Qin and Qi.
  extra_images:
    - { url: /images/extra/wei-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze spade money of the state of Wei, Warring States period (Henan Museum)", source: "https://commons.wikimedia.org/wiki/File:Warring_States_Spade-shaped_Coins_of_Wei_State.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Gp0b316IdD4
      title: "Wei State One of the Seven Powers of the Warring States Period"
      credit: knowl card, YouTube
- id: han
  description: One of the Seven Warring States, established in 403 BCE when three noble families partitioned the great state of Jin in modern Henan and Shanxi. Positioned strategically in the central plains, Han was an advanced center of iron weaponry and crossbow manufacture, but its small size left it vulnerable to conquest by neighboring Qin in 230 BCE.
  extra_images:
    - { url: /images/extra/han-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze spade money of the state of Han, Warring States period (Shanxi Museum)", source: "https://commons.wikimedia.org/wiki/File:Han_State_Spade_Coin_(10110029956).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=iq7pUMqxSAY
      title: "The Rise and Fall of the House of Han 韩国 (403 BC - 230 BC)"
      credit: Bedtime history of ancient China, YouTube
- id: lu
  description: An influential Zhou vassal state in modern Shandong, founded by Boqin, the son of the revered Duke of Zhou. Celebrated as the cultural heartland of classical ritual, historical chronicle keeping, and moral philosophy, Lu was the birthplace of Confucius, preserving ancient Zhou rites long after other states had abandoned them.
  extra_images:
    - { url: /images/extra/lu-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze gui made by an official of Lu as a dowry gift, state of Lu, Spring and Autumn period, found in Shandong", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Gui_(9831260353).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Ly5Emk2bG3M
      title: "Lu State Important Vassal State Relics of the Zhou Dynasty"
      credit: knowl card, YouTube
# Batch 5B: Spring & Autumn States and Chu-Han Eighteen Kingdoms
- id: cai
  description: An ancient Chinese vassal state founded in the 11th century BCE by a younger brother of King Wu of Zhou in modern Henan. Positioned precariously between the central plains and the expanding southern power of Chu, Cai survived centuries of border conflicts through shifting alliances before final annexation by Chu in 447 BCE.
  extra_images:
    - { url: /images/extra/cai-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze square hu of Shen, Marquis of Cai, from his tomb in Shouxian, Anhui, Spring and Autumn period (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Fanghu_(9830926843).jpg" }
    - { url: /images/extra/cai-2.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze dagger-axe (ge) of Prince Jia of Cai, inlaid with an inscription, late Spring and Autumn period (Shanghai Museum)", source: "https://commons.wikimedia.org/wiki/File:Late_Spring_&_Autumn_Bronze_Ge_(10180080346).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GZ_lSXv4Psg
      title: "The Western Zhou Dynasty and the Spring and Autumn Period - Explained"
      credit: GatesOfKilikien, YouTube
- id: cao
  description: A regional vassal state of the Western Zhou and Spring and Autumn periods, established in the 11th century BCE in modern western Shandong. Governed by descendants of King Wen of Zhou from their capital at Taoqiu, Cao prospered as an agricultural trade hub before being conquered by the neighboring State of Song in 487 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bABIasJP48k
      title: "The Spring and Autumn & Warring States Periods: A History of China: PART ONE"
      credit: Hui Podcast, YouTube
- id: chen
  description: An ancient Zhou vassal state situated in modern eastern Henan, traditionally founded by Duke Hu as descendants of the legendary sage-king Shun. Serving as a cultural buffer between northern Zhou states and the southern realm of Chu, Chen maintained distinctive shamanic religious traditions until its absorption by Chu in 478 BCE.
  extra_images:
    - { url: /images/extra/chen-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze hu made by the Marquis of Chen as a dowry for his daughter, Spring and Autumn period (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Hu_(9831717185).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bABIasJP48k
      title: "The Spring and Autumn & Warring States Periods: A History of China: PART ONE"
      credit: Hui Podcast, YouTube
- id: qin
  description: A rugged frontier state in the western Wei River valley of modern Shaanxi, traditionally tasked with breeding warhorses and defending Zhou frontiers against nomadic tribes. Implementing radical Legalist reforms under Shang Yang, Qin developed a meritocratic military and centralized bureaucracy that ultimately conquered all rival states to unify China in 221 BCE.
  extra_images:
    - { url: /images/extra/qin-1.webp, credit: "Anagoria, CC BY 3.0, via Wikimedia Commons", caption: "The Qin Gong gui, a bronze food vessel cast for a duke of Qin with an inscription on his ancestors, Spring and Autumn period (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:-0770_-0403_Qin_Gong_Bronze_Gui_(food_container)_Spring_and_Autumn_Period_National_Museum_of_China_anagoria.jpg" }
    - { url: /images/extra/qin-2.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze dagger-axe (ge) of the state of Qin, cast in 243 BCE under the chancellor Lü Buwei (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:Warring_States_Bronze_Ge_-_2.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Vmiv4zAeeAA
      title: "The Architect of Qin’s Rise | ChineseHistory"
      credit: Sino Epochs, YouTube
- id: song
  description: An ancient central plains state in modern eastern Henan, granted by the Zhou kings to the surviving royal nobility of the defeated Shang dynasty to maintain ancestral rites. Famed for its merchant commerce and ethical adherence to ancient chivalric codes, Song was satirized in philosophical fables before being partitioned by Qi, Chu, and Wei.
  extra_images:
    - { url: /images/extra/song-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Inscribed bronze dagger-axe (ge) of Duke Luan of Song, Spring and Autumn period (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Decorated_Ge_Dagger-axe.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bABIasJP48k
      title: "The Spring and Autumn & Warring States Periods: A History of China: PART ONE"
      credit: Hui Podcast, YouTube
- id: teng
  description: A minor aristocratic vassal state situated in modern southern Shandong during the Spring and Autumn and Warring States periods. Despite its modest territory and vulnerability to powerful neighbors, Teng was celebrated by the philosopher Mencius as a model virtuous kingdom that governed through benevolence and classical rites before conquest by Song.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GZ_lSXv4Psg
      title: "The Western Zhou Dynasty and the Spring and Autumn Period - Explained"
      credit: GatesOfKilikien, YouTube
- id: wey
  description: A resilient central plains state along the Yellow River in modern northern Henan, founded by Kangshu, a younger brother of King Wu of Zhou. Renowned for poetry preserved in the Book of Songs and commercial craftsmanship, Wey survived as a small buffer state longer than any other, persisting until Qin annexation in 209 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=GZ_lSXv4Psg
      title: "The Western Zhou Dynasty and the Spring and Autumn Period - Explained"
      credit: GatesOfKilikien, YouTube
- id: wu
  description: A dynamic maritime and riverine kingdom in the lower Yangtze delta of modern Jiangsu, centered around modern Suzhou. Expanding rapidly in the late Spring and Autumn period with the strategic advice of Sun Tzu, Wu dominated regional waterways with specialized navies and prized cast-bronze swords before being conquered by neighboring Yue in 473 BCE.
  extra_images:
    - { url: /images/extra/wu-1.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Hilt of the bronze sword of Fuchai, the last king of Wu, found in Huixian, Henan (National Museum of China)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Jian_(Sword)_(9831617575).jpg" }
    - { url: /images/extra/wu-2.webp, credit: "Augusthaiho, CC BY-SA 4.0, via Wikimedia Commons", caption: "Spear of King Fuchai of Wu, inscribed 'made by Fuchai, King of Wu, for his own use', found in a tomb at Jiangling (Hubei Provincial Museum)", source: "https://commons.wikimedia.org/wiki/File:吴王夫差剑05096.jpg" }
    - { url: /images/extra/wu-3.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze sword of King Guang (Helü) of Wu, late Spring and Autumn period (Shanghai Museum)", source: "https://commons.wikimedia.org/wiki/File:Late_Spring_&_Autumn_Bronze_Jian_(10180019235).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bvFJvfSfE60
      title: "Sun Tzu and the King’s Concubines: Discipline Above All"
      credit: A bit of all, YouTube
- id: xu
  description: An ancient non-Zhou Huaiyi confederation and state based along the Huai River valley in modern Anhui and Jiangsu. Under charismatic rulers like King Yan of Xu, the state challenged Western Zhou supremacy and spread distinctive southeastern bronze culture before being conquered by the expanding state of Wu in 512 BCE.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=bABIasJP48k
      title: "The Spring and Autumn & Warring States Periods: A History of China: PART ONE"
      credit: Hui Podcast, YouTube
- id: zheng
  description: An influential central plains vassal state founded in the late Western Zhou in modern Henan, centered on the commercial capital of Xinzheng. Under the astute leadership of Duke Zhuang, Zheng was the first state to challenge royal Zhou authority, pioneering the interstate balance of power during the early Spring and Autumn period.
  extra_images:
    - { url: /images/extra/zheng-1.webp, credit: "G41rn8, CC BY-SA 4.0, via Wikimedia Commons", caption: "The 'lotus and crane' square hu from Xinzheng, capital of the state of Zheng, Spring and Autumn period (Henan Museum)", source: "https://commons.wikimedia.org/wiki/File:Henan_Museum_2006_9-10.jpg" }
    - { url: /images/extra/zheng-2.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Sets of bronze ding, li and gui from the tomb of a ruler of Zheng at Xinzheng, excavated in 1997 (Zhengzhou Museum)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Dings,_Li,_&_Gui,_from_Tomb_of_King_of_Zheng_State,_Xinzheng,_1997.jpg" }
    - { url: /images/extra/zheng-3.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "A set of bronze bells from Zheng, Spring and Autumn period (Zhengzhou Museum)", source: "https://commons.wikimedia.org/wiki/File:Spring_&_Autumn_Bronze_Niu_Bells,_Zheng_State.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=Z7VIycwTieU
      title: "Duke Zhuang of Zheng: China’s First Hegemon"
      credit: Josh Lin, YouTube
- id: zhu
  description: A minor regional state in modern southwestern Shandong ruled by the Cao lineage, also known historically as Zhulou or Zou. Located near the cultural heartland of Lu, the state maintained close ties to Confucian traditions and is celebrated as the ancestral birthplace of the influential philosopher Mencius before annexation by Chu.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=_5bobS0DGF0
      title: "Zhu Hai A Warrior of the Warring States Period"
      credit: knowl card, YouTube
- id: yue
  description: An ancient indigenous kingdom centered south of the Yangtze River around modern Zhejiang and northern Fujian, famed for seafaring, aquaculture, and peerless bronze sword metallurgy. Under King Goujian, Yue rebounded from near destruction to conquer its bitter northern rival Wu in 473 BCE, briefly achieving hegemony before succumbing to Chu.
  extra_images:
    - { url: /images/extra/yue-1.webp, credit: "Siyuwj, CC BY-SA 4.0, via Wikimedia Commons", caption: "The Sword of Goujian, king of Yue, still sharp and untarnished when found in a Chu tomb in 1965 (Hubei Provincial Museum)", source: "https://commons.wikimedia.org/wiki/File:Sword_of_Goujian,_Hubei_Provincial_Museum,_2015-04-06_01.jpg" }
    - { url: /images/extra/yue-2.webp, credit: "Discott, CC BY-SA 3.0, via Wikimedia Commons", caption: "Kneeling figure with tattoos from the state of Yue (Zhejiang Provincial Museum, Hangzhou)", source: "https://commons.wikimedia.org/wiki/File:Yue_statue.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=mAWkFpkROgw
