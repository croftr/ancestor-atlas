    - { url: /images/extra/indus-valley-civilization-2.webp, credit: "Gary Todd, CC0, via Wikimedia Commons", caption: "Bronze statuette of the 'Dancing Girl' from Mohenjo-daro, adorned with bangles and resting a hand on her hip (National Museum, New Delhi)", source: "https://commons.wikimedia.org/wiki/File:Bronze_%22Dancing_Girl,%22_Mohenjo-daro,_c._2500_BC.jpg" }
