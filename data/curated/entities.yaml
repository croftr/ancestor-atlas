- id: zhongshan
  description: A unique kingdom in the central plains of modern Hebei, founded by the semi-nomadic White Di (Baidi) pastoralists during the Warring States period. Remarkably synthesizing Steppe nomadic traditions with sophisticated Zhou ritual culture and bronze casting, Zhongshan built fortified capitals and resisted Zhao and Wei invasions for over a century before falling in 296 BCE.
  extra_images:
    - { url: /images/extra/zhongshan-1.webp, credit: "Windmemories, CC BY-SA 4.0, via Wikimedia Commons", caption: "Silver-inlaid bronze winged beasts from the tomb of King Cuo of Zhongshan at Pingshan, 4th century BCE (Hebei Museum)", source: "https://commons.wikimedia.org/wiki/File:20250118_Bronze_Mythical_Winged_Beasts_Inlaid_with_Silver_01.jpg" }
    - { url: /images/extra/zhongshan-2.webp, credit: "Windmemories, CC BY-SA 4.0, via Wikimedia Commons", caption: "Gold- and silver-inlaid bronze stand in the form of a tiger devouring a deer, from the tomb of King Cuo of Zhongshan (Hebei Museum)", source: "https://commons.wikimedia.org/wiki/File:20250118_Bronze_Stand_in_the_Form_of_a_Tiger_Devouring_a_Deer.jpg" }
