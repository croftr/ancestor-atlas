- id: ertebolle
  name: Ertebølle culture
  category: culture
  start_year: -5399
  end_year: -3949
  description: "By about seven thousand years ago the sea had nearly reached today's level, and the drowned valleys of Denmark had become bays and fjords rich in fish and shellfish. The Ertebølle people lived on these new coasts. At the type site on the Limfjord they left a great mound of oyster and mussel shells, and at Tybrind Vig their dugout canoes and carved paddles survive under the sea. They made pots with pointed bases while still living by hunting and fishing, and traded with the farmers to the south, until around six thousand years ago they took up farming too."
  narration: { src: narration/cultures/ertebolle-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "56b378561d" }
