      src: https://www.youtube.com/watch?v=GPqxeNQWFHk
      title: From Engine of War to Ancient Wonder - The Colossus of Rhodes DOCUMENTARY
      credit: Invicta, YouTube
- id: nabataeans
  description: An ancient Arab seafaring and caravan trading civilization that dominated the desert crossroads of the southern Levant and northern Arabia. Master hydrologists, they transformed their capital at Petra into a thriving trading hub carved directly into sandstone cliffs, controlling vital incense routes before Roman annexation.
  image_url: /images/civilisations/nabataean-kingdom.webp
  image_caption: Rock-cut sandstone facade of Petra along the Nabataean incense caravan route with camel traders, hydraulic water channels, and fine painted ceramics.
  image_credit: AI-generated illustration
  extra_images:
