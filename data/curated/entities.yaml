    - { url: /images/extra/kingdom-of-urartu-3.webp, credit: "Beko, CC BY-SA 4.0, via Wikimedia Commons", caption: "Silver drinking horn rhyton shaped as a horseman from the fortress citadel of Erebuni, Yerevan (Erebuni Museum)", source: "https://commons.wikimedia.org/wiki/File:Erebuni_achaemenid_rhyton_1_mus.jpg" }
