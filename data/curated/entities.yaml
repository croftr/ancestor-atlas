- id: mauretania
  description: An ancient Berber kingdom spanning the Mediterranean Atlantic coast of northwestern Africa (modern northern Morocco and western Algeria). Ruled by Mauri kings like Bocchus I and later the Hellenized monarch Juba II, the realm was celebrated for horse cavalry, purple dye production, and Roman alliance before annexation by Emperor Claudius.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=0AMVjh0I7b4
      title: "Kingdom of Mauretania: Exploring the Ancient Realm of North Africa"
      credit: TimelessTreasury, YouTube
- id: kingdom-of-numidia
  description: A powerful ancient Berber kingdom in northwest Africa (modern Algeria and parts of Tunisia), forged through the unification of the Massylii and Masaesyli tribes under King Masinissa. Famed across antiquity for agile light cavalry that served decisively in the Punic Wars, Numidia clashed famously with the Roman Republic during the Jugurthine War.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=YTObOpc6Kt0
      title: Intriguing History of the Berber Kingdom of Numidia
      credit: Yohannes, YouTube
- id: sumerian-city-states
  description: "In the river plains of southern Mesopotamia, cities such as Uruk, Ur and Lagash grew in the late fourth millennium BCE into the world's first urban civilization. Sumerian scribes invented cuneiform writing on clay tablets, temple communities raised stepped ziggurats, and canals turned the dry plain into rich farmland. The city-states fought one another over water and land for centuries, fell under Akkadian and later Babylonian rule, and by about 1750 BCE had lost their independence, though their language lived on in temples and schools."
  narration: { src: narration/civilizations/sumerian-city-states-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "523b4fd799" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=YPioTRAOAvU
      title: "Ancient Mesopotamia: The First Cities in History | Sumer and the Urban Revolution"
      credit: Topicus History, YouTube
  extra_images:
