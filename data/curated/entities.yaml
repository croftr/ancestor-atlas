    - { url: /images/extra/sabaeans-3.webp, credit: "Marie-Lan Nguyen, public domain, via Wikimedia Commons", caption: "Alabaster funerary stele carved with a stylized portrait face and Old South Arabian Sabaean boustrophedon script (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Stele_Iglum_Louvre_AO1029.jpg" }
