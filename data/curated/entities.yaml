- id: early-dynastic-period-of-egypt
  description: The formative era of unified Egyptian civilization (First and Second Dynasties) following the unification of Upper and Lower Egypt under Narmer. Governing from the royal seat of Thinis and Memphis, this period consolidated divine kingship, codified hieroglyphic writing, established mortuary complexes at Abydos, and laid the foundations of pharaonic statecraft.
  image_url: /images/civilisations/early-dynastic-egypt.webp
  image_credit: AI-generated illustration
  image_caption: "An early pharaoh before the whitewashed serekh palace facade at Memphis, with scribes recording cattle counts and mastaba tombs on the plateau"
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=98wiu5DEABU
      title: "The Early Dynastic Period: A Complete Overview (3150 BC–2686 BC)"
      credit: Made In History, YouTube
- id: old-kingdom-of-egypt
  description: Celebrated as the 'Age of the Pyramids', the Old Kingdom (Third to Sixth Dynasties) was an era of dynamic internal security, centralized pharaonic power, and monumental building along the Nile. Governed from Memphis, pharaohs marshaled royal labor to erect the Great Pyramids and the Sphinx at Giza, institutionalizing enduring religious and funerary traditions.
  image_url: /images/civilisations/old-kingdom.webp
  image_credit: AI-generated illustration
  image_caption: "Construction of the Great Pyramid of Giza, showing teams of builders hauling stone on sledges and masons dressing Tura limestone casing beside the Sphinx"
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=vMieWZwJpDE
      title: "The Old Kingdom: A Complete Overview (2686 BC–2181 BC)"
      credit: Made In History, YouTube
- id: middle-kingdom-of-egypt
  description: The golden age of classical Egyptian civilization (Eleventh to Thirteenth Dynasties), reunified by Mentuhotep II following the First Intermediate Period. Ruled from Thebes and Itjtawy, this era is revered for classical Egyptian literature, monumental irrigation projects in the Faiyum oasis, fortress architecture in Nubia, and an expressive, reflective royal art style.
  image_url: /images/civilisations/middle-kingdom.webp
  image_credit: AI-generated illustration
  image_caption: "Middle Kingdom Nile estate with domed granaries, canal excavation, scribes recording agricultural yields, and rock-cut tombs at Beni Hasan"
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=8OrAJdwJ9sI
      title: "Ancient Egypt Part 2: The Middle Kingdom (2000 – 1500 BCE)"
      credit: Professor Dave Explains, YouTube
- id: hyksos
  description: Rulers of Levantine origin who established Egypt's Fifteenth Dynasty during the Second Intermediate Period, ruling from their fortified capital of Avaris in the eastern Nile Delta. Their presence introduced horse-drawn chariots, composite bows, and improved bronze metallurgy into Egypt before their expulsion by native Theban pharaohs.
  image_url: /images/civilisations/hyksos.webp
  image_credit: AI-generated illustration
  image_caption: "The Delta capital of Avaris blending Canaanite and Egyptian culture, with horse-drawn chariots, bronze weapon smiths, and Syrian-style timber dwellings"
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=9K-ionaiu1s
      title: Ancient Egypt Dynasty by Dynasty - Dynasties XV & XVI - The Arrival of the Hyksos
      credit: History with Cy, YouTube
- id: new-kingdom-of-egypt
  description: "After driving out the Hyksos rulers of the north around 1550 BCE, the pharaohs of the New Kingdom made Egypt an imperial power reaching from Nubia to Syria. It was the age of Hatshepsut, Thutmose the Third, Akhenaten, Tutankhamun and Ramesses the Second, of the temples of Karnak and Luxor and the royal tombs in the Valley of the Kings. After about 1100 BCE, worn down by the Sea Peoples, by drought and by rivalry between priests and kings, the kingdom split apart."
  narration: { src: narration/civilizations/new-kingdom-of-egypt-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "2f9f0da219" }
  image_url: /images/civilisations/new-kingdom.webp
  image_credit: AI-generated illustration
  image_caption: "Thebes during the Opet Festival, with priests carrying the sacred barque of Amun-Ra from a temple pylon flanked by colossal statues of Ramesses II"
