      credit: Get to know with Kenzie, YouTube
- id: qataban
  description: An ancient South Arabian kingdom centered in the Baihan valley of western Yemen, with its capital at the merchant hub of Timna. Governed by sophisticated agricultural water codes and legal decrees, Qataban prospered by taxing trade along the incense route until eclipsed by neighboring Saba and Himyar.
  image_url: /images/civilisations/qataban.webp
  image_caption: Timna in the South Arabian Kingdom of Qataban, featuring the market law obelisk in Musnad script, alabaster funerary portraits, and frankincense camel caravans entering the South Gate.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/qataban-1.webp, credit: "Marie-Lan Nguyen, public domain, via Wikimedia Commons", caption: "Alabaster votive panel with an inscription in Qatabanic, dedicated by a man entrusted with his lord's finances (Louvre)", source: "https://commons.wikimedia.org/wiki/File:Inscribed_stele_Qataban_Louvre_AO21124.jpg" }
    - { url: /images/extra/qataban-2.webp, credit: "Mary Harrsch, CC BY-SA 4.0, via Wikimedia Commons", caption: "Alabaster head of a man from Qataban, 3rd–1st century BCE (Seattle Art Museum)", source: "https://commons.wikimedia.org/wiki/File:Head_of_a_man_Qataban_(Arabia_Felix)_3rd-1st_century_BCE_Alabaster_at_the_Seattle_Art_Museum.jpg" }
    - { url: /images/extra/qataban-3.webp, credit: "Bibliothèque nationale de France, public domain, via Wikimedia Commons", caption: "Silver drachm of the kingdom of Qataban, minted at Harib after Athenian models (Bibliothèque nationale de France)", source: "https://commons.wikimedia.org/wiki/File:Monnaie_-_Drachme,_argent,_Harib,_Arabie_Heureuse,_royaume_de_Qataban_-_btv1b85100403_(1_of_2).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=jSQevkWfMBM
      title: What Was Arabia Like Before Islam? | DOCUMENTARY
      credit: Para Bellum, YouTube
- id: kingdom-of-bithynia
  description: A Hellenistic kingdom located in northwestern Anatolia bordering the Sea of Marmara and the Black Sea, centered on cities like Nicomedia. Governed by a resilient local Thracian dynasty, Bithynia maintained autonomy against neighboring Diadochi kingdoms before its last king, Nicomedes IV, bequeathed the realm to the Roman Republic in 74 BCE.
  image_url: /images/civilisations/kingdom-of-bithynia.webp
  image_caption: Nicomedia on the Propontis in the Kingdom of Bithynia, showing King Prusias I examining silver tetradrachms beside covered ship-sheds and naval galleys beneath Mount Olympus.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/kingdom-of-bithynia-1.webp, credit: "ArchaiOptix, CC BY-SA 4.0, via Wikimedia Commons", caption: "Silver tetradrachm of Prusias I of Bithynia (228–182 BCE) (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Bithynia_-_king_Prusias_I_-_228-182_BC_-_silver_tetradrachm_-_head_of_Prusias_I_-_Zeus_-_London_BM_1993-0629-1.jpg" }
    - { url: /images/extra/kingdom-of-bithynia-2.webp, credit: "Cleveland Museum of Art, CC0, via Wikimedia Commons", caption: "Silver tetradrachm of Nicomedes II of Bithynia (149–127 BCE) (Cleveland Museum of Art)", source: "https://commons.wikimedia.org/wiki/File:Greece,_Bithynia,_reign_of_Nicomedes_II_-_Tetradrachm-_Nicomedes_II_(obverse)_-_1917.990.a_-_Cleveland_Museum_of_Art.jpg" }
