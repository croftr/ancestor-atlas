    - { url: /images/extra/antigonid-macedonia-4.webp, credit: "Classical Numismatic Group, CC BY-SA 2.5, via Wikimedia Commons", caption: "Silver tetradrachm of Perseus, the last king of Macedon (179–168 BCE)", source: "https://commons.wikimedia.org/wiki/File:Perseus_of_Macedonia_Tetradrachm_90060057.jpg" }
