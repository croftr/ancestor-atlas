    - { url: /images/extra/akkadian-empire-4.webp, credit: "Zunkir, CC BY-SA 4.0, via Wikimedia Commons", caption: "Akkadian cylinder seal and its rolled impression (Ashmolean Museum)", source: "https://commons.wikimedia.org/wiki/File:Cylinder_seal_Akkadian_AN1931.105.jpg" }
- id: assyria
  description: A major ancient Mesopotamian civilization centered along the upper Tigris River in modern northern Iraq. Spanning Old, Middle, and Imperial periods, Assyria developed into a formidable military and commercial power renowned for sophisticated statecraft, monumental palaces, and the preservation of vast cuneiform libraries.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=iz-Xxu7y_gQ
      title: "The Epic of Ancient Assyria - PART I: Early Ashur and the Old Assyrian Kingdom (c. 3000-1400 BC)"
      credit: History with Cy, YouTube
- id: babylonia
  description: An influential cultural and political state in central-southern Mesopotamia, centered on the ancient metropolis of Babylon along the Euphrates. Under Hammurabi and later dynasties, Babylonia became famed across the ancient world for its monumental architecture, astronomical scholarship, mathematical innovations, and enduring legal traditions.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=gJF_lYSREgc
      title: Rise of Babylon and Hammurabi - Ancient Mesopotamia DOCUMENTARY
      credit: Kings and Generals, YouTube
- id: first-sealand-dynasty
  description: An enigmatic dynasty of kings based in the marshlands and coastal plains of southern Mesopotamia, ruling independently of Babylonian control during the second millennium BCE. Preserving ancient Sumerian cultural traditions, the Sealand monarchs successfully resisted Kassite expansion until their territory was eventually incorporated into the Kassite Babylonian state.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=lzjbkMmpoq0
      title: The First Dynasty of the Sealand and the Last Days of the Old Babylonian Kingdom (c. 1730-1460 BC)
      credit: History with Cy, YouTube
- id: hittites
  description: "From their fortified capital of Hattusa in central Anatolia, the Hittites built one of the great powers of the Bronze Age. Their kings sacked Babylon around 1595 BCE, fought Egypt at the battle of Kadesh in 1274 BCE, and later sealed one of the earliest surviving peace treaties with Ramesses the Second. Thousands of clay tablets from their archives preserve the oldest written Indo-European language. Around 1180 BCE the empire collapsed and Hattusa was abandoned, in the wider upheaval at the end of the Bronze Age."
  narration: { src: narration/civilizations/hittites-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "b28fa1fd38" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=OusqE7gTUOI
      title: The Entire History Of The Hittites / Ancient History Documentary
      credit: History Time, YouTube
