  image_caption: Seuthopolis and Kazanlak in the Thracian Odrysian Kingdom, displaying the Panagyurishte gold treasure, bronze head of Seuthes III, peltast warriors, and painted Kazanlak tholos tomb.
  image_credit: AI-generated illustration
  extra_images:
