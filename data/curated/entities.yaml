  description: "Between 4000 and 3000 BCE a new way of life appeared on the coasts of northern Taiwan and quickly spread around the island. The Dapenkeng people made thick, cord-marked pottery and polished adzes, fished, gathered shellfish, and later grew rice and millet. They had crossed the Taiwan Strait from mainland China, and most scholars think they spoke early Austronesian languages, the family whose speakers would later sail from Taiwan to Madagascar, Hawaii and New Zealand."
  image_url: /images/cultures/dapenkeng.webp
