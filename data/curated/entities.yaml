- id: homo-naledi
  name: Homo naledi
  category: species
  start_year: -333050
  end_year: -234050
  description: "In 2013 cavers squeezed through a narrow chute in the Rising Star cave system in South Africa and found a chamber of bones. More than 1,500 fossils from at least fifteen individuals revealed Homo naledi, a small-brained human with curved fingers suited to climbing, yet hands and feet much like ours. It lived between about 335,000 and 236,000 years ago, showing that small-brained humans survived in Africa alongside early members of our own species."
