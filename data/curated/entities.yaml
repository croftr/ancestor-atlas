      credit: Fall of Civilizations, YouTube
- id: judea
  description: The mountainous biblical heartland in the southern Levant, which endured through Persian, Hellenistic, Hasmonean, and Roman periods. Centered on Jerusalem and the Second Temple, the province was a vibrant focal point of Jewish religious life and identity, marked by repeated uprisings against Seleucid and Roman imperial rule.
  image_url: /images/civilisations/judea.webp
  image_caption: Hasmonean and Herodian Jerusalem in Judea, showing priests examining bronze prutah coins and a stone menorah plaque overlooking the monumental Second Temple on the Temple Mount.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/judea-1.webp, credit: "Atzmonit, CC BY-SA 4.0, via Wikimedia Commons", caption: "Bronze prutah of the Hasmonean king Alexander Jannaeus (103–76 BCE), inscribed 'Jonathan the High Priest' in paleo-Hebrew", source: "https://commons.wikimedia.org/wiki/File:Alexander_Jannaeus_coin.JPG" }
    - { url: /images/extra/judea-2.webp, credit: "Bukvoed, CC BY 4.0, via Wikimedia Commons", caption: "Herodium, the fortress-palace Herod the Great built near Bethlehem and where he was buried", source: "https://commons.wikimedia.org/wiki/File:Herodium-091.jpg" }
    - { url: /images/extra/judea-3.webp, credit: "Carole Raddato, CC BY-SA 2.0, via Wikimedia Commons", caption: "The lower terrace of Herod's Northern Palace on the cliffs of Masada", source: "https://commons.wikimedia.org/wiki/File:The_lower_terrage_of_Herod's_Northern_Palace,_Masada,_Israel_(15024089754).jpg" }
