- id: hadhramaut
  description: An ancient South Arabian kingdom situated in the rugged coastal and valley regions of southern Yemen, centered on the fortified capital of Shabwa. Controlling valuable frankincense harvesting groves and coastal Indian Ocean trade ports, Hadhramaut played an indispensable role in international maritime and overland merchant networks.
