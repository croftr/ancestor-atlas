- id: homo-erectus
  name: Homo erectus
  category: species
  start_year: -1908050
  end_year: -100550
  description: "Homo erectus was the first human to spread far beyond Africa. At Dmanisi in Georgia, five skulls about 1.8 million years old show small-brained early members of the species already living at the gateway to Asia, and the 1.5-million-year-old Turkana Boy from Kenya had a tall, long-legged body much like ours. Makers of Acheulean handaxes, they reached China and Java and survived for nearly two million years, the last of them on Java around 110,000 years ago."
