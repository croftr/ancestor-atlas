# Span from English Wikipedia: Maglemosian_culture@1375962679.
- id: maglemosian
  name: Maglemosian culture
  category: culture
  start_year: -8999
  end_year: -5999
  description: "When the ice had gone, Britain was not yet an island. A wide, low plain, now called Doggerland, joined it to the Netherlands and Denmark, and the Maglemosian hunters, named after a Danish bog, lived along the lakes and rivers of northern Europe. At Star Carr in Yorkshire they built wooden platforms at a lake's edge and wore headdresses made from the skulls and antlers of red deer. As the sea rose the plain shrank, until by about eight thousand years ago it had drowned beneath the North Sea, where fishing boats still dredge up their tools."
