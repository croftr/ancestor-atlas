# Span from English Wikipedia: Wilton_culture@1378611874 (middle Holocene, ~8,000-4,000 years ago, after Deacon).
- id: wilton
  name: Wilton culture
  category: culture
  start_year: -6050
  end_year: -2050
  description: "From about 8,000 to 4,000 years ago, hunter-gatherers from the southern tip of Africa to Zimbabwe and Zambia made the small, carefully shaped stone tools archaeologists call Wilton, after a rock shelter on a farm in the Eastern Cape first dug in 1921: thumbnail-sized scrapers and backed pieces, probably fixed into arrows and other tools with ochre. They hunted smaller game and gathered more plants than the Oakhurst people before them, and on the south coast came to rely more and more on fish, seals and shellfish. Ostrich eggshell travelled hundreds of kilometres between groups, deep into the Drakensberg mountains."
  image_url: /images/cultures/wilton.webp
