  category: species
  start_year: -1998050
  end_year: -1098050
  description: "In 1959 Mary Leakey found a massive skull at Olduvai Gorge with huge flat molars and a bony crest along the top of the head, anchoring enormous chewing muscles. Nicknamed Nutcracker Man, Paranthropus boisei turned out to eat mostly grasses and sedges rather than nuts. It lived in East Africa for about a million years, side by side with early Homo, and then died out: a robust side branch of the human family rather than our ancestor."
