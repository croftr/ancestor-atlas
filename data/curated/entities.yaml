      src: https://www.youtube.com/watch?v=mwijpopq87k
      title: "The Other Albania: Lost Kingdom of the Caucasus"
      credit: Kings and Generals, YouTube
- id: caucasian-iberia
  description: An ancient Georgian kingdom centered on the fertile valley of the Kura River in modern eastern Georgia (Kartli), with its capital at Mtskheta. Strategically guarding key mountain passes between the Steppe, Rome, and Persia, Iberia developed a resilient cultural identity, officially embracing Christianity under King Mirian III around 337 CE.
  extra_images:
    - { url: /images/extra/caucasian-iberia-1.webp, credit: "U.S. Embassy Tbilisi, public domain, via Wikimedia Commons", caption: "Excavated foundations at Armaztsikhe on Bagineti hill above Mtskheta, the citadel of the kings of Iberia", source: "https://commons.wikimedia.org/wiki/File:2010_–_Conservation_of_Armaztsikhe_Archaeological_Site_in_Mtskheta_-_14060115801.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=5Y9Z77G6a5Y
      title: Pharasmanes of Iberia & Rhadamistus of Armenia
      credit: Stoic Historian, YouTube
- id: kingdom-of-adiabene
  description: An ancient client kingdom in Upper Mesopotamia centered at Arbela (modern Erbil), situated between the Roman and Parthian imperial frontiers. Notable for its cultural blend of Assyrian, Iranian, and Hellenistic traditions, the royal house famously converted to Judaism in the first century CE, sending relief to Jerusalem during famines.
  extra_images:
    - { url: /images/extra/kingdom-of-adiabene-1.webp, credit: "Hanay, CC BY-SA 3.0, via Wikimedia Commons", caption: "Sarcophagus inscribed 'Queen Ṣaddan', thought to be Queen Helena of Adiabene, who converted to Judaism, from the Tomb of the Kings in Jerusalem, 1st century CE", source: "https://commons.wikimedia.org/wiki/File:Helena_of_Adiabene_Sarcophagus_1.JPG" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=OJwa3suPNao
      title: Helena, Queen of Adiabene
      credit: Treasured Inheritance Ministry Int., YouTube
- id: kingdom-of-commagene
  description: A prosperous Hellenistic buffer kingdom nestled in the Taurus Mountains along the upper Euphrates in modern southeastern Turkey. Ruled by the Orontid dynasty claiming descent from both Persian kings and Alexander the Great, the kingdom is renowned for the monumental mountaintop sanctuary of Mount Nemrut built by King Antiochus I.
  image_url: /images/civilisations/kingdom-of-commagene.webp
  image_caption: Mount Nemrut sanctuary in the Kingdom of Commagene, featuring King Antiochus I beside the Herakles dexiosis stele, Lion Horoscope relief, and colossal seated god statues before the tumulus peak.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/kingdom-of-commagene-1.webp, credit: "Dosseman, CC BY-SA 4.0, via Wikimedia Commons", caption: "Colossal enthroned statues of gods and King Antiochus I on the east terrace of his tomb-sanctuary at Nemrut Dağ, 1st century BCE", source: "https://commons.wikimedia.org/wiki/File:Nemrut_Enthroned_statues_on_east_terrace_in_2006_1474.jpg" }
    - { url: /images/extra/kingdom-of-commagene-2.webp, credit: "Klearchos Kapoutsis, CC BY 3.0, via Wikimedia Commons", caption: "Fallen stone heads of the colossal statues at Nemrut Dağ", source: "https://commons.wikimedia.org/wiki/File:Heads_Nemrut_dag_temple.jpg" }
    - { url: /images/extra/kingdom-of-commagene-3.webp, credit: "Verity Cridland, CC BY 2.0, via Wikimedia Commons", caption: "Relief of Antiochus I of Commagene shaking hands with Herakles, at Arsameia on the Nymphaios", source: "https://commons.wikimedia.org/wiki/File:Nemrut_Dag_area_A_Commagene_carving.jpg" }
    - { url: /images/extra/kingdom-of-commagene-4.webp, credit: "Carole Raddato, CC BY-SA 2.0, via Wikimedia Commons", caption: "Arsameia on the Nymphaios, a royal seat and sanctuary of the kings of Commagene", source: "https://commons.wikimedia.org/wiki/File:Arsameia,_kingdom_of_Commagene,_Turkey_(36270545500).jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=EOpfF1sQrX4
      title: Mount Nemrud I Remastered
      credit: Tolga Örnek, YouTube
- id: kingdom-of-gordyene
  description: An ancient mountain principality located south of Lake Van in the rugged upper Tigris basin of southeastern Anatolia. Inhabited by fiercely independent Carduchians, Gordyene frequently shifted allegiance between the Roman, Armenian, and Parthian empires to preserve its autonomy along strategic mountain corridors.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=iummGCh1Rrw
      title: The History of the Kurds in the Ancient Period
      credit: Mîlan & Zîlan, YouTube
- id: kingdom-of-osroene
  description: A prominent kingdom in Upper Mesopotamia centered on the Hellenistic city of Edessa (modern Şanlıurfa, Turkey). Positioned on lucrative caravan trade routes, Osroene maintained semi-independence under an Arab Abgarid dynasty for centuries, becoming one of the earliest regional states to embrace Syriac Christian culture before direct Roman rule.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=d65GZQ9gIoE
      title: "The Life and Reign of Abgar VIII: King of Osroene"
      credit: Secret Record, YouTube
- id: lazica
  description: An ancient Georgian successor kingdom to Colchis located along the southeastern Black Sea coast in modern western Georgia (Egrisi). Controlling strategic Caucasian alpine trade passes, Lazica was a vital battleground and client buffer state contested between the Eastern Roman (Byzantine) and Sasanian Persian empires.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=7Wkien4HwJc
      title: "E31 - The Kingdom of Lazica | The History of Saqartvelo Georgia"
      credit: The History Of Saqartvelo Georgia, YouTube

