    - { url: /images/extra/lydia-4.webp, credit: "BabelStone, CC0, via Wikimedia Commons", caption: "Archaic Lydian marble tomb relief panel showing an elite horse and bridle, from the royal necropolis of Bin Tepe (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Britishmuseumbintepehorserelief.jpg" }
