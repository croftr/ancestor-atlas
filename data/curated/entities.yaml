- id: clovis
  name: Clovis
  category: culture
  start_year: -12050
  end_year: -9681
  description: "Around 13,000 years ago a distinctive way of making stone spear points spread across North America. Clovis points, named after finds near Clovis, New Mexico, in the 1930s, have a channel struck from the base so they could be bound to a shaft, and they turn up from the Atlantic coast to the Rockies, sometimes beside the bones of mammoths. Clovis was long thought to mark the first Americans, but older sites such as Monte Verde in Chile show people had arrived thousands of years before."
  narration: { src: narration/cultures/clovis-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "20e58f3384" }
