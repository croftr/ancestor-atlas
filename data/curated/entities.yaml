      src: https://www.youtube.com/watch?v=z9YwfTerAdA
      title: "3. The Mayans - Ruins Among the Trees"
      credit: Fall of Civilizations, YouTube
- id: parthian-empire
  description: A major Iranian empire founded in 247 BCE by Arsaces I after the Parni tribe seized Parthia from the Seleucid Empire. Governed through a decentralized feudal nobility and famed for invincible armored cataphracts and mounted archers utilizing the deceptive 'Parthian shot', the Arsacids dominated Silk Road trade and repeatedly repelled Roman legions until overthrown by the Sasanians.
  image_url: /images/civilisations/parthian-empire.webp
  image_caption: Ctesiphon and Hatra in the Parthian Empire, featuring the bronze Shami nobleman statue, Nisa ivory rhytons, armored cataphract lancers, and horse archers firing the Parthian shot.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/parthian-empire-1.webp, credit: "Nasser-sadeghi, CC BY-SA 4.0, via Wikimedia Commons", caption: "Monumental bronze statue of a Parthian prince or nobleman in aristocratic belted tunic from the sanctuary at Shami (National Museum of Iran, Tehran)", source: "https://commons.wikimedia.org/wiki/File:Parthian_man_statue.jpg" }
    - { url: /images/extra/parthian-empire-2.webp, credit: "Hans Birger Nilsen, CC BY 2.0, via Wikimedia Commons", caption: "Carved ivory drinking rhytons terminating in mythical horned lion-griffins and centaurs, from royal Old Nisa, 2nd century BCE (Turkmenistan)", source: "https://commons.wikimedia.org/wiki/File:Parthian_ivory_rhytons_from_Old_Nisa_(1)_(45282255565).jpg" }
    - { url: /images/extra/parthian-empire-3.webp, credit: "Public domain, via Wikimedia Commons", caption: "Silver drachm of King Mithridates II the Great wearing the royal diademed tiara with eight-pointed star, c. 123–88 BCE", source: "https://commons.wikimedia.org/wiki/File:Coin_of_Mithridates_II_of_Parthia.jpg" }
    - { url: /images/extra/parthian-empire-4.webp, credit: "Public domain, via Wikimedia Commons", caption: "Parthian-era high-relief limestone carving of the god Nergal holding a battleaxe and leashed cerberus, from the desert city of Hatra (Iraq)", source: "https://commons.wikimedia.org/wiki/File:Ancient_Parthian_relief_carving_of_the_god_Nergal_from_Hatra.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=c_Fbyc415yM
      title: "The Rise and Fall of Parthia - Rome's Greatest Enemy - Ancient Civilizations"
      credit: Kings and Generals, YouTube
- id: wusun
  description: An ancient semi-nomadic Indo-European pastoral confederation that inhabited the Ili Valley and Issyk-Kul basin of Central Asia (modern Kazakhstan and Kyrgyzstan). Major players on the northern Silk Road, the Wusun formed strategic diplomatic and marital alliances with Han China to counter their mutual rivals, the Xiongnu steppe empire.
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=NaqY7GKobJk
      title: "Indo-Europeans of Gansu: Yuezhi, Wusun & the Forgotten Cultures of the Hexi Corridor"
      credit: Lapis Lazuli, YouTube
- id: great-yuan
  description: An urbanized Hellenistic civilization in the fertile Fergana Valley of Central Asia (modern Uzbekistan, Kyrgyzstan, and Tajikistan), recorded in Chinese chronicles as Dayuan ('Great Ionians'). Famed for walled cities and prized, blood-sweating 'Heavenly Horses', Dayuan fought the War of the Heavenly Horses (104–101 BCE) against Han China, initiating direct Chinese commercial ties to the West.
  image_url: /images/civilisations/great-yuan.webp
  image_caption: Dayuan in the Fergana Valley, Central Asian horse breeders presenting a prized Heavenly Horse to Han Dynasty envoys bearing silk and bronze.
  image_credit: AI-generated illustration
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=g6Rphg_lwwM
      title: "The Greco-Chinese War Over the Heavenly Horses"
      credit: Kings and Generals, YouTube
- id: thracian-kingdom
  description: The various historical dynastic realms and tribal unions established by the Thracian peoples across the eastern Balkan Peninsula, southern Romania, and the Aegean coast. Celebrated as skilled horsemen, metalworkers, and peltast infantry, the Thracians maintained vibrant oral and spiritual traditions while contested by Macedonian, Celtic, and Roman imperial armies.
  extra_images:
    - { url: /images/extra/thracian-kingdom-1.webp, credit: "Hermann Junghans, CC BY-SA 3.0 de, via Wikimedia Commons", caption: "Bronze coin of Rhoemetalces I, client king of Thrace under Augustus (about 12 BCE–12 CE), with his queen", source: "https://commons.wikimedia.org/wiki/File:Rhoimetalkes_I.JPG" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=5AJW31Q-jg4
      title: "History of the Thracians - Ancient Civilizations DOCUMENTARY"
      credit: Kings and Generals, YouTube
- id: kingdom-of-axum
  description: A powerful maritime and trading empire centered in northern Ethiopia and Eritrea, flourishing along the Red Sea and Gulf of Aden. Positioned along spice and silk routes connecting Rome to India, Axum developed the Ge'ez script, erected colossal monolithic granite stelae, minted its own gold coinage, and adopted Christianity under King Ezana.
  image_url: /images/civilisations/kingdom-of-axum.webp
  image_caption: Royal city of Axum in the Ethiopian highlands with carved monolithic granite stelae, Ta'akha Maryam stone-and-timber palace, and ivory trade.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/kingdom-of-axum-1.webp, credit: "Ondřej Žváček, CC BY 2.5, via Wikimedia Commons", caption: "The 24-meter monolithic granite Stele of King Ezana (Obelisk of Axum), carved with multi-storey false architectural windows and doors (Northern Stelae Park, Axum)", source: "https://commons.wikimedia.org/wiki/File:Rome_Stele.jpg" }
    - { url: /images/extra/kingdom-of-axum-2.webp, credit: "Ismoon, CC BY-SA 4.0, via Wikimedia Commons", caption: "Gold coin of King Ezana of Axum bearing the Christian cross, wheat stalks, and Greek inscription, c. 340 CE (British Museum)", source: "https://commons.wikimedia.org/wiki/File:Ezana_gold_coin_with_cross._British_Museum._1921,0316.1.jpg" }
    - { url: /images/extra/kingdom-of-axum-3.webp, credit: "A. Davey, CC BY 2.0, via Wikimedia Commons", caption: "The Ezana Stone, a 4th-century trilingual stela inscribed in Ge'ez, Sabaean, and Greek detailing King Ezana's military campaigns (Axum, Ethiopia)", source: "https://commons.wikimedia.org/wiki/File:The_Ezana_Stone_(2840202630).jpg" }
    - { url: /images/extra/kingdom-of-axum-4.webp, credit: "A.Savin, FAL (Free Art License), via Wikimedia Commons", caption: "The monumental stone and timber foundations of the Dungur palace complex in Axum, dating to the height of the Axumite Empire", source: "https://commons.wikimedia.org/wiki/File:ET_Axum_asv2018-01_img45_Dungur.jpg" }
  media:
    - kind: video
      src: https://www.youtube.com/watch?v=LdSFpSarZkA
      title: "Kingdom of Aksum: Africa’s Forgotten Superpower | Full Documentary"
      credit: STORIES NETWORK, YouTube
- id: teotihuacan
  description: "In the Valley of Mexico, north-east of today's Mexico City, a small town grew in the last century BCE into one of the largest cities in the world. Teotihuacan was laid out on a grid along a broad avenue, with the vast Pyramid of the Sun and the Pyramid of the Moon at its heart, and at its height perhaps a hundred thousand people lived there in walled apartment compounds, some of them migrants from far away. Its influence reached as far as the Maya city of Tikal, a thousand kilometres away. Around 550 CE its centre was burned, and the city slowly emptied."
  narration: { src: narration/civilizations/teotihuacan-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "e838ea8957" }
  image_url: /images/civilisations/teotihuacan.webp
  image_caption: Avenue of the Dead toward the Pyramids of the Sun and Moon, workshops knapping green Pachuca obsidian and painting feathered serpent murals.
  image_credit: AI-generated illustration
  extra_images:
    - { url: /images/extra/teotihuacan-1.webp, credit: "Peachseltzer, CC BY-SA 4.0, via Wikimedia Commons", caption: "The Temple of the Feathered Serpent (Quetzalcoatl) at Teotihuacan, showing alternating high-relief carvings of feathered serpents and rain deities", source: "https://commons.wikimedia.org/wiki/File:Temple_of_Feathered_Serpent_view_from_top_of_Adosada_platform_Teotihuacan.jpg" }
    - { url: /images/extra/teotihuacan-2.webp, credit: "Rama, CC BY-SA 3.0 fr, via Wikimedia Commons", caption: "Carved green serpentine funerary mask from Teotihuacan, characteristic of classic highland Mesoamerican stone lapidary portraiture", source: "https://commons.wikimedia.org/wiki/File:Mask_Teotihuacan_sculpture-70.1999.12.1-DSC00140-black.jpg" }
    - { url: /images/extra/teotihuacan-3.webp, credit: "Thomas Aleto, CC BY 2.0, via Wikimedia Commons", caption: "Mural of the Great Goddess of Teotihuacan from the Tepantitla apartment compound, depicted beneath an exuberant flowering tree of life", source: "https://commons.wikimedia.org/wiki/File:Great_Goddess_of_Teotihuacan_(T_Aleto).jpg" }
    - { url: /images/extra/teotihuacan-4.webp, credit: "Daniel Case, CC BY-SA 3.0, via Wikimedia Commons", caption: "The monumental Pyramid of the Sun rising over 65 meters above the Valley of Mexico along the Avenue of the Dead at Teotihuacan", source: "https://commons.wikimedia.org/wiki/File:Pyramid_of_the_Sun,_Teotihuacan,_from_path_to_parking_lot.jpg" }
  media:
