    - { url: /images/extra/odrysian-kingdom-4.webp, credit: "Institute of Balkan Studies, CC BY-SA 4.0, via Wikimedia Commons", caption: "Thracian silver and silver-gilt phialai and pitchers from the Rogozen Treasure, decorated with mythological and hunting reliefs (Vratsa)", source: "https://commons.wikimedia.org/wiki/File:Rogozen_treasure.jpg" }
