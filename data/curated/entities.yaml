- id: peloponnesian-league
  description: A major military confederation of Greek city-states in the Peloponnese, founded and led by Sparta from the 6th to 4th centuries BCE. Formed to ensure mutual security and check rival Argive power, the league formed the core of the Hellenic alliance against Persia and ultimately defeated the Athenian Empire in the Peloponnesian War.
  extra_images:
    - { url: /images/extra/peloponnesian-league-1.webp, credit: "Mary Harrsch, CC BY-SA 4.0, via Wikimedia Commons", caption: "Marble hoplite known as 'Leonidas', from the sanctuary of Athena Chalkioikos on the acropolis of Sparta, 480–470 BCE (Archaeological Museum of Sparta)", source: "https://commons.wikimedia.org/wiki/File:Statue_of_a_hoplite_known_as_Leonidas_480-470_BCE_Sparta_Acropolis_Sanctuary_of_Athena_Chalkioikos_01.jpg" }
