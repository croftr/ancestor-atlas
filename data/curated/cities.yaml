- id: memphis
  name: Memphis
  start_year: -3099
  end_year: 1
  date_text: c. 3100 BCE – 7th century CE
  description: "Memphis, at the head of the Nile Delta just south of modern Cairo, was the capital of Egypt in the Early Dynastic Period and the Old Kingdom. Later legend said King Menes founded it, before 3000 BCE, and the pyramid fields of the kings, Giza among them, stretch for more than 30 kilometres along the desert to its west. Its port was crowded with workshops, factories and warehouses, and its great temple belonged to Ptah, the god of craftsmen. The temple's name, Hut-ka-Ptah, became Aigyptos in Greek, the origin of the word Egypt. Memphis stayed one of Egypt's great cities for three thousand years, until Alexandria on the coast drew away its trade and Christianity replaced its old religion. By the Middle Ages nearby Cairo had taken its place, and today its ruins lie scattered around the village of Mit Rahina."
  narration: { src: narration/cities/memphis-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "63309112c7" }
  part_of: ancient-egypt
