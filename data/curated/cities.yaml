- id: jericho
  name: Jericho
  start_year: -9999
  end_year: -331
  date_text: c. 10,000 – c. 330 BCE, with long gaps
  # Tell_es-Sultan's infobox says abandoned c. 900 BCE; its text (Iron Age, Abandonment of the tell) has the town destroyed
  # in 587/586 BCE, rebuilt in the Persian period and abandoned not long after: end_year follows the text (c. 330 BCE).
  description: "Ancient Jericho is the mound of Tell es-Sultan, beside the spring of Ein es-Sultan in the Jordan Valley, in Palestine. Natufian hunter-gatherers began to live there all year round between 10,000 and 9000 BCE, and from about 8500 BCE it became one of the first proto-cities: round houses of sun-dried mud brick, for perhaps a few hundred or a few thousand people. Around 8300 BCE they built a stone wall and a great stone tower, the tallest building in the world until the first pyramid. Later Neolithic villagers modelled faces in plaster on the skulls of their dead. The town was destroyed, abandoned and rebuilt many times; its largest Bronze Age city, a Canaanite one with walls and towers, flourished from about 1700 to 1550 BCE. The Babylonians destroyed Jericho in 587 BCE; it was rebuilt under the Persians, and soon after the mound was left for good."
  narration: { src: narration/cities/jericho-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "990dd4d874" }
  part_of: pre-pottery-neolithic
