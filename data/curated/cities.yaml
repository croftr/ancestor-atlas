- id: catalhoyuk
  name: Çatalhöyük
  start_year: -7099
  end_year: -5599
  date_text: c. 7100 – c. 5600 BCE
  # The article's lead says c. 7500-5600 BC, its infobox c. 7100-5600 BC: the dates follow the infobox.
  description: "Çatalhöyük, on the Konya Plain in southern Turkey, was one of the largest and best-preserved Neolithic settlements, a proto-city lived in from around 7100 to 5600 BCE. Its mud-brick houses were packed so tightly together, like a honeycomb, that there were no streets: the rooftops served instead, and people climbed down into their homes by ladders through openings in the roof, which also let out the smoke of their hearths and ovens. There were no obvious public buildings, only houses, some with painted walls. Early estimates put its people at 5,000 to 7,000; newer work suggests 600 to 800 at any one time. Genetic studies published in 2025 suggest that households passed from mother to daughter. Among its many figurines is a woman seated between two lionesses, once taken for a mother goddess, a reading most archaeologists now doubt."
  narration: { src: narration/cities/catalhoyuk-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "79a8fb7990" }
  part_of: pre-pottery-neolithic
