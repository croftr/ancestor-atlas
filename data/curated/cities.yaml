- id: harappa
  name: Harappa
  start_year: -3299
  end_year: -1299
  date_text: c. 3300 – c. 1300 BCE
  description: "Harappa, beside an old course of the Ravi River in Punjab, Pakistan, gave its name to the Harappan or Indus Valley Civilisation. Settled around 3300 BCE, it reached its greatest size in the mature phase, from about 2600 to 1900 BCE, when its brick houses covered some 150 hectares and it was home to perhaps 23,500 people. With Mohenjo-daro it was one of the two greatest cities of the Indus. Its people used standard weights and measures and carved seals, perhaps to mark their goods; they grew wheat and rice, wove and dyed cotton, and kept humped cattle. After about 1900 BCE the civilisation slowly broke down, and by around 1300 BCE Harappa was abandoned. Under British rule much of the ruined city was dug up for bricks to lay the railway from Lahore to Multan."
  narration: { src: narration/cities/harappa-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "ead7182caa" }
