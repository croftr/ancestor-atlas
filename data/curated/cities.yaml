- id: mohenjo-daro
  name: Mohenjo-daro
  start_year: -2499
  end_year: -1699
  date_text: c. 2500 – c. 1700 BCE
  description: "Mohenjo-daro, in Sindh in what is now Pakistan, was built around 2500 BCE and became one of the largest cities of the Indus Valley Civilisation, home to perhaps 40,000 people. It was planned: straight streets on a grid, houses of fired brick around inner courtyards, and covered drains along the main streets to carry waste water away. More than 700 wells, about one for every three houses, gave it water. On a raised mud-brick citadel stood its public buildings, among them the Great Bath, a brick pool sealed with bitumen that may have been used for ritual washing. Its people cast copper and bronze, carved stone seals, and made jewellery of gold and jasper. By about 1700 BCE, as the Indus cities declined, it had been abandoned. Its real name is lost: Mohenjo-daro means 'Mound of the Dead Men'. The ruins were rediscovered in the 1920s."
  narration: { src: narration/cities/mohenjo-daro-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "2552534678" }
  part_of: indus-valley-civilization
