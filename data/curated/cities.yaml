- id: ur
  name: Ur
  start_year: -3799
  end_year: -499
  date_text: c. 3800 – after 500 BCE
  description: "Ur, in the south of what is now Iraq, began as an Ubaid village around 3800 BCE beside the Persian Gulf, whose shore has since moved far away, and grew into one of the great Sumerian city-states, the city of the moon god Nanna. Its Royal Tombs, from around 2600 BCE, were filled with gold, silver and precious stones brought from as far as Iran, Afghanistan and India; Queen Puabi was buried there with her golden headdress and many attendants. Sargon of Akkad made his daughter Enheduanna high priestess at Ur, and her hymns may make her the first author in history known by name. Around 2100 BCE King Ur-Nammu built the great ziggurat, and under its Third Dynasty Ur ruled the cities of Sumer until the Elamites captured its last king, about 2000 BCE. Ur lived on as a holy city, its ziggurat rebuilt by Nabonidus, the last king of Babylon, and was abandoned some time after 500 BCE."
  narration: { src: narration/cities/ur-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "0fe7b6b79c" }
  part_of: sumerian-city-states
