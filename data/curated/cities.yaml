- id: knossos
  name: Knossos
  start_year: -6999
  end_year: 1
  date_text: c. 7000 BCE – 1st millennium CE
  description: "Knossos, on a hill just south of Heraklion in Crete, is often called Europe's oldest city. Farmers settled there around 7000 BCE, and early in the second millennium BCE the village grew quickly into a town and the greatest centre of the Minoan civilisation. Its palace, first built around 1900 BCE and rebuilt after a destruction around 1700 BCE, gathered halls, storerooms, shrines, stairways and light wells round a central court, with drains and richly painted walls. Later Greeks remembered its tangled plan as the Labyrinth of King Minos and the Minotaur. After damage around 1450 BCE Knossos became a Mycenaean centre, whose scribes kept accounts in Linear B, an early form of Greek. The palace was destroyed around 1350 BCE, but Knossos stayed one of the leading cities of Crete through Greek and Roman times and into the Byzantine period."
  narration: { src: narration/cities/knossos-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "e4f09b6f21" }
