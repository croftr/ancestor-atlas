- id: babylon
  name: Babylon
  start_year: -2199
  end_year: 1
  date_text: c. 2200 BCE – c. 1000 CE
  description: "Babylon, on the Euphrates south of what is now Baghdad, first appears around 2200 BCE as a small town of the Akkadian Empire. In the 18th century BCE the Amorite king Hammurabi made it the capital of an empire over all southern Mesopotamia and set down his famous code of laws, and from then on the whole region was called Babylonia. Sacked by the Hittites in 1595 BCE and ruled in turn by Kassites, Assyrians and Elamites, it rose again as the capital of the Neo-Babylonian Empire, from 626 to 539 BCE. Nebuchadnezzar II rebuilt it in baked brick; its walls, and its Hanging Gardens, if they ever existed, were counted among the Seven Wonders of the ancient world. Babylon was probably the largest city in the world around 1700 BCE and again from about 600 BCE, perhaps the first to pass 200,000 people. Persians, Alexander the Great, Seleucids and Parthians ruled it after; it dwindled slowly, until only a small village was left by the 11th century CE."
  narration: { src: narration/cities/babylon-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "86690f8692" }
  part_of: babylonia
  related: [akkadian-empire, assyria, neo-assyrian-empire, neo-babylonian-empire, achaemenid-empire, seleucid-empire, parthian-empire]
