# Cities and towns (category "city"): one entity each, one point on the globe.
#
# A city is any lasting town or city, disputed or not (Rob's call, 1 Nov 2026). Its span is its life as a settlement,
# from founding to abandonment, in astronomical years (1 CE = 1, 1 BCE = 0, N BCE = 1 - N). The atlas ends at 1 CE, so a
# city that lived on is cut at `end_year: 1` and `date_text` says when it really ended (the card shows date_text).
# `date_source` pins the English Wikipedia revision the dates were checked against; the point's coordinates come from
# Wikidata (P625 of `wikidata`) unless `coord_source` says otherwise; `note` marks a place-level point.
# `part_of`: the civilization or culture the city belongs to (shown on its card and used for its section on the Cities
# page); `related`: others it grew out of or was ruled by (civilizations, cultures). Events can name a city in their
# `related`, and the city's page lists them. The Cities page groups cities by `region`, worked out from the point
# (scripts/lib/regions.ts) unless set here.
# Pictures: `image_url` is the main picture, 1200x900 (4:3) WebP in public/images/cities/<id>.webp with a 600x450
# companion <id>-600.webp, plus `image_credit` and, for an AI-generated one, `image_caption`. `extra_images` as for
# events and entities ({ url, credit, caption, source }), in public/images/extra/<id>-<n>.webp.
# Narration: npm run audio:narrate -- <id> (bucket key narration/cities/<id>-v<n>.mp3).

- id: uruk
  name: Uruk
  start_year: -4999
  end_year: 1
  date_text: c. 5000 BCE – c. 700 CE
  description: "Uruk, in the south of what is now Iraq, was one of the world's first cities. Two small Ubaid farming villages beside a channel of the Euphrates grew into the twin towns of Unug and Kullaba, which merged into one. By about 3100 BCE Uruk may have held up to 50,000 people, the largest city on Earth at the time. At its heart stood two temple districts, Eanna for the goddess Inanna and the terraced Anu district, ringed by workshops and by houses grouped by trade, and canals ran through its streets to the river and the fields. Thousands of the earliest written clay tablets were found there, from about 3300 to 2900 BCE. Later legend made Gilgamesh its king and the builder of its walls. Uruk lost its lead when the Akkadian Empire rose, but revived again and again, under Ur, the Assyrians, the Babylonians and the Seleucids, and was not abandoned until about 700 CE."
  narration: { src: narration/cities/uruk-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "1d4a2bdb3c" }
  part_of: sumerian-city-states
  related: [ubaid, akkadian-empire, babylonia, neo-assyrian-empire, neo-babylonian-empire, achaemenid-empire, seleucid-empire, parthian-empire]
