- id: yinxu
  name: Yinxu (Yin)
  start_year: -1249
  end_year: -1045
  date_text: c. 1250 – 1046 BCE
  description: "Yin, whose ruins at Anyang in Henan are called Yinxu, was the last capital of the Shang dynasty, home to twelve Shang kings from about 1250 BCE until the dynasty fell in 1046 BCE. Its palaces and temples stood among royal tombs, workshops for bronze and bone, and pits of sacrificed people, animals and chariots. Its bronze-casters made vessels such as the great Houmuwu ding by a piece-mould method. More than 100,000 oracle bones found there carry the earliest known Chinese writing. The best-preserved royal tomb, never looted, is that of Fu Hao, a military leader and the wife of King Wu Ding, buried around 1250 BCE with dogs, sixteen servants and a wealth of bronzes and jades. The city was then forgotten for three thousand years, until oracle bones turned up for sale nearby in 1899."
  narration: { src: narration/cities/yinxu-v1.mp3, credit: "AI-generated narration (ElevenLabs)", text_hash: "18ac83c5df" }
